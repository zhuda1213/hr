<!doctype html>
<html lang="zh-CN" data-page-node-id="hpIpcFzhHwVRDsXXdd5p1z">
<head data-page-node-id="kpSVa2w2lOV3iuVGOs01cf">
<meta charset="utf-8" data-page-node-id="BM52AjXGZfbESCJLNmANGj">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="t5RT18et1ZnBcHtnSv2AXd">
<title>红星招聘 · HR 管理后台</title>
<style>
:root{
  --brand:#1668dc;--brand-d:#0b4fa6;--brand-l:#e8f1fd;
  --ink:#1a1a1a;--ink2:#5c5c5c;--ink3:#8a8a8a;--ink4:#b0b0b0;
  --line:#e6e8eb;--line2:#d3d7dd;--bg:#f4f5f7;--white:#fff;
  --ok:#12a150;--okl:#e8f6ee;--warn:#c8811a;--warnl:#fdf3e3;
  --danger:#d9392b;--dangerl:#fdeceb;--purple:#6f42c1;--purplel:#f1ecfa;
  --side:#17233d;--side2:#0f1930;
  --r:10px;--sd:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit;font-size:14px;outline:none}
table{border-collapse:collapse;width:100%}

/* ---------- 登录 ---------- */
.login{position:fixed;inset:0;display:flex;background:var(--side)}
.login-l{flex:1;background:linear-gradient(135deg,#0f1930 0%,#1c3a6e 100%);color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:center}
.login-l h1{font-size:30px;letter-spacing:1px;margin-bottom:14px}
.login-l p{color:#a9bcd8;font-size:15px;max-width:420px;line-height:1.9}
.login-l .mk{width:52px;height:52px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-bottom:24px}
.login-l .tags{margin-top:32px;display:flex;gap:10px;flex-wrap:wrap}
.login-l .tags span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;font-size:12.5px;color:#cfe0f5}
.login-r{width:440px;background:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
.login-r h2{font-size:21px;margin-bottom:6px}
.login-r .sub{color:var(--ink3);font-size:13px;margin-bottom:26px}
.acct{border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:9px;transition:.15s}
.acct:hover{border-color:#b9cdf0;background:#fafcff}
.acct.on{border-color:var(--brand);background:var(--brand-l);box-shadow:0 0 0 2px rgba(22,104,220,.12)}
.acct .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.acct .av.g{background:#7a8699}.acct .av.p{background:var(--purple)}
.acct b{font-weight:600;font-size:14px}
.acct small{display:block;color:var(--ink3);font-size:12px}
.acct .rl{margin-left:auto;font-size:11.5px;padding:2px 8px;border-radius:4px;background:#f0f2f5;color:var(--ink2)}

/* ---------- 布局 ---------- */
.shell{display:flex;min-height:100vh}
.side{width:216px;background:var(--side);color:#c3d0e2;flex:none;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.side .lg{height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.side .lg .mk{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.side .lg b{color:#fff;font-size:15px;letter-spacing:.5px}
.side .nav{padding:12px 10px;flex:1;overflow:auto}
.side .nav .gp{font-size:11px;color:#6b7c96;padding:12px 10px 6px;letter-spacing:1px}
.side .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;cursor:pointer;color:#c3d0e2;font-size:14px;margin-bottom:2px}
.side .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side .nav a.on{background:var(--brand);color:#fff;font-weight:500}
.side .nav a .cnt{margin-left:auto;background:rgba(255,255,255,.14);border-radius:10px;padding:0 7px;font-size:11.5px}
.side .nav a.on .cnt{background:rgba(255,255,255,.25)}
.side .ft{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#6b7c96}
.wrap{flex:1;margin-left:216px;display:flex;flex-direction:column;min-width:0}
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:15}
.top h2{font-size:16px;font-weight:600}
.top .crumb{color:var(--ink3);font-size:13px}
.top .sp{flex:1}
.top .who{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2)}
.top .who .av{width:30px;height:30px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:600}
.main{padding:20px 22px 40px;flex:1}

/* ---------- 组件 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sd);margin-bottom:16px}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card .hd h3{font-size:14.5px;font-weight:600}
.card .hd .sp{flex:1}
.card .bd{padding:16px 18px}
.card .bd.np{padding:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sd)}
.stat .lb{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stat .vl{font-size:27px;font-weight:700;line-height:1.3;margin-top:4px;letter-spacing:-.5px}
.stat .ex{font-size:12px;color:var(--ink3);margin-top:2px}
.stat.b .vl{color:var(--brand)}.stat.g .vl{color:var(--ok)}.stat.o .vl{color:var(--warn)}.stat.p .vl{color:var(--purple)}
/* 漏斗行：值列更宽，容纳「人数 · 转化率」 */
.frow .bl{width:82px;color:var(--ink2);flex:none;text-align:right}
.frow .btr{flex:1;height:9px;background:#f0f2f5;border-radius:5px;overflow:hidden}
.frow .btr i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.frow .fv{width:74px;flex:none;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.frow .fv em{font-style:normal;font-size:11px;color:var(--ink3)}

.btn{height:34px;padding:0 15px;border-radius:7px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{background:#0d8a44;color:#fff}
.btn.dg{background:var(--danger);border-color:var(--danger);color:#fff}.btn.dg:hover{background:#bf2f23;color:#fff}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink2)}.btn.gh:hover{background:#f2f4f7;color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:6px}
/* 图标小按钮：用于附件下载等行内操作 */
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--line,#e2e6ee);border-radius:6px;background:#fff;color:#5b6472;cursor:pointer;vertical-align:middle;transition:all .15s}
.ibtn:hover{color:var(--pri,#2f6bff);border-color:var(--pri,#2f6bff);background:#f2f6ff}
.ibtn svg{display:block}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dgg{color:var(--danger);border-color:#f3cfcb}.btn.dgg:hover{background:var(--dangerl);border-color:var(--danger);color:var(--danger)}

.ip{height:34px;border:1px solid var(--line2);border-radius:7px;padding:0 11px;width:100%;color:var(--ink);background:#fff}
.ip:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,104,220,.12)}
select.ip{cursor:pointer}
textarea.ip{height:auto;padding:9px 11px;line-height:1.7;resize:vertical}
.ip.err{border-color:var(--danger);background:#fffafa}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.fld label i{color:var(--danger);font-style:normal;margin-left:2px}
.fld .hint{font-size:12px;color:var(--ink3);margin-top:5px}
.fld .err2{font-size:12px;color:var(--danger);margin-top:5px;display:none}
.fld.bad .err2{display:block}
/* 不合适处理：三选一单选项 */
.rjopts{display:flex;flex-direction:column;gap:8px}
.rjopt{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff}
.rjopt:hover{border-color:#c8d4e6}
.rjopt.on{border-color:var(--brand);background:#f3f8ff}
.rjopt input{margin:2px 0 0;accent-color:var(--brand);cursor:pointer}
.rjopt .t{font-size:13.5px;color:var(--ink);line-height:1.5}
.rjopt .d{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:1px}
/* 附件上传组件（PDF / Word / 图片，可多选） */
.upz{border:1px dashed var(--line2);border-radius:9px;background:#fafbfc;padding:16px 12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.upz:hover,.upz.on{border-color:var(--brand);background:#f6faff}
.upz .ic{color:#9db0c9;line-height:0}
.upz .t{font-size:13px;color:var(--ink2);margin-top:5px}
.upz .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.upl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.upf{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff}
.upf .bd{flex:0 0 auto;width:34px;height:28px;border-radius:5px;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.2px}
.upf .nm{flex:1;min-width:0;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upf .sz{flex:0 0 auto;font-size:11.5px;color:var(--ink3)}
.upf .x{flex:0 0 auto;border:0;background:none;color:var(--ink3);cursor:pointer;font-size:15px;line-height:1;padding:2px 3px}
.upf .x:hover{color:var(--danger)}

/* ---------- 富文本正文编辑器（B-55） ---------- */
.rte{border:1px solid var(--line2);border-radius:8px;background:#fff;overflow:hidden}
.rte:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,104,220,.08)}
.rte-tb{display:flex;gap:2px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line);background:#fafbfc}
.rte-tb .sp2{width:1px;height:15px;background:var(--line2);margin:0 5px}
.rte-b{min-width:27px;height:25px;padding:0 7px;border:none;background:transparent;border-radius:5px;cursor:pointer;
  font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center}
.rte-b:hover{background:#eceff4;color:var(--ink)}
.rte-b:active{background:var(--brand-l);color:var(--brand-d)}
.rte-bd{min-height:230px;max-height:44vh;overflow:auto;padding:12px 14px;font-size:13.5px;line-height:1.95;
  color:var(--ink);outline:none;word-break:break-word}
.rte.mini .rte-bd{min-height:96px;max-height:210px;line-height:1.8}
.fld.bad .rte{border-color:var(--danger)}
.rte-bd:empty:before{content:attr(data-ph);color:var(--ink4)}
.rte-bd p{margin:0 0 8px}
.rte-bd ul,.rte-bd ol{margin:0 0 8px;padding-left:22px}
.rte-bd li{margin:2px 0}
.rte-bd b,.rte-bd strong{font-weight:700}
.varbar{margin-top:9px}
.varbar .lb{font-size:12px;color:var(--ink3);margin-bottom:6px}
.varbar .vs{display:flex;gap:6px;flex-wrap:wrap}
.vchip{font-size:12px;padding:3px 9px;border-radius:14px;border:1px solid var(--line2);background:#fff;
  color:var(--ink2);cursor:pointer;line-height:1.7;user-select:none}
.vchip:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-l)}
.vchip i{font-style:normal;color:var(--danger);margin-left:1px}

/* ---------- 福利待遇标签输入（无内容时点选 / 可删可自定义） ---------- */
.tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:42px;padding:6px 9px;
  border:1px solid var(--line2);border-radius:8px;background:#fff;cursor:text}
.tagbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,104,220,.08)}
.tgchip{display:inline-flex;align-items:center;gap:3px;background:var(--brand-l);color:var(--brand-d);
  border-radius:5px;padding:2px 4px 2px 8px;font-size:12.5px;line-height:1.75}
.tgchip i{font-style:normal;cursor:pointer;color:#7d9bc9;font-size:13px;line-height:1;padding:0 3px;border-radius:3px}
.tgchip i:hover{color:var(--danger);background:#f7dedb}
.tagin{flex:1;min-width:130px;border:none;outline:none;height:26px;font-size:13px;background:transparent;color:var(--ink)}
.tagpool{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.tagpool .tb{font-size:11.5px;color:var(--ink4);margin-right:1px}
.tchip{font-size:12px;padding:3px 10px;border-radius:14px;border:1px solid var(--line2);background:#fff;
  color:var(--ink2);cursor:pointer;line-height:1.7;user-select:none;white-space:nowrap}
.tchip:hover{border-color:var(--brand);color:var(--brand-d)}
.tchip.on{background:var(--brand-l);border-color:#bcd6f7;color:var(--brand-d)}
.tchip.add{border-style:dashed;color:var(--ink3)}
.tchip.add:hover{color:var(--brand-d)}
/* 富文本正文在「纸张」预览与 PDF 中的排版 */
.docbody{font-size:13.5px;line-height:1.95}
.docbody p{margin:0 0 9px}
.docbody ul,.docbody ol{margin:0 0 9px;padding-left:22px}
.docbody li{margin:2px 0}
.docbody h3{font-size:15px;margin:14px 0 8px;font-weight:700}
.docbody blockquote{margin:0 0 9px;padding-left:10px;border-left:3px solid var(--line2);color:var(--ink2)}
.docbody u{text-decoration:underline}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.toolbar .ip{width:auto;min-width:120px}
.toolbar .sr{flex:1;min-width:190px;max-width:300px}

.tbwrap{overflow:auto}
table.data{width:100%;font-size:13.5px}
table.data th{background:#fafbfc;color:var(--ink2);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
table.data td{padding:12px 14px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
table.data tr:hover td{background:#fafbfd}
table.data tr.sel td{background:#f3f8ff}
table.data .tt{font-weight:600;color:var(--ink)}
table.data .mt{font-size:12px;color:var(--ink3);margin-top:3px}
table.data .mt span{margin-right:10px}
/* 列表里的补充说明：纯信息，不做可点击的视觉暗示（不用品牌蓝、不加下划线） */
table.data .mt .mnote{color:var(--ink3);cursor:default;white-space:nowrap}
table.data td.op{white-space:nowrap;text-align:right}
table.data td.op .btn{margin-left:5px}
/* 候选人列表操作列：文字按钮、垂直居中排列（动作多，横排会把表格撑太长） */
table.data td.op .acts{display:flex;flex-direction:column;align-items:center;gap:0}
.op-a{cursor:pointer;font-size:12.5px;line-height:1.75;color:var(--ink2);white-space:nowrap}
.op-a:hover{text-decoration:underline}
.op-a.off{color:var(--ink4);cursor:not-allowed}
.op-a.off:hover{text-decoration:none}
/* 在线简历（候选人 H5 端填写的结构化简历，拆分为四个可折叠模块） */
.rit{padding:9px 0;border-bottom:1px dashed var(--line)}
.rit:last-child{border-bottom:0}
.rhd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rhd b{font-size:13.5px;color:var(--ink)}
.rrole{font-size:12.5px;color:var(--ink2)}
.rtime{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}
.rdesc{font-size:12.5px;color:var(--ink3);margin-top:4px;line-height:1.8;white-space:pre-line}
.rtag{display:inline-block;font-size:12px;color:var(--brand-d);background:var(--brand-l);border-radius:4px;padding:2px 8px;margin:4px 6px 0 0}
.empty{padding:56px 20px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px;font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;line-height:1.7;white-space:nowrap}
.pill.g{background:var(--okl);color:#0b7a3c}
.pill.b{background:var(--brand-l);color:var(--brand-d)}
.pill.o{background:var(--warnl);color:#9a6010}
.pill.r{background:var(--dangerl);color:#b32c20}
.pill.p{background:var(--purplel);color:#5a32a3}
.pill.n{background:#f0f2f5;color:var(--ink2)}
.pill.t{background:#e3f4ef;color:#0f766e}
.pill.a{background:#fdf0dc;color:#8a5300}
.pill .dt{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}

/* 详情内的投递切换（同一候选人多次投递，B-54） */
.ptabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.ptab{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer;line-height:1.6;max-width:100%}
.ptab:hover{border-color:var(--brand);color:var(--brand-d)}
.ptab.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d);font-weight:600;cursor:default}
.ptab .pill{padding:1px 7px;font-size:11.5px;line-height:1.6}
.ptab .tt2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.ptab .n2{font-size:11.5px;color:var(--ink3);font-weight:400}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px}
.tabs a{padding:11px 15px;cursor:pointer;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--brand)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tabs a .n{font-size:12px;color:var(--ink3);margin-left:4px}
.tabs a.on .n{color:var(--brand)}

.brow{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13px}
.brow .bl{width:82px;color:var(--ink2);flex:none;text-align:right}
.brow .btr{flex:1;height:9px;background:#f0f2f5;border-radius:5px;overflow:hidden}
.brow .btr i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.brow .bv{width:34px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:flex-end;gap:6px;height:132px;padding:8px 0 0}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.trend .col i{width:100%;max-width:26px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;display:block}
.trend .col span{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.trend .col b{font-size:11px;color:var(--ink2);font-weight:600}

.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}

function tplBodyHtml(t){
  if(!t)return "";
  if(t.html)return t.body||"";
  return String(t.body||"").split(/\n{2,}/).map(function(x){
    return "<p>"+esc(x).replace(/\n/g,"<br>")+"</p>";
  }).join("");
}
function tplVars(t){
  var src=stripHtml((t.subject||"")+"\n"+tplBodyHtml(t)),out=[],m;
  var re=/\{\{\s*([^{}]+?)\s*\}\}/g;
  while((m=re.exec(src))){if(out.indexOf(m[1])<0)out.push(m[1])}
  return out;
}
function tplTrackKey(t){
  if(!t)return "any";
  if(t.trackKey)return t.trackKey;
  return t.track==="校招"?"campus":(t.track==="社招"?"social":"any");
}
function tplTrackName(t){return TPL_TRACK_NAME[tplTrackKey(t)]||(t&&t.track)||"通用"}
function tplKind(t){return (t&&t.kind)||"offer"}
function tplKindName(t){return TPL_KIND_NAME[tplKind(t)]||"正式 Offer"}
function matchTpl(j){
  var tr=(j&&j.track)||"social",list=enabledTpls().filter(function(t){return tplKind(t)==="offer"});
  var exact=list.filter(function(t){return tplTrackKey(t)===tr})[0];
  var any=list.filter(function(t){return tplTrackKey(t)==="any"})[0];
  var t=exact||any;
  return t?{tpl:t}:null;
}
/* 拟录用模板：优先匹配岗位通道，其次通用，最后取任一启用的拟录用模板 */
function matchPreTpl(j){
  var tr=(j&&j.track)||"social",list=enabledTpls().filter(function(t){return tplKind(t)==="pre"});
  var exact=list.filter(function(t){return tplTrackKey(t)===tr})[0];
  var any=list.filter(function(t){return tplTrackKey(t)==="any"})[0];
  return exact||any||list[0]||null;
}

/* ---------- 生成候选人 ---------- */
function genSubs(jobs){
  var seed=88123;
  function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
  function pick(a){return a[Math.floor(rnd()*a.length)]}
  var pool=jobs.filter(function(j){return !j.demo});
  var pat=[["待筛选","待筛选"],["待筛选","初筛通过"],["初筛通过","面试中"],["待筛选","不合适"],["面试中","已发 offer"],["已发 offer","已发 offer"],["待筛选","面试中"]];
  var out=[],n=0;
  pool.forEach(function(j,ji){
    var st=pat[ji%pat.length];
    st.forEach(function(s,si){
      var nm=NAMES[n%NAMES.length];n++;
      var isCampus=j.track==="campus";
      var degList=isCampus?["本科","本科","硕士"]:[j.deg,"本科","硕士"];
      var deg=pick(degList);
      var yrs=isCampus?"应届毕业生":pick(["1年","2年","3年","5年","8年"]);
      var city=pick([j.city,j.city,pick(CITIES)]);
      var phone="1"+pick(["3","5","7","8","9"])+String(Math.floor(rnd()*900000000+100000000)).slice(0,9);
      var sameP=null;
      if(out.length>=4&&rnd()<0.38){sameP=out[out.length-4];phone=sameP.phone;nm=[sameP.name.slice(0,1),sameP.name.slice(1)];
        deg=sameP.deg;yrs=sameP.years;city=sameP.city;}
      var major=pick(MAJORS[j.cat]||["工商管理"]);
      /* 出生日期：按学历/工作年限推导周岁（本科 22 起、硕士 +2），演示数据确定性派生 */
      var yn=parseInt(yrs)||0;
      var age0=22+yn+(deg==="硕士"?2:0);
      var birth=(new Date().getFullYear()-age0)+"-"+p2(1+Math.floor(rnd()*12))+"-"+p2(1+Math.floor(rnd()*28));
      var d=Math.floor(rnd()*20);
      var t=dayAgo(d)+" "+p2(9+Math.floor(rnd()*10))+":"+p2(Math.floor(rnd()*60));
      var sub={id:"s"+(1000+out.length),jobId:j.id,name:nm[0]+nm[1],phone:phone,
        email:(isCampus?nm[0]+nm[1]+"2027":nm[0]+nm[1])+"@"+pick(["163.com","qq.com","gmail.com","outlook.com"]),
        deg:deg,school:pick(SCHOOLS),major:major,years:yrs,city:city,birth:birth,
        skill:SKILLS[j.cat]||"",
        msg:pick(["本人有 "+yrs+" 相关经验，熟悉"+major+"领域，希望能加入贵司。","对贵司的"+j.cat+"岗位非常感兴趣，附件为个人简历，期待沟通。","长期关注农产品流通行业，认同集团的业务方向，希望获得面试机会。",""]),
        attach:nm[0]+nm[1]+"-简历-"+j.title.replace(/（.*?）/g,"")+".pdf",
        status:s,time:t,notes:[],notify:[],
        history:[{t:t,act:"投递成功",by:"候选人",from:"",to:"待筛选"}]};
      if(sameP){sub.email=sameP.email;sub.school=sameP.school;sub.major=sameP.major;sub.skill=sameP.skill;sub.birth=sameP.birth;}
      // 依据目标状态补齐流转轨迹
      var chain=["待筛选","初筛通过","面试中","已发 offer"];
      if(s!=="不合适"){
        var idx=chain.indexOf(s);
        for(var k=1;k<=idx;k++){
          var tt=dayAgo(Math.max(0,d-k*2))+" "+p2(10+Math.floor(rnd()*8))+":"+p2(Math.floor(rnd()*60));
          sub.history.push({t:tt,act:"状态流转",by:"HR",from:chain[k-1],to:chain[k]});
          var nf=NOTIFY[chain[k]];   /* 仅发出 Offer 时自动通知 */
          if(nf)sub.notify.push({t:tt,ch:nf.ch,to:sub.email,cc:ownerEmail(j.owner),content:nf.txt(sub,j)});
        }
      }else{
        var tt2=dayAgo(Math.max(0,d-3))+" "+p2(10+Math.floor(rnd()*8))+":"+p2(Math.floor(rnd()*60));
        sub.history.push({t:tt2,act:"状态流转",by:"HR",from:"待筛选",to:"不合适"});
      }
      out.push(sub);
    });
  });
  out.sort(function(a,b){return a.time<b.time?1:-1});
  /* 已发 offer 的候选人补齐入职跟进样本：待回复 / 待入职 / 在职 / 未入职（B-50 / B-52） */
  var oi=0;
  out.forEach(function(s){
    if(s.status!=="已发 offer")return;
    var k=oi++%4;
    if(k===0)return;                       /* 待回复 = 默认值，不写对象 */
    if(k===1){
      s.onboard={state:"待入职",planDate:dayAdd(6),realDate:"",cs:"",reason:"",note:"",to:"",by:"HR",at:dayAgo(1)+" 16:20"};
      s.history.push({t:dayAgo(1)+" 16:20",act:"offer 已接受",by:"HR",note:"约定入职 "+dayAdd(6)+"（邮件回复）"});
    }else if(k===2){
      s.onboard={state:"已入职",planDate:dayAgo(9),realDate:dayAgo(7),cs:"",reason:"",note:"已到岗，材料齐全",to:"",by:"HR",at:dayAgo(7)+" 09:40"};
      s.history.push({t:dayAgo(7)+" 09:40",act:"已入职",by:"HR",note:"实际入职 "+dayAgo(7)});
    }else{
      s.onboard={state:"未入职",planDate:dayAgo(4),realDate:"",cs:"候选人拒绝",reason:"接受了其他 offer",note:"",to:"",by:"HR",at:dayAgo(3)+" 11:05"};
      s.history.push({t:dayAgo(3)+" 11:05",act:"未入职",by:"HR",note:"候选人拒绝 · 接受了其他 offer"});
    }
  });
  return out;
}

    }));

function load(){
  try{
    var raw=localStorage.getItem("rs_hr_admin_v2");
    if(!raw)return false;
    var d=JSON.parse(raw);
    S.jobs=d.jobs||[];S.subs=d.subs||[];S.cands=d.cands||[];S.logs=d.logs||[];S.accounts=d.accounts||[];
    S.settings=d.settings||JSON.parse(JSON.stringify(DEFAULT_SETTINGS));S.user=d.user||null;
    if(!S.settings.cities||!S.settings.cities.length)S.settings.cities=CITIES.slice(); /* 老数据补齐城市字典 */
    if(!S.settings.cats||!S.settings.cats.length)S.settings.cats=CATS.slice();          /* 老数据补齐类别字典 */
    /* 老数据迁移：原「转入人才库」状态并入「不合适」（人才库标记在候选人主档上，无损） */
    S.subs.forEach(function(s){if(s.status==="转入人才库")s.status="不合适"});
    S.roles=d.roles||seedRoles();
    S.offers=d.offers||[];S.offerTpls=d.offerTpls||[];
    if(!S.cands.length&&S.subs.length)S.cands=buildCands();
    /* 旧数据迁移：原「评价笔记」多条结构 → 单份备注，取最后一条文本，清空 notes */
    S.subs.forEach(function(s){
      if(s.remark==null){
        var ns=s.notes||[];
        var last=ns.length?ns[ns.length-1]:null;
        s.remark=last?String(last.fact||last.text||""):"";
      }
      s.notes=[];
    });
    if(S.settings.blockIntercept==null)S.settings.blockIntercept="1";
    /* 补齐内置拟录用模板：老缓存里没有 pre 类模板时补一份，否则拟录用文件无法生成 */
    if(!S.offerTpls.some(function(t){return tplKind(t)==="pre"}))
      S.offerTpls.push(seedTpls().filter(function(t){return t.kind==="pre"})[0]);
    if(!roleById("admin"))S.roles.unshift(seedRoles()[0]);
    S.roles.forEach(function(r){
      r.perms=migratePerms(r.perms);
      if(!r.perms.length&&r.id==="admin")r.perms=PERM_KEYS.slice();
    });
    return true;
  }catch(e){return false}
}

function dayAdd(n){var d=new Date();d.setDate(d.getDate()+n);return fmtD(d)}
function candOf(phone){for(var i=0;i<S.cands.length;i++)if(S.cands[i].phone===phone)return S.cands[i];return null}
function newCand(s){return {id:"c"+uid(),phone:s.phone,name:s.name,pooled:0,poolBy:"",poolAt:"",poolReason:"",
  blocked:0,blockReason:"",blockEvidence:"",blockBy:"",blockAt:"",blockUntil:"",invites:[]}}
function ensureCand(s){var c=candOf(s.phone);if(c)return c;c=newCand(s);S.cands.push(c);return c}
function subsOfPhone(p){return S.subs.filter(function(s){return s.phone===p})}
function candsInScope(){
  var ph={};mySubs().forEach(function(s){ph[s.phone]=1});
  return S.cands.filter(function(c){return ph[c.phone]});
}
function poolCount(){return candsInScope().filter(function(c){return c.pooled}).length}
function blockCount(){return candsInScope().filter(function(c){return c.blocked}).length}
function buildCands(){
  var m={},out=[];
  S.subs.forEach(function(s){
    if(m[s.phone])return;
    m[s.phone]=1;out.push(newCand(s));

}

/* 移出人才库：把与入池相关的终态投递一并了结，避免人被移出、投递永远卡在终态（B-54）
   新模型下入池不改状态，这些投递停在「不合适」，故按「不合适 + 可恢复」识别 */
function poolStuck(c){
  return subsOfCand(c).filter(function(s){return s.status==="不合适"&&!!revertTo(s)});
}
function togglePool(id,fromList){
  if(!hasPerm("pool.manage")){toast("当前角色无人才库维护权限","err");return}
  var s=bySub(id);if(!s)return;
  var c=ensureCand(s);
  if(c.blocked){toast("该候选人已在黑名单，不可移入人才库（两者互斥）","err");return}
  if(c.pooled){
    if(poolStuck(c).length)openPoolRemove(id,fromList);
    else doPoolRemove(id,fromList,0);
  }else{
    c.pooled=1;c.poolBy=S.user.name;c.poolAt=now();c.poolReason=c.poolReason||"HR 手动移入";
    addLog("移入人才库",s.name,"一般候选人","人才库");
    save();closeAll();render();toast("已移入人才库，可在「人才库」菜单查看","ok");
    if(!fromList)setTimeout(function(){S.curSub=id;openSub(id)},10);
  }
}
function openPoolRemove(id,fromList){
  var s=bySub(id);if(!s)return;
  confirmBox("移出人才库","确定将 <b>"+esc(s.name)+"</b> 移出人才库吗？移出后其名下投递保持原状态不变。","确认移出","doPoolRemove('"+id+"',"+(fromList?1:0)+")");
}
function doPoolRemove(id,fromList){
  var s=bySub(id);if(!s)return;
  var c=ensureCand(s);
  c.pooled=0;
  addLog("移出人才库",s.name,"人才库","一般候选人");
  save();closeAll();render();
  toast("已移出人才库","ok");
  if(!fromList){S.curSub=id;openSub(id)}
}
function openBlock(id){
  if(!hasPerm("block.add")){toast("当前角色无拉黑权限，请联系管理员","err");return}
  var s=bySub(id);if(!s)return;
  var c=ensureCand(s);
  if(c.blocked){toast("该候选人已在黑名单中","err");return}
  var body='<div class="fld"><label>拉黑原因 <i>*</i></label><select class="ip" id="bk_r">'+

    '<div class="notice">拉黑生效后：该候选人提交任何岗位投递时由服务端<b>静默拦截</b>（B-34）并返回通用失败文案，不告知黑名单存在；同时自动移出人才库。</div>';
  openModal("加入黑名单 · "+esc(s.name),body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn dgg" onclick="saveBlock(\''+id+'\')">确认拉黑</button>');
}
function saveBlock(id){
  var s=bySub(id);if(!s)return;
  var e=(($("bk_e")||{}).value||"").trim();
  if(!e){toast("请填写证据附件名称","err");return}
  var r=(($("bk_r")||{}).value)||BLOCK_REASONS[0];
  var u=(($("bk_u")||{}).value)||"730";
  var nt=(($("bk_n")||{}).value||"").trim();
  if(!nt){toast("备注必填，请说明拉黑依据","err");return}
  var c=ensureCand(s),wasPool=c.pooled?1:0;
  c.blocked=1;c.blockReason=r;c.blockEvidence=e;c.blockBy=S.user.name;c.blockAt=now();
  c.blockUntil=(u==="0"?"长期":dayAdd(parseInt(u)));
  c.pooled=0;
  s.history.push({t:now(),act:"加入黑名单",by:S.user.name,note:nt+"（原因："+r+"）"});
  addLog("加入黑名单",s.name+" · "+r+"（"+nt.slice(0,30)+"）",(wasPool?"人才库":"一般候选人"),"黑名单 · 有效期至 "+c.blockUntil);
  save();closeAll();render();toast("已加入黑名单，投递将被静默拦截","ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}
function unblock(id,fromList){
  var s=bySub(id);if(!s)return;
  var c=candOf(s.phone);if(!c)return;
  if(!hasPerm("block.remove")){toast("当前角色无解除黑名单权限","err");return}
  if(c.blockBy===S.user.name){toast("操作人不可自行解除，需另一管理员处理","err");return}
  confirmBox("解除黑名单","确认解除 <b>"+esc(s.name)+"</b> 的黑名单？<br>原因："+esc(c.blockReason)+"　操作人："+esc(c.blockBy)+"<br>解除后该候选人可正常投递。","确认解除","doUnblock('"+id+"',"+(fromList?1:0)+")",0);
}

function doUnblock(id,fromList){  var s=bySub(id);if(!s)return;

function sendInvite(id){

/* ---------- 日志 ---------- */
function addLog(act,obj,before,after){
  S.logs.unshift({id:uid(),t:now(),who:S.user?S.user.name:"系统",whoId:S.user?S.user.id:"system",act:act,obj:obj||"",before:before||"",after:after||""});

}
var _tt=null;   /* toast 定时器句柄（未声明时 clearTimeout 读未定义变量会抛错，导致提示条永不显示） */
function toast(msg,type){
  var el=$("toast");el.className="toast on"+(type?" "+type:"");el.textContent=msg;
  clearTimeout(_tt);_tt=setTimeout(function(){el.className="toast"},2600);
}

function byId(id){for(var i=0;i<S.jobs.length;i++)if(S.jobs[i].id===id)return S.jobs[i];return null}
function bySub(id){for(var i=0;i<S.subs.length;i++)if(S.subs[i].id===id)return S.subs[i];return null}
function ownerAcc(v){var a=null;S.accounts.forEach(function(x){if(x.id===v||x.name===v)a=x});return a}
function ownerName(v){var a=ownerAcc(v);return a?a.name:(String(v==null?"":v).trim()||"—")}
function ownerEmail(v){var a=ownerAcc(v);return a?a.email:"招聘负责人"}
function ownerById(v){return ownerAcc(v)||{name:(String(v==null?"":v).trim()||"—"),title:"",email:"",phone:""}}
function ownerText(v){var a=ownerAcc(v);return a?a.name:(String(v==null?"":v).trim())}   /* 编辑框回填：账号→姓名，自由文本→原文 */
function ownerResolve(v){var s=String(v==null?"":v).trim();var a=ownerAcc(s);return a?a.id:s}  /* 提交：命中账号存 id，否则存文本 */
function ownerPhoneOf(j){var p=String((j&&j.ownerPhone)||"").trim();if(p)return p;var a=ownerAcc(j&&j.owner);return (a&&a.phone)||""}  /* 岗位负责人电话：手填优先，未填回落到账号电话 */

function pgDash(){
  var jobs=myJobs(),subs=mySubs();
  var online=jobs.filter(function(j){return j.status==="online"});
  var hc=0;online.forEach(function(j){hc+=j.hc});
  var pending=subs.filter(function(s){return s.status==="待筛选"});
  var interview=subs.filter(function(s){return s.status==="面试中"});
  var plan=subs.filter(function(s){return s.status==="拟录用"});
  var offer=subs.filter(function(s){return s.status==="已发 offer"});

  var stHtml=Object.keys(JOB_STATUS).filter(function(k){return k!=="deleted"}).map(function(k){
    var n=jobs.filter(function(j){return j.status===k}).length;
    var col=k==="online"?"var(--ok)":(k==="offline"?"#98a2b3":(k==="draft"?"var(--brand)":"var(--danger)"));
    return barRow(JOB_STATUS[k].t,n,Math.max(1,jobs.length),col);
  }).join("");

  // 转化分析区：受时间筛选（R=null 表示全部）
  S.dashRange=S.dashRange||{type:"month",from:"",to:""};
  var R=dashRangeDays();
  var rs=R?subs.filter(function(s){return inRng((s.time||"").slice(0,10),R)}):subs;
  var rv=dashRateVals(R);
  var catM={};rs.forEach(function(s){var j=byId(s.jobId);var c=j?j.cat:"其他";catM[c]=(catM[c]||0)+1});
  var catArr=Object.keys(catM).sort(function(a,b){return catM[b]-catM[a]});
  var cmx=Math.max(1,catArr.length?catM[catArr[0]]:1);
  var catHtml=catArr.map(function(c){return barRow(c+"类",catM[c],cmx,"var(--brand)")}).join("");

  return '<div class="grid g4" style="margin-bottom:16px">'+
    stat("在招岗位",online.length,"状态为「招聘中」的岗位数（不含草稿/已下线/已过期）","b")+
    stat("招聘人数合计",hc,"在招岗位招聘人数的总和","g")+
    stat("累计收到简历",subs.length,"全部投递记录总数（含各环节与已淘汰）","o")+
    stat("笔试中 / 面试中 / 拟录用 / 已发 offer",
      subs.filter(function(s){return s.status==="笔试中"}).length+" / "+interview.length+" / "+plan.length+" / "+offer.length,
      "四个环节的当前存量人数（实时快照）","p")+
  '</div>'+
  '<div class="grid g2" style="margin-bottom:16px">'+
    (isViewer()?stat("人才库人数",poolCount(),"按人去重（B-32 / B-36）","g")
             :statGo("人才库人数",poolCount(),"按人去重 · 点击查看人才库（B-32 / B-36）","g","pool"))+
    (hasPerm("block.view")?statGo("黑名单人数",blockCount(),"点击查看 · 投递由服务端静默拦截（B-33 / B-37）","o","block")
             :stat("黑名单人数",blockCount(),"当前角色无黑名单查看权限（B-33 / B-37）","o"))+
  '</div>'+
  '<div class="card" style="margin-bottom:16px">'+
    '<div class="hd"><h3>转化分析<span style="font-weight:400;font-size:12.5px;color:var(--ink3);margin-left:10px">'+dashRangeLabel(R)+'：新增投递 '+rs.length+' 份</span></h3><div class="sp"></div>'+dashRangeBar()+'</div>'+
    '<div class="bd">'+
      '<div class="grid g4" style="margin-bottom:14px">'+
        stat("面试赴约率",pctTxt(rv.ia,rv.ish),"到场 ÷ 应到，缺考即爽约（按面试时间）","b")+
        stat("面试合格率",pctTxt(rv.ip,rv.idn),"结论「通过」÷ 已出结论（按面试时间）","g")+
        stat("Offer 接受率",pctTxt(rv.acc,rv.replied),"已回复且接受 ÷ 已回复（按 Offer 发送时间）","p")+
        stat("入职达成率",pctTxt(rv.hired,rv.offn),"已入职 ÷ 已发 offer（按 Offer 发送时间）","o")+
      '</div>'+
      '<div class="grid g2" style="margin-bottom:14px">'+
        dashFunnelCard(R)+
        '<div class="card"><div class="hd"><h3>简历类别分布</h3></div><div class="bd">'+(catHtml||'<div class="empty">暂无数据</div>')+'</div></div>'+
      '</div>'+
      dashTrendCard(R)+
    '</div>'+
  '</div>'+

/* ==== 概览扩展：时间筛选 / 转化率 / 招聘漏斗 / 投递趋势 ==== */
function inRng(d,R){return !R?(!!d):(!!d&&d>=R.from&&d<=R.to)}
function dashRangeDays(){   /* 当前筛选范围的 {from,to}；null=全部 */
  var d=S.dashRange||{type:"month"};
  if(d.type==="all")return null;
  var today=fmtD(new Date());
  if(d.type==="week"){var x=new Date();x.setDate(x.getDate()-6);return{from:fmtD(x),to:today}}
  if(d.type==="month"){var m=new Date();m.setDate(1);return{from:fmtD(m),to:today}}
  if(d.type==="half"){var h=new Date();h.setMonth(h.getMonth()-6);return{from:fmtD(h),to:today}}
  return{from:d.from||today,to:d.to||today};
}
function dashRangeLabel(R){ /* 筛选范围的中文名 */
  var d=S.dashRange||{};
  if(!R)return "近 12 个月";
  if(d.type==="week")return "近 7 天";
  if(d.type==="month")return "本月";
  if(d.type==="half")return "最近半年";
  return R.from+" ~ "+R.to;
}
function dashRangeBar(){    /* 时间筛选控件：本周 / 本月 / 最近半年 / 全部 / 自定义（起止日期） */
  var t=(S.dashRange||{}).type||"month";
  var bs=[["week","本周"],["month","本月"],["half","最近半年"],["all","全部"]].map(function(x){
    return '<button class="btn sm '+(t===x[0]?"pri":"")+'" onclick="setDashRange(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join("");
  var dates=t==="custom"?
    '<input class="ip" type="date" id="drFrom" value="'+esc(S.dashRange.from||"")+'" style="width:132px" onchange="applyDashCustom()">'+
    '<span style="color:var(--ink3);font-size:12.5px">至</span>'+
    '<input class="ip" type="date" id="drTo" value="'+esc(S.dashRange.to||"")+'" style="width:132px" onchange="applyDashCustom()">':"";
  return '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">'+
    bs+'<button class="btn sm '+(t==="custom"?"pri":"")+'" onclick="setDashRange(\'custom\')">自定义</button>'+dates+'</div>';
}
function setDashRange(t){
  S.dashRange=S.dashRange||{type:"month",from:"",to:""};
  S.dashRange.type=t;
  if(t==="custom"&&!S.dashRange.from){S.dashRange.from=fmtD(new Date(new Date().getFullYear(),new Date().getMonth(),1));S.dashRange.to=fmtD(new Date())}
  render();
}
function applyDashCustom(){
  var f=(document.getElementById("drFrom")||{}).value,t2=(document.getElementById("drTo")||{}).value;
  if(f&&t2&&f<=t2){S.dashRange.from=f;S.dashRange.to=t2;render()}
  else toast("请选择有效的起止日期（开始不晚于结束）","err");
}
function offerTime(s){      /* Offer 发送时间：优先 Offer 文件的发送记录，兜底入职跟进登记时间 */
  var o=(S.offers||[]).filter(function(x){return x.subId===s.id&&x.sentAt})[0];
  if(o)return o.sentAt.slice(0,10);
  return (s.onboard&&s.onboard.at)?s.onboard.at.slice(0,10):"";
}
function itvAllRounds(s){   /* 只读取面试轮次（不触发迁移），供统计使用 */
  return (s.interviews&&s.interviews.length)?s.interviews:((s.interview&&s.interview.time)?[s.interview]:[]);
}
function pctTxt(a,b){return b?(Math.round(a/b*100)+"%"):"—"}
function dashRateVals(R){   /* 转化率原始计数：按面试时间筛面试轮、按 Offer 发送时间筛 Offer */
  var subs=mySubs(),v={ip:0,idn:0,ia:0,ish:0,replied:0,acc:0,offn:0,hired:0};
  subs.forEach(function(s){
    itvAllRounds(s).forEach(function(r){
      if(!inRng((r.time||"").slice(0,10),R))return;
      if(r.result==="通过")v.ip++;
      if(r.result==="通过"||r.result==="不通过")v.idn++;
      if(r.attend==="到场")v.ia++;
      if(r.attend==="到场"||r.attend==="缺考")v.ish++;
    });
    if(s.status==="已发 offer"||(s.onboard&&s.onboard.state)){
      if(!inRng(offerTime(s),R))return;
      v.offn++;
      var st=onbState(s);
      if(st==="已入职")v.hired++;
      if(st!=="待回复"){v.replied++;if(st==="待入职"||st==="已入职")v.acc++;}
    }
  });
  return v;
}
function dashFunnelCard(R){  /* 招聘漏斗：范围内投递的候选人当前走到哪一层 */
  var subs=mySubs();
  if(R)subs=subs.filter(function(s){return inRng((s.time||"").slice(0,10),R)});
  var L=[];
  L.push(["投递",subs.length]);
  L.push(["初筛通过",subs.filter(function(s){return ["初筛通过","笔试中","面试中","拟录用","已发 offer"].indexOf(s.status)>=0}).length]);
  L.push(["笔试通过",subs.filter(function(s){return s.exam&&s.exam.result==="通过"}).length]);
  L.push(["面试通过",subs.filter(function(s){
    return ["拟录用","已发 offer"].indexOf(s.status)>=0||itvAllRounds(s).some(function(r){return r.result==="通过"});
  }).length]);
  L.push(["拟录用",subs.filter(function(s){return s.plan||s.status==="拟录用"||s.status==="已发 offer"}).length]);
  L.push(["已发 offer",subs.filter(function(s){return s.status==="已发 offer"}).length]);
  L.push(["已入职",subs.filter(function(s){return onbState(s)==="已入职"}).length]);
  var mx=Math.max(1,Math.max.apply(null,L.map(function(x){return x[1]})));
  var rows=L.map(function(x,i){
    var prev=i?L[i-1][1]:0;
    var conv=(prev&&x[1]<prev)?('<em> · '+Math.round(x[1]/prev*100)+'%</em>'):"";
    return '<div class="frow" style="display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13px">'+
      '<span class="bl">'+x[0]+'</span><div class="btr"><i style="width:'+Math.round(x[1]/mx*100)+'%"></i></div>'+
      '<span class="fv">'+x[1]+conv+'</span></div>';
  }).join("");
  return '<div class="card"><div class="hd"><h3>招聘漏斗</h3></div><div class="bd">'+(rows||'<div class="empty">暂无数据</div>')+
    '<div style="font-size:12px;color:var(--ink3);margin-top:6px">按投递时间筛选；已到更深层的人回填到途经层；「不合适 / 人才库」不计入；百分比为相对上一层的转化率（笔试、拟录用等环节可跳过）。</div></div></div>';
}
function dashBuckets(R){    /* 趋势图分桶：全部=近 12 个自然月；≤14 天按天；≤70 天按周；其余按月 */
  if(!R){var a=[],n=new Date();n.setDate(1);
    for(var i=11;i>=0;i--){var x=new Date(n.getFullYear(),n.getMonth()-i,1);
      a.push({lb:(x.getMonth()+1)+"月",from:fmtD(x),to:fmtD(new Date(x.getFullYear(),x.getMonth()+1,0))})}
    return a}
  var days=Math.round((new Date(R.to+"T00:00:00")-new Date(R.from+"T00:00:00"))/86400000)+1,a=[];
  if(days<=14){var x=new Date(R.from+"T00:00:00");
    for(var i=0;i<days;i++){a.push({lb:fmtD(x).slice(5),from:fmtD(x),to:fmtD(x)});x.setDate(x.getDate()+1)}
    return a}
  if(days<=70){var x=new Date(R.from+"T00:00:00");
    while(fmtD(x)<=R.to){var f=fmtD(x),e=new Date(x);e.setDate(e.getDate()+6);
      a.push({lb:f.slice(5).replace("-","/")+"起",from:f,to:fmtD(e)>R.to?R.to:fmtD(e)});x.setDate(x.getDate()+7)}
    return a}
  var x=new Date(R.from+"T00:00:00");x.setDate(1);
  while(fmtD(x)<=R.to){var nx=new Date(x.getFullYear(),x.getMonth()+1,1);
    var t=fmtD(new Date(nx.getTime()-86400000));
    a.push({lb:(x.getMonth()+1)+"月",from:fmtD(x),to:t>R.to?R.to:t});x=nx}
  return a;
}
function dashTrendCard(R){  /* 投递趋势：跟随筛选范围自动分桶聚合 */
  var B=dashBuckets(R),mm={};
  B.forEach(function(b){mm[b.lb]=0});
  mySubs().forEach(function(s){
    var d=(s.time||"").slice(0,10);if(!d)return;
    B.forEach(function(b){if(d>=b.from&&d<=b.to)mm[b.lb]++});
  });
  var mx=Math.max(1,Math.max.apply(null,B.map(function(b){return mm[b.lb]})));
  var cols=B.map(function(b){var v=mm[b.lb];
    return '<div class="col"><b>'+(v||"")+'</b><i style="height:'+Math.round(v/mx*86)+'%"></i><span>'+b.lb+'</span></div>'}).join("");
  return '<div class="card"><div class="hd"><h3>投递趋势 · '+dashRangeLabel(R)+'</h3></div><div class="bd"><div class="trend">'+cols+'</div></div></div>';
}

var TAG_POOL=["五险一金","六险一金","包吃住","包吃","包住","双休","年终奖","带薪年假","补充医疗",

function tagBox(tags){
  var sel=tags||[];
  return '<div class="tagbox" onclick="focusTagInput()">'+
    sel.map(function(t,i){return '<span class="tgchip">'+esc(t)+
      '<i title="移除" onclick="event.stopPropagation();rmTag('+i+')">×</i></span>'}).join("")+
    '<input id="tag_in" class="tagin" placeholder="'+(sel.length?"继续添加，回车确认":"输入福利后回车添加，如：包吃住")+'" onkeydown="tagKey(event)">'+
  '</div>'+
  '<div class="tagpool"><span class="tb">常用</span>'+TAG_POOL.map(function(t,i){
    return '<span class="tchip'+(sel.indexOf(t)>=0?" on":"")+'" onclick="toggleTagIdx('+i+')">'+esc(t)+'</span>';
  }).join("")+'<span class="tchip add" onclick="focusTagInput()">+ 自定义</span></div>';
}
function focusTagInput(){var i=$("tag_in");if(i)i.focus()}
function toggleTagIdx(i){
  var t=TAG_POOL[i];if(!t||!S.editJob)return;
  if(!S.editJob.tags)S.editJob.tags=[];
  var k=S.editJob.tags.indexOf(t);
  if(k>=0)S.editJob.tags.splice(k,1);else S.editJob.tags.push(t);

function rmTag(i){
  if(!S.editJob||!S.editJob.tags)return;
  S.editJob.tags.splice(i,1);drawJobForm();
}
function addTag(v){
  if(!S.editJob)return;
  var t=String(v==null?"":v).replace(/^[\s,，]+|[\s,，]+$/g,"");
  if(!S.editJob.tags)S.editJob.tags=[];
  if(t&&S.editJob.tags.indexOf(t)<0)S.editJob.tags.push(t);
  drawJobForm();
  focusTagInput();
}
function tagKey(e){
  if(e.key!=="Enter")return;
  e.preventDefault();
  addTag(e.target.value);
}

/* ---------- 岗位职责 / 任职要求：富文本（复用 rteBox） ---------- */
function rtFromArr(arr){
  var a=(arr||[]).map(function(x){return String(x==null?"":x).trim()}).filter(Boolean);
  if(!a.length)return "";
  return "<ul>"+a.map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul>";
}
function rtClean(h){
  var box=document.createElement("div");
  box.innerHTML=String(h||"");
  box.querySelectorAll("script,style,iframe,object,link,meta").forEach(function(n){n.parentNode.removeChild(n)});
  box.querySelectorAll("*").forEach(function(n){
    n.removeAttribute("style");n.removeAttribute("class");n.removeAttribute("id");
    n.removeAttribute("face");n.removeAttribute("size");n.removeAttribute("color");
  });
  var txt=(box.textContent||"").replace(/\u00a0/g," ").trim();
  if(!txt&&!box.querySelector("li"))return "";
  return box.innerHTML.replace(/&nbsp;/g," ");
}
function rtLines(h){
  if(!h)return [];
  var box=document.createElement("div");
  box.innerHTML=String(h).replace(/<br\s*\/?>/gi,"\n").replace(/<\/(p|div|li|h[1-6]|blockquote)>/gi,"\n");
  return (box.textContent||"").replace(/\u00a0/g," ").split(/\n+/)
    .map(function(x){return x.trim()}).filter(Boolean);
}
function rteJobSync(id,key){
  var ed=$(id);if(!ed||!S.editJob)return;
  S.editJob[key]=ed.innerHTML;
}
function jobRichHtml(html,arr){
  var h=rtClean(html||"")||rtFromArr(arr);
  if(!h)return '<div style="font-size:13px;color:var(--ink3);margin-bottom:10px">未填写</div>';
  return h;
}
function saveJob(publish){
  var j=S.editJob,e={};
  if(!(j.title||"").trim())e.title=1;
  if(!(j.salary||"").trim())e.salary=1;
  j.dutyHtml=rtClean(j.dutyHtml);j.reqHtml=rtClean(j.reqHtml);
  j.duty=rtLines(j.dutyHtml);j.requirement=rtLines(j.reqHtml);
  if(!j.duty.length)e.duty=1;
  if(!j.requirement.length)e.requirement=1;
  if(Object.keys(e).length){S.formErr=e;drawJobForm();toast("请完善带 * 的必填项","err");return}
  j.owner=ownerResolve(j.owner);
  if(!j.tags.length)j.tags=["五险一金"];
  if(!j.owner)j.owner=autoOwner(j);
  j.ownerPhone=(j.ownerPhone||"").trim();   /* 负责人电话：仅存手填值，展示时未填则回落账号电话 */

  if(j.id){
    var cur=byId(j.id);
    var before="状态："+JOB_STATUS[cur.status].t+" · HC："+cur.hc+" · 截止："+cur.deadline;
    ["track","cat","title","city","addr","salary","exp","deg","hc","deadline","duty","requirement","dutyHtml","reqHtml","tags","owner","ownerPhone"].forEach(function(k){cur[k]=j[k]});
    cur.updated_at=now();cur.updated_by=S.user.name;
    if(publish&&cur.status!=="online"){cur.status="online";addLog("岗位上架",cur.title,JOB_STATUS[cur.status].t,"在招")}
    addLog("编辑岗位",cur.title,before,"状态："+JOB_STATUS[cur.status].t+" · HC："+cur.hc+" · 截止："+cur.deadline);
    toast("已保存，前台同步更新","ok");
  }else{
    var nid=Math.max.apply(null,S.jobs.map(function(x){return x.id}))+1;
    j.id=nid;j.publish_date=today();j.status=publish?"online":"draft";
    j.view_count=0;j.apply_count=0;j.created_by=S.user.name;j.updated_by=S.user.name;j.updated_at=now();
    S.jobs.unshift(j);
    addLog("新建岗位",j.title,"",(publish?"在招":"草稿")+" · HC："+j.hc+" · 负责人："+ownerName(j.owner));
    toast(publish?"岗位已发布上线":"岗位已保存为草稿","ok");

  recalc();save();closeAll();render();
  if(publish&&!(j.addr||"").trim()){setTimeout(function(){toast("提示：该岗位未填写工作地点，C 端仅显示工作城市，建议补填","warn")},700)}
}

function subsFiltered(){
  var list=mySubs();
  if(S.sTab!=="全部")list=list.filter(function(s){return s.status===S.sTab});
  var q=S.sQ.trim().toLowerCase();
  if(q)list=list.filter(function(s){
    return (s.name+" "+s.school+" "+s.major+" "+s.deg+" "+s.skill+" "+s.city+" "+s.phone).toLowerCase().indexOf(q)>=0;
  });
  if(S.sF.job)list=list.filter(function(s){return s.jobId===parseInt(S.sF.job)});
  if(S.sF.deg)list=list.filter(function(s){return s.deg===S.sF.deg});
  if(S.sF.cross)list=list.filter(function(s){
    var jj=byId(s.jobId);
    var isCross=!!(jj&&s.city&&jj.city&&s.city!==jj.city);
    return S.sF.cross==="cross"?isCross:!isCross;   /* 同城 = 非跨城，两类互补不丢数据 */
  });
  if(S.sF.onb)list=list.filter(function(s){
    if(s.status!=="已发 offer")return false;
    return onbState(s)===S.sF.onb;
  });
  var sc=S.sF.scope;
  if(sc)list=list.filter(function(s){
    var c=candOf(s.phone);if(!c)return false;
    if(sc==="pool")return !!c.pooled;
    if(sc==="block")return !!c.blocked;
    if(sc==="normal")return !c.pooled&&!c.blocked;
    return true;
  });
  return list.sort(function(a,b){return a.time<b.time?1:-1});
}
function subCount(st){
  var l=mySubs();
  return st==="全部"?l.length:l.filter(function(s){return s.status===st}).length;
}

var EXP_COLS=[["姓名","name"],["手机号","phone"],["邮箱","email"],["学历","deg"],["毕业院校","school"],["专业","major"],
  ["工作年限","years"],["现居城市","city"],["投递岗位","job"],["状态","status"],["投递时间","time"],
  ["技能","skill"],["候选人留言","msg"],["简历附件","attach"],["备注","remark"]];
function expVal(s,k){
  if(k==="job"){var j=byId(s.jobId);return j?j.title:"—"}
  if(k==="remark")return (s.remark||"").trim()||"—";
  var v=s[k];
  return (v===undefined||v===null||v==="")?"—":String(v);
}
function filterSummary(){
  var a=[];
  if(S.sTab!=="全部")a.push("状态="+S.sTab);
  if(S.sQ.trim())a.push("关键词="+S.sQ.trim());
  if(S.sF.job){var j=byId(S.sF.job);a.push("岗位="+(j?j.title:"—"))}
  if(S.sF.deg)a.push("学历="+S.sF.deg);
  if(S.sF.cross)a.push(S.sF.cross==="cross"?"城市关系=跨城":"城市关系=同城");
  if(S.sF.scope)a.push("标记="+S.sF.scope);
  return a.length?a.join(" · "):"全部投递（未设筛选）";
}
function exportFileNames(list){
  var seen={},out=[];
  list.forEach(function(s){
    var base=s.name+"-"+(s.major||"未填专业")+"-"+((s.time||"").slice(0,10).replace(/-/g,"")||"无日期");
    seen[base]=(seen[base]||0)+1;
    out.push(base+(seen[base]>1?"("+seen[base]+")":"")+".pdf");
  });
  return out;
}

    "转入人才库":'<button class="btn sm pri"'+d+' onclick="batchAdvance(\'转入人才库\')">批量转入人才库</button>'
  };
  if(S.sTab==="待筛选")return b["初筛通过"]+b["不合适"];
  if(S.sTab==="初筛通过")
    return '<button class="btn sm pri"'+d+' onclick="batchExam()">批量安排笔试</button>'+
      b["面试中"]+b["不合适"]+b["转入人才库"];

      b["面试中"]+b["不合适"]+b["转入人才库"];
  if(S.sTab==="面试中")      /* 面试后：发 offer 前的两个出口 —— 不合适（含拉黑分支）/ 转入人才库 */
    return b["不合适"]+b["转入人才库"];

}
var BTIP={
  "转入人才库":'转入人才库 = 本次投递记为「不合适」+ 候选人（按手机号识别）进入人才库供后续岗位复用；入池原因必填。'
};
function batchAdvance(to){
  if(!hasPerm("subs.batch")){toast("当前角色无批量操作权限","err");return}
  if(!S.sSel.length){toast("请先勾选候选人","err");return}
  if(S.sSel.length>SUB_BATCH_MAX){toast("单次最多处理 "+SUB_BATCH_MAX+" 份，请分批操作","err");return}
  /* 「不合适」有两条分支（转不合适 / 转黑名单）且备注必填，走独立弹窗 */
  if(to==="不合适"){openReject("",1);return}
  /* 「初筛通过」可填初筛意见（选填），走独立弹窗 */
  if(to==="初筛通过"){openScreenPass("",1);return}
  /* 「面试中」先填面试信息，走独立弹窗 */
  if(to==="面试中"){openInterview("",1);return}
  /* 「转入人才库」需要录入池原因，走独立弹窗（状态结果是不合适 + 人入池） */
  if(to==="转入人才库"){openPool("",1);return}
  confirmBox("批量"+to,"确定将选中的 <b>"+S.sSel.length+"</b> 份简历流转到「"+to+"」吗？"+(BTIP[to]?'<br>'+BTIP[to]:""),
    "确认流转","doBatchAdvance('"+to+"')",0);
}
/* 不合适处理：两种方式（不合适 / 不合适并拉黑）+ 备注必填；备注写入流转记录（与批量共用一套）
   入池不再是「不合适」的分支——需要留人请走独立的「转入人才库」动作（openPool） */
function openReject(id,batch){
  if(!hasPerm("subs.reject")){toast("当前角色无权转不合适","err");return}
  if(batch&&!S.sSel.length){toast("请先勾选候选人","err");return}
  if(batch&&S.sSel.length>SUB_BATCH_MAX){toast("单次最多处理 "+SUB_BATCH_MAX+" 份，请分批操作","err");return}
  var n=batch?S.sSel.length:1,nm=batch?"":esc(((bySub(id)||{}).name)||"");
  RJ_FILES=[];
  var modes=[{v:"不合适",t:"不合适"}];
  if(hasPerm("block.add"))modes.push({v:"黑名单",t:"不合适，并加入黑名单"});
  var body=
   '<div class="fld"><label>处理方式 <i>*</i></label><div class="rjopts" id="rj_opts">'+
     modes.map(function(o,i){
       return '<label class="rjopt'+(i===0?" on":"")+'">'+
         '<input type="radio" name="rj_m" value="'+o.v+'"'+(i===0?" checked":"")+' onchange="rejectPick()">'+
         '<div><div class="t">'+o.t+'</div></div></label>';
     }).join("")+
   '</div></div>'+
   '<div class="fld"><label>备注 <i>*</i></label><textarea class="ip" id="rj_n" rows="3" placeholder="如：笔试成绩 42 分未达 60 分合格线，技术栈与岗位要求不匹配"></textarea></div>'+
   '<div id="rj_bk" style="display:none">'+
     '<div class="fld"><label>拉黑原因 <i>*</i></label><select class="ip" id="rj_r">'+
       BLOCK_REASONS.map(function(r){return '<option>'+r+'</option>'}).join("")+'</select></div>'+
     '<div class="fld"><label>证据附件</label>'+
       '<div class="upz" onclick="rjPick()" ondragover="event.preventDefault()" ondrop="rjDrop(event)">'+
         '<div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>'+
         '<div class="t">点击或拖拽上传</div>'+
         '<div class="s">PDF / Word / 图片，单个不超过 20MB</div>'+
       '</div>'+
       '<div id="rj_fl"></div>'+
       '<input type="file" id="rj_f" multiple accept=".pdf,.doc,.docx,image/*" style="display:none" onchange="rjPicked(this)">'+
     '</div>'+
   '</div>';
  openModal("不合适处理"+(batch?" · 已选 "+n+" 份":" · "+nm),body,
    '<button class="btn" onclick="closeAll()">取消</button>'+
    '<button class="btn dgg" onclick="doReject(\''+id+'\','+(batch?1:0)+')">确认处理'+(batch?"（"+n+" 份）":"")+'</button>');
}
/* 初筛通过：可填初筛意见（选填），写入流转记录「状态流转 / 批量流转」节点的备注下（单条与批量共用） */
function openScreenPass(id,batch){
  var n=batch?S.sSel.length:1,nm=batch?"":esc(((bySub(id)||{}).name)||"");
  var body=
   '<div class="fld"><label>备注</label><textarea class="ip" id="sc_n" rows="3" placeholder="如：技术栈匹配、有同类项目经验，通过初筛"></textarea></div>';
  openModal("初筛通过"+(batch?" · 已选 "+n+" 份":" · "+nm),body,
    '<button class="btn" onclick="closeAll()">取消</button>'+
    '<button class="btn pri" onclick="doScreenPass(\''+(batch?"":id)+'\','+(batch?1:0)+')">确认通过'+(batch?"（"+n+" 份）":"")+'</button>');
}
function doScreenPass(id,batch){
  var note=(val("sc_n")||"").trim();   /* 选填：留空则正常流转，节点下不显示备注行 */
  if(batch){doBatchAdvance("初筛通过",note);return}
  doAdvance(id,"初筛通过",{note:note});
}
/* 安排面试：面试时间 / 面试地点 / 是否携带简历 / 注意事项（单条与批量共用），信息存在 s.interview（最新轮），不写入流转记录
   第三参 re=1 表示「重新安排」：可选「改期（该轮）」或「安排下一面」；第四参 round 指定操作的轮次，缺省为最新一面 */
function openInterview(id,batch,re,round){
  var n=batch?S.sSel.length:1,nm=batch?"":esc(((bySub(id)||{}).name)||"");
  var cur=batch?bySub(S.sSel[0]):bySub(id);
  if(!batch)S.curItvRound=round==null?null:round;
  var one=(batch?(((bySub(S.sSel[0])||{}).interview)||{}):((cur?itvRound(cur,round):null)||{}));
  /* 单条安排面试：笔试结论为「不通过」时给出风险提示（批量不提示） */
  var warn="";
  if(!batch){
    var cs=bySub(id),ex=(cs&&cs.exam)||{};
    if(ex.result==="不通过")warn='<div class="warnbox"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'+
      '<div>温馨提示：候选人笔试记录为<b>[不通过]</b>，请谨慎操作</div></div>';
  }
  var modeField="";
  if(re){
    var all=cur?itvRounds(cur):[];
    var nextN=all.length+1;
    modeField='<div class="fld"><label>安排类型</label>'+
      '<div style="display:flex;gap:20px;align-items:center;font-size:13.5px;color:var(--ink2);padding:4px 0">'+
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="itv_mode" value="same" checked onchange="itvModeChange()"> 改期（第 '+(one.round||1)+' 面）</label>'+
        '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="itv_mode" value="next" onchange="itvModeChange()"> 安排下一面（第 '+nextN+' 面）</label>'+
      '</div></div>';
  }
  var body=warn+modeField+
   '<div class="fld"><label>面试时间 <i>*</i></label><input class="ip" type="datetime-local" id="itv_t" value="'+dtIn(one.time)+'"></div>'+
   '<div class="fld"><label>面试地点 <i>*</i></label><input class="ip" id="itv_p" value="'+esc(one.place||"")+'" placeholder="如：集团总部 3 楼会议室"></div>'+
   '<div class="fld"><label>是否携带简历</label><select class="ip" id="itv_r">'+
     ["是","否"].map(function(v){return '<option'+(one.resume===v?" selected":"")+'>'+v+'</option>'}).join("")+'</select></div>'+
   '<div class="fld"><label>注意事项</label><textarea class="ip" id="itv_tips" rows="4" placeholder="如：携带身份证，提前 15 分钟到场">'+esc(one.tips||"")+'</textarea></div>'+
   (re?'<div class="hint">改期只更新本轮时间与地点，该轮已录入的结论 / 附件 / 评价会保留；安排下一面会新增一轮，历史轮次不受影响。</div>':'');
  openModal((re?"重新安排面试":"安排面试")+(batch?" · 已选 "+n+" 份":" · "+nm)+((re&&round!=null)?"（第 "+round+" 面）":""),body,
    '<button class="btn" onclick="closeAll()">取消</button>'+
    '<button class="btn pri" onclick="doInterview(\''+(batch?"":id)+'\','+(batch?1:0)+','+(re?1:0)+')">'+(re?"确认重新安排":"确认安排")+(batch?"（"+n+" 份）":"")+'</button>');
}
/* 切到「安排下一面」时清空时间地点，避免沿用上一面信息误提交 */
function itvModeChange(){
  var m=document.querySelector('input[name="itv_mode"]:checked');
  if(m&&m.value==="next"){
    var a=$("itv_t"),b=$("itv_p");
    if(a)a.value="";if(b)b.value="";
  }
}
function doInterview(id,batch,re){
  var t=dtOut(val("itv_t")),p=(val("itv_p")||"").trim(),
      resume=val("itv_r")||"是",tips=(val("itv_tips")||"").trim();
  if(!t||!p){toast("面试时间与地点必填","err");return}
  if(!batch){
    var s=bySub(id);if(!s)return;
    /* 重新安排：改期 = 更新目标轮；安排下一面 = 追加一轮 */
    if(re){
      var rs=itvRounds(s);
      var mode=(document.querySelector('input[name="itv_mode"]:checked')||{}).value||"same";
      var jt=((byId(s.jobId)||{}).title)||"";
      if(mode==="next"){
        var maxR=rs.reduce(function(m,r){return Math.max(m,r.round||0)},0);
        var nr={round:maxR+1,time:t,place:p,resume:resume,tips:tips,
          by:S.user.name,at:now(),arrangeCount:1};
        rs.push(nr);s.interview=nr;
        addLog("安排下一面",s.name+" · "+jt,"","第 "+nr.round+" 面 · "+t+" / "+p);
        save();closeAll();render();S.curSub=id;openSub(id);
        toast("已安排第 "+nr.round+" 面","ok");
        return;
      }
      var iv=itvRound(s,S.curItvRound)||s.interview||{};
      iv.time=t;iv.place=p;iv.resume=resume;iv.tips=tips;iv.by=S.user.name;iv.at=now();
      iv.arrangeCount=(iv.arrangeCount||1)+1;
      s.interview=rs[rs.length-1];
      addLog("重新安排面试",s.name+" · "+jt,"","第 "+(iv.round||1)+" 面 · "+t+" / "+p);
      save();closeAll();render();S.curSub=id;openSub(id);
      toast("第 "+(iv.round||1)+" 面已重新安排","ok");
      return;
    }
    if(SUB_FLOW[s.status].indexOf("面试中")<0){toast("不允许的流转："+s.status+" → 面试中","err");return}
    itvRounds(s);
    var f1={round:s.interviews.length+1,time:t,place:p,resume:resume,tips:tips,by:S.user.name,at:now(),arrangeCount:1};
    s.interviews.push(f1);s.interview=f1;
    addLog("安排面试",s.name+" · "+(((byId(s.jobId)||{}).title)||""),"",t+" / "+p);
    doAdvance(id,"面试中");
    return;
  }
  var r=batchRun(function(s){
    if(SUB_FLOW[s.status].indexOf("面试中")<0)return "不允许的流转";
    var from=s.status;
    itvRounds(s);
    var nb={round:s.interviews.length+1,time:t,place:p,resume:resume,tips:tips,by:S.user.name,at:now(),arrangeCount:1};
    s.interviews.push(nb);s.interview=nb;
    s.status="面试中";
    s.history.push({t:now(),act:"批量流转",by:S.user.name,from:from,to:"面试中"});
    addLog("批量安排面试",s.name+" · "+(((byId(s.jobId)||{}).title)||""),from,t+" / "+p);
    return true;
  });
  if(!r)return;
  batchResult("","",r);
}
function rejectMode(){
  var el=document.querySelector('#rj_opts input[name="rj_m"]:checked');
  return el?el.value:"不合适";
}
function rejectPick(){
  var m=rejectMode();
  [].forEach.call(document.querySelectorAll("#rj_opts .rjopt"),function(l){
    var i=l.querySelector("input");
    l.className="rjopt"+(i&&i.value===m?" on":"");
  });
  var b=$("rj_bk");if(b)b.style.display=(m==="黑名单"?"":"none");
}
/* 证据附件上传（拉黑分支）：点击 / 拖拽 → 文件名+体积列表，可移除；提交时以文件名留痕 */
function rjPick(){
  var el=$("rj_f");
  if(!el||typeof el.click!=="function"){toast("当前环境不支持选择文件","err");return}
  el.click();
}
function rjDrop(e){
  if(e&&e.preventDefault)e.preventDefault();
  var fs=e&&e.dataTransfer&&e.dataTransfer.files;
  if(fs&&fs.length)rjAccept([].slice.call(fs));
}
function rjPicked(input){
  var fs=input&&input.files;
  if(fs&&fs.length)rjAccept([].slice.call(fs));
  if(input){try{input.value=""}catch(e){}}
}
function rjAccept(fs){
  fs.forEach(function(f){
    if(RJ_FILES.length>=5){toast("最多上传 5 个附件","err");return}
    if(f.size>20*1024*1024){toast("「"+f.name+"」超过 20 MB，已跳过","err");return}
    RJ_FILES.push({name:f.name,size:fmtSize(f.size)});
  });
  rjDraw();
}
function rjDraw(){
  var el=$("rj_fl");if(!el)return;
  el.innerHTML=RJ_FILES.map(function(f,i){
    return '<div style="display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-top:8px">'+
      '<div style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+
      '<span style="color:var(--ink3);font-size:12px;margin-left:8px">'+esc(f.size)+'</span></div>'+
      '<button class="btn sm dgg" onclick="rjDel('+i+')">移除</button></div>';
  }).join("");
}
function rjDel(i){RJ_FILES.splice(i,1);rjDraw()}
function doReject(id,batch){
  var m=rejectMode(),note=(val("rj_n")||"").trim();
  if(!note){toast("备注必填，请说明不合适的具体依据","err");return}
  var reason="",ev="";
  if(m==="黑名单"){
    if(!hasPerm("block.add")){toast("当前角色无拉黑权限，请联系管理员","err");return}
    reason=val("rj_r")||BLOCK_REASONS[0];
    ev=RJ_FILES.map(function(f){return f.name}).join("、");
    if(!ev){toast("拉黑必须留存证据附件","err");return}
  }
  closeAll();
  function markTrue(s,c,from){          /* 写入状态 + 备注流转记录 + 拉黑（黑名单分支） */
    s.status="不合适";
    s.history.push({t:now(),act:batch?"批量流转":"状态流转",by:S.user.name,from:from,to:"不合适",
      note:note+(m==="黑名单"?"（同时加入黑名单："+reason+"）":"")});
    if(m==="黑名单"){
      c.blocked=1;c.blockReason=reason;c.blockEvidence=ev;c.blockBy=S.user.name;c.blockAt=now();
      c.blockUntil=dayAdd(730);c.pooled=0;
    }
    var jt=((byId(s.jobId)||{}).title)||"";
    addLog(m==="黑名单"?"不合适并拉黑":"不合适",
      s.name+" · "+jt,from,"不合适"+(m==="黑名单"?" · 黑名单":""));
    return true;
  }
  if(batch){
    var r=batchRun(function(s,c){
      if(SUB_FLOW[s.status].indexOf("不合适")<0)return "当前状态不可处理（"+s.status+"）";
      return markTrue(s,c,s.status);
    });
    if(!r)return;
    batchResult('已处理为「<b>不合适</b>」：<b>'+r.okN+'</b> 份'+
      (m==="黑名单"?'，并已加入黑名单':'')+'。备注：'+esc(note),
      '备注已逐条写入流转记录（动作：批量流转）。',r);
    return;
  }
  var s=bySub(id);if(!s)return;
  if(SUB_FLOW[s.status].indexOf("不合适")<0){toast("当前状态不可处理","err");return}
  var c=ensureCand(s);
  if(m==="黑名单"&&c.blocked){toast("该候选人已在黑名单中","err");return}
  markTrue(s,c,s.status);
  save();render();
  toast("已处理为「不合适」"+(m==="黑名单"?"，并加入黑名单":""),"ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}
/* 转入人才库（复合动作，单条与批量共用）：
   ① 投递状态置「不合适」（本岗位本轮不录用）② 候选人主档打人才库标记 ③ 入池原因必填（下拉）
   状态机不再有「转入人才库」这个状态值，避免与「不合适」语义重复 */
function openPool(id,batch){
  if(!hasPerm("pool.manage")){toast("当前角色无人才库维护权限","err");return}
  if(batch&&!S.sSel.length){toast("请先勾选候选人","err");return}
  if(batch&&S.sSel.length>SUB_BATCH_MAX){toast("单次最多处理 "+SUB_BATCH_MAX+" 份，请分批操作","err");return}
  var n=batch?S.sSel.length:1,nm=batch?"":esc(((bySub(id)||{}).name)||"");
  var body=
   '<div class="fld"><label>入池原因 <i>*</i></label><select class="ip" id="pl_r">'+
     '<option value="">请选择原因</option>'+
     POOL_REASONS.map(function(r){return '<option value="'+esc(r)+'">'+esc(r)+'</option>'}).join("")+'</select>'+
     '<div class="hint">原因会记在候选人的人才库档案里，复用时可直接参考</div></div>'+
   '<div class="notice" style="margin-top:4px">确认后：本次投递状态记为<b>「不合适」</b>，候选人（按手机号识别）加入<b>人才库</b>，可被后续岗位复用；黑名单候选人不可入池。</div>';
  openModal("转入人才库"+(batch?" · 已选 "+n+" 份":" · "+nm),body,
    '<button class="btn" onclick="closeAll()">取消</button>'+
    '<button class="btn pri" onclick="doPool(\''+(batch?"":id)+'\','+(batch?1:0)+')">确认转入'+(batch?"（"+n+" 份）":"")+'</button>');
}
function doPool(id,batch){
  var reason=(val("pl_r")||"").trim();
  if(!reason){toast("请选择入池原因","err");return}
  function mark(s,c,from){
    var already=(s.status==="不合适");
    s.status="不合适";
    if(c.blocked)return "黑名单候选人";
    c.pooled=1;c.poolBy=S.user.name;c.poolAt=now();c.poolReason=reason;
    s.history.push({t:now(),act:batch?"批量转入人才库":"转入人才库",by:S.user.name,
      from:from,to:"不合适",note:(already?"补充入池（投递已是不合适）":"转入人才库")+" · 原因："+reason});
    addLog("转入人才库",s.name+" · "+((byId(s.jobId)||{}).title||""),from,"不合适 · 人才库（"+reason+"）");
    return true;
  }
  if(batch){
    var r=batchRun(function(s,c){
      if(SUB_FLOW[s.status].indexOf("转入人才库")<0)return "当前状态不可转入人才库（"+s.status+"）";
      if(c.pooled)return "已在人才库";   /* 已入池的不再重复打标 */
      return mark(s,c,s.status);
    });
    if(!r)return;
    batchResult('已转入人才库：<b>'+r.okN+'</b> 份（状态记为「不合适」）。入池原因：'+esc(reason),
      '入池标记打在候选人主档上，投递停在「不合适」。',r);
    return;
  }
  var s=bySub(id);if(!s)return;
  if(SUB_FLOW[s.status].indexOf("转入人才库")<0){toast("当前状态不可转入人才库","err");return}
  var c=ensureCand(s);
  if(c.blocked){toast("黑名单候选人不可转入人才库（两者互斥）","err");return}
  mark(s,c,s.status);
  closeAll();save();render();
  toast("已转入人才库（状态记为「不合适」）","ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}
/* 批量执行骨架：统一前置校验 + 遍历选择集；act(s,c) 返回 true=成功，返回字符串=跳过原因 */
function batchRun(act){
  if(!canWrite()){toast("只读角色不可操作","err");return null}
  if(!S.sSel.length){toast("请先勾选候选人","err");return null}
  if(S.sSel.length>SUB_BATCH_MAX){toast("单次最多处理 "+SUB_BATCH_MAX+" 份，请分批操作","err");return null}
  var bt=batchTabStatus(),okN=0,skip={},skipped=[];
  function add(r,who){skip[r]=(skip[r]||0)+1;if(who)skipped.push(who+"："+r)}
  S.sSel.slice().forEach(function(id){
    var s=bySub(id);
    if(!s){add("记录不存在");return}
    if(bt&&s.status!==bt){add("状态已变更（当前 "+s.status+"）",s.name);return}
    var c=ensureCand(s);
    if(c.blocked){add("黑名单候选人",s.name);return}
    var r=act(s,c);
    if(r===true){okN++;return}
    add(r||"不允许的流转",s.name);
  });
  save();S.sSel=[];S.sPage=1;render();
  return {okN:okN,skip:skip,skipped:skipped};
}
/* 批量结果：不再弹「批量处理完成」窗，只 toast「操作成功」；有跳过时附带数量，便于发现漏网 */
function batchResult(head,logNote,r){
  if(!r)return;
  closeAll();
  var skipN=0;Object.keys(r.skip||{}).forEach(function(k){skipN+=r.skip[k]});
  toast(skipN?("操作成功，"+r.okN+" 份成功，"+skipN+" 份跳过"):"操作成功","ok");
}

function examImpMatch(r){   /* 校验一行：返回 ""=通过，否则为错误原因 */
  var list=S.subs.filter(function(s){return s.status==="笔试中"&&s.phone===r.phone});
  if(!list.length)return "手机号未匹配到「笔试中」的候选人";
  var s=list[0];
  if(s.name!==r.name)return "姓名与手机号不匹配（系统："+s.name+"）";
  var jt=((byId(s.jobId)||{}).title)||"";
  if(r.job&&jt&&r.job!==jt)return "投递岗位与系统记录不一致（"+jt+"）";
  if(r.attend!=="到场"&&r.attend!=="缺考")return "到场情况只能填「到场」或「缺考」";
  if(r.attend==="到场"&&r.result!=="通过"&&r.result!=="不通过")return "笔试结论只能填「通过」或「不通过」";
  if(r.score&&isNaN(Number(r.score)))return "成绩需为数字";
  return "";
}

function ccDel(el){el.parentNode.remove()}
function ccKey(e,id){
  if(e.key==="Enter"||e.key===","){e.preventDefault();ccAdd(id)}
  else if(e.key==="Backspace"&&!e.target.value){
    var ts=document.querySelectorAll("#"+id+"_box .cctag");
    if(ts.length)ts[ts.length-1].remove();
  }
}
function ccAdd(id){
  var inp=$(id+"_ccin"),v=(inp.value||"").trim().replace(/,+$/,"");
  if(!v)return;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){toast("邮箱格式不正确","err");return}
  var dup=false;
  document.querySelectorAll("#"+id+"_box .cctag").forEach(function(t){if(t.dataset.v===v)dup=true});
  if(dup){inp.value="";return}
  var sp=document.createElement("span");
  sp.className="cctag";sp.dataset.v=v;
  sp.setAttribute("style","display:inline-flex;align-items:center;gap:6px;background:#f1f3f7;border-radius:5px;padding:4px 7px;font-size:12.5px;color:var(--ink)");
  sp.innerHTML=esc(v)+'<span onclick="ccDel(this)" style="cursor:pointer;color:var(--ink3);font-size:14px;line-height:1">×</span>';
  inp.parentNode.insertBefore(sp,inp);
  inp.value="";
}

  var real=(val("ob_real")||"").trim();
  if(!real){toast("请填写实际入职日期","err");return}
  var note=(val("ob_note")||"").trim();
  applyOnboard(s,real,note);
  save();closeAll();render();S.curSub=id;openSub(id);
  toast("已登记入职（"+real+"）","ok");
}
function openNoShow(id,pre){   /* pre=1：从「登记 offer 拒绝」进入（待回复阶段），弹框默认情况即候选人拒绝 */
  if(!hasPerm("subs.onboard")){toast("当前角色无入职跟进权限","err");return}
  var s=bySub(id);if(!s)return;
  if(!canWrite()){toast("只读角色不可登记","err");return}
  var o=s.onboard||{};
  var tos=ONB_TO.filter(function(x){return x[0]!=="黑名单"||hasPerm("block.manage")});
  var body=
   '<div class="fld"><label>情况</label><select class="ip" id="ob_cs">'+
     ONB_CASES.map(function(x){return '<option'+(o.cs===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div>'+
   '<div class="fld"><label>原因</label><select class="ip" id="ob_rs">'+
     ONB_REASONS.map(function(x){return '<option'+(o.reason===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div>'+
   '<div class="fld"><label>补充说明（选填）</label><textarea class="ip" id="ob_note" rows="2" style="min-height:48px" placeholder="如：已确认接受其他公司 offer，一年后可再联系"></textarea></div>'+
   '<div class="fld"><label>后续去向</label><select class="ip" id="ob_to">'+
     tos.map(function(x){return '<option value="'+x[0]+'"'+(o.to===x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select></div>'+
   '<div class="notice">登记后投递状态仍停在「已发 offer」，跟进状态记为「未入职」；去向选人才库或黑名单时同步给候选人打标记。</div>';
  openModal((pre?"登记 offer 拒绝":"登记未入职")+" · "+esc(s.name),body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn dgg" onclick="saveNoShow(\''+id+'\')">'+(pre?"确认拒绝":"确认未入职")+'</button>');
}
function applyNoShow(s,cs,rs,note,to){
  var o=onb(s),c=ensureCand(s),extra="";
  if(to==="人才库"){
    c.blocked=0;c.pooled=1;c.poolBy=S.user.name;c.poolAt=now();c.poolReason="offer 未入职 · "+rs;extra="，已转入人才库";
  }else if(to==="黑名单"){
    c.blocked=1;c.blockReason=cs+" · "+rs;c.blockEvidence=note||"（未附证据文件）";
    c.blockBy=S.user.name;c.blockAt=now();c.blockUntil=dayAdd(730);c.pooled=0;extra="，已加入黑名单";
  }
  o.state="未入职";o.cs=cs;o.reason=rs;o.note=note;o.to=to;o.by=S.user.name;o.at=now();
  s.history.push({t:now(),act:"未入职",by:S.user.name,
    note:(cs?cs+" · ":"")+rs+(note?"；"+note:"")+(extra?"（"+extra.replace("，","")+"）":"")});
  if(to==="不合适"){                      /* 终态：结束本次投递 */
    s.status="不合适";
    s.history.push({t:now(),act:"状态流转",by:S.user.name,from:"已发 offer",to:"不合适",note:"offer 未入职"});
    extra="，已转不合适";
  }
  addLog("登记未入职",s.name+" · "+(((byId(s.jobId)||{}).title)||""),cs,rs+extra);
  return extra;
}
function saveNoShow(id){
  var s=bySub(id);if(!s)return;
  var cs=val("ob_cs"),rs=val("ob_rs"),note=(val("ob_note")||"").trim(),to=val("ob_to")||"";
  var extra=applyNoShow(s,cs,rs,note,to);
  save();closeAll();render();S.curSub=id;openSub(id);
  toast("已登记未入职"+extra,"ok");
}
/* ---------- 终态逆向：恢复投递（B-53） ---------- */
function revertTo(s){          /* 回到这条投递最后一次进入终态之前的环节；找不到则不提供恢复 */
  if(s.status!=="不合适"&&s.status!=="转入人才库")return "";
  var h=(s.history||[]).slice().reverse();
  for(var i=0;i<h.length;i++){
    var x=h[i];
    if(x.act==="状态流转"&&x.from&&(x.to==="不合适"||x.to==="转入人才库"))return x.from;
  }
  return "";
}
function revertCount(s){return (s.history||[]).filter(function(x){return x.act==="恢复投递"}).length}
function openRevert(id){
  var s=bySub(id);if(!s)return;
  if(!isAdmin()){toast("仅管理员可恢复投递","err");return}
  var to=revertTo(s);
  if(!to){toast("找不到可恢复的上一环节","err");return}
  var c=candOf(s.phone);
  if(c&&c.blocked){toast("该候选人仍在黑名单中，请先解除黑名单","err");return}
  var j=byId(s.jobId),st=j?jobEffStatus(j):"";
  var dead=!j||st!=="online";
  var n=revertCount(s);
  var body=
   '<div class="notice" style="margin-bottom:12px">将把该投递从「'+esc(s.status)+'」恢复到 <b>'+esc(to)+'</b>：恢复后重新出现在「'+esc(to)+'」页签，可继续正常流转，原有的笔试记录、面试评价与 Offer 文件都保留。</div>'+
   '<div class="fld"><label>恢复原因 <i>*</i></label><textarea class="ip" id="rv_n" rows="3" placeholder="如：面试评价录入有误，经复核后重新进入面试"></textarea>'+
     '<div class="hint">原「'+esc(s.status)+'」记录不会删除，本次恢复会追加到流转记录与操作日志，供复核。</div></div>'+
   (dead?'<div class="notice" style="margin-bottom:10px;border-color:var(--warn);background:var(--warnl)">所属岗位当前为「'+esc((JOB_STATUS[st]||{}).t||"—")+'」，恢复后仅作档案保留，无法继续推进到后续环节。</div>':'')+
   (n?'<div class="notice" style="margin-bottom:10px">该投递已恢复过 <b>'+n+'</b> 次，请确认是否重复往返。</div>':'')+
   '<div class="hint">候选人不会收到通知（系统不自动发拒信）；如已线下告知，请自行沟通。</div>';
  openModal("恢复投递 · "+esc(s.name),body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn pri" onclick="doRevert(\''+id+'\')">确认恢复到「'+esc(to)+'」</button>');
}
function applyRevert(s,note){            /* 恢复内核：单条恢复与「移出人才库」共用，口径一致 */
  var to=revertTo(s);
  if(!to)return "";
  var from=s.status;
  s.status=to;
  if(to==="已发 offer"&&s.onboard&&onbState(s)==="未入职")s.onboard=null;   /* 未入职 → 回到待回复，原记录留在流转历史 */
  s.history.push({t:now(),act:"恢复投递",by:S.user.name,from:from,to:to,note:note});
  addLog("恢复投递",s.name+" · "+(((byId(s.jobId)||{}).title)||""),from,to+"（"+note+"）");
  return to;
}
function doRevert(id){
  var s=bySub(id);if(!s)return;
  if(!isAdmin()){toast("仅管理员可恢复投递","err");return}
  var note=(val("rv_n")||"").trim();
  if(!note){toast("请填写恢复原因","err");return}
  var from=s.status;
  var to=applyRevert(s,note);
  if(!to){toast("找不到可恢复的上一环节","err");return}
  save();closeAll();render();S.curSub=id;openSub(id);
  toast("已从「"+from+"」恢复到「"+to+"」","ok");
}
/* ---------- 已发 offer：批量跟进（B-51） ---------- */
/* 批量登记 offer 回复：接受 / 拒绝二选一，作用于勾选中的「待回复」份，状态不符自动跳过 */
function openBatchReply(){
  if(!hasPerm("subs.batch")){toast("当前角色无该操作权限","err");return}
  if(!canWrite()){toast("只读角色不可登记","err");return}
  if(!S.sSel.length){toast("请先勾选候选人","err");return}
  if(S.sSel.length>SUB_BATCH_MAX){toast("单次最多处理 "+SUB_BATCH_MAX+" 份，请分批操作","err");return}
  var n=S.sSel.length,e=onbBatchElig(),tos=ONB_TO.filter(function(x){return x[0]!=="黑名单"||hasPerm("block.manage")});
  var body=
   '<div class="notice" style="margin-bottom:12px">已选 <b>'+n+'</b> 份：<b>'+e.reply+'</b> 份「待回复」将登记回复结果'+
     (n-e.reply?'，其余 <b>'+(n-e.reply)+'</b> 份跟进状态不符将跳过':'')+'。</div>'+
   '<div class="fld"><label>候选人回复</label><div style="display:flex;gap:18px;font-size:13.5px;padding-top:2px">'+
     '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="or_res" id="or_y" value="1" checked onchange="obMode(\'or\',this.value===\'1\')">接受</label>'+
     '<label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="radio" name="or_res" id="or_n" value="0" onchange="obMode(\'or\',this.value===\'1\')">拒绝</label>'+
   '</div></div>'+
   '<div id="or_acc">'+
     '<div class="fld"><label>约定入职日期 <i>*</i></label><input class="ip" id="ob_plan" value="'+esc(dayAdd(14))+'"></div>'+
     '<div class="fld"><label>确认方式</label><select class="ip" id="ob_ch">'+
       ["邮件回复","电话确认","书面签署","微信确认"].map(function(x){return '<option>'+x+'</option>'}).join("")+'</select></div>'+
   '</div>'+
   '<div id="or_rej" style="display:none">'+
     '<div class="fld"><label>原因</label><select class="ip" id="ob_rs">'+
       ONB_REASONS.map(function(x){return '<option>'+x+'</option>'}).join("")+'</select></div>'+
     '<div class="fld"><label>后续去向</label><select class="ip" id="ob_to">'+
       tos.map(function(x){return '<option value="'+x[0]+'">'+x[1]+'</option>'}).join("")+'</select></div>'+
   '</div>'+
   '<div class="fld"><label>备注（选填）</label><textarea class="ip" id="ob_note" rows="2" style="min-height:48px" placeholder="如：同一批次 offer 的统一答复"></textarea></div>'+
   '<div class="notice">投递状态仍停在「已发 offer」；拒绝时去向选人才库 / 黑名单会同步给候选人打标记，选「转不合适」则结束本次投递。</div>';
  openModal("批量登记 offer 回复 · 已选 "+n+" 份",body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn pri" onclick="saveBatchReply()">确认登记（'+e.reply+' 份）</button>');
}
function saveBatchReply(){
  var note=(val("ob_note")||"").trim();
  if($("or_y").checked){
    var plan=(val("ob_plan")||"").trim();
    if(!plan){toast("请填写约定入职日期","err");return}
    var ch=val("ob_ch");
    closeAll();
    var r=batchRun(function(s){
      if(onbState(s)!=="待回复")return "跟进状态不符（当前 "+onbState(s)+"）";
      return applyAccept(s,plan,ch,note);
    });
    if(!r)return;
    batchResult('已将 <b>'+r.okN+'</b> 份登记为「<b>待入职</b>」，约定入职 '+esc(plan)+'。',
      '每条已写入流转记录（动作：offer 已接受）与操作日志。',r);
  }else{
    var rs=val("ob_rs"),to=val("ob_to")||"";
    closeAll();
    var r=batchRun(function(s){
      if(onbState(s)!=="待回复")return "跟进状态不符（当前 "+onbState(s)+"）";
      applyNoShow(s,"候选人拒绝",rs,note,to);
      return true;
    });
    if(!r)return;
    batchResult('已将 <b>'+r.okN+'</b> 份登记为「<b>未入职</b>」（候选人拒绝 · '+esc(rs)+'）。',
      '每条已写入流转记录（动作：未入职）与操作日志。',r);
  }
}
