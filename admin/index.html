function resetOnb(id){
  var s=bySub(id);if(!s)return;
  if(!isAdmin()){toast("仅管理员可更正","err");return}
  confirmBox("更正跟进结果 · "+esc(s.name),
    "确定把入职跟进重置为「待回复」吗？<br><span style=\"color:var(--ink3);font-size:13px\">原登记记录会保留在流转记录中，可重新登记。</span>",
    "确认更正","doResetOnb('"+id+"')",1);
}
function doResetOnb(id){
  var s=bySub(id);if(!s)return;
  closeAll();
  s.onboard={state:"待回复",planDate:"",realDate:"",cs:"",reason:"",note:"",to:"",by:"",at:""};
  s.history.push({t:now(),act:"更正跟进结果",by:S.user.name,note:"入职跟进重置为「待回复」"});
  addLog("更正跟进结果",s.name+" · "+(((byId(s.jobId)||{}).title)||""),"","重置为待回复");
  save();render();S.curSub=id;openSub(id);
  toast("已重置为「待回复」","ok");
}
function openOffer(id){
  var s=bySub(id);if(!s)return;
  if(!hasPerm("subs.offer")){toast("当前角色无创建 Offer 权限","err");return}
  if(offersOf(id).length){toast("已存在 Offer 文件，如需重新生成请先删除原文件","err");return}
  if(["面试中","拟录用","已发 offer"].indexOf(s.status)<0){toast("仅「面试中」及之后的候选人可创建 Offer","err");return}
  var j=byId(s.jobId);
  var m=matchTpl(j);            /* 无启用模板时仍可打开表单，改用手动上传 */
  S.offerDraft={subId:id,src:"系统生成",tplId:m?m.tpl.id:"",vars:defaultVars(s,j),
    reason:m?m.reason:"未匹配到启用中的模板",manual:0,file:null};
  drawOfferForm(s,j);
}
function drawOfferForm(s,j){
  var d=S.offerDraft;if(!d)return;
  var src=offerSrc(d),sb=bySub(d.subId)||s;
  var body=offerSrcField(sb,src)+(src==="手动上传"?offerUploadBlock():offerTplBlock(sb,j));
  var foot=src==="手动上传"
    ?'<button class="btn" onclick="closeAll()">取消</button>'+
     '<button class="btn pri" onclick="uploadOffer(\''+sb.id+'\')">确认上传</button>'
    :'<button class="btn" onclick="closeAll()">取消</button>'+
     '<button class="btn pri" onclick="previewOffer(\''+sb.id+'\')">预览全文</button>';
  openModal("创建 Offer · "+esc(sb.name)+" · "+(j?esc(j.title):""),body,foot,true);
}
function offerSrc(d){return (d&&d.src==="手动上传")?"手动上传":"系统生成"}
/* Offer 来源：系统生成（按模板） / 手动上传（直接传 PDF）——置于「Offer 模板」之上 */
function offerSrcField(s,src){
  var seg='<div style="display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line2);border-radius:9px;background:#f2f4f7">'+
    OFFER_SRC.map(function(x){
      var on=(src===x);
      return '<button type="button" onclick="setOfferSrc(\''+s.id+'\',\''+x+'\')" '+
        'style="cursor:pointer;font:inherit;font-size:13px;line-height:1.6;padding:5px 18px;border:0;border-radius:6px;'+
        (on?'background:#fff;color:var(--brand-d);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.14)'
           :'background:transparent;color:var(--ink2)')+'">'+x+'</button>';
    }).join("")+'</div>';
  return '<div class="fld"><label>Offer 来源</label>'+seg+
    '<div class="hint">'+(src==="手动上传"
      ?"上传已确认 / 已盖章的 Offer 文件（PDF），作为该候选人的 Offer 文件存档"
      :"按 Offer 模板生成 PDF，可先预览全文再生成")+'</div></div>';
}
function offerTplBlock(s,j){
  var d=S.offerDraft,tpls=enabledTpls(),tpl=tplById(d.tplId)||tpls[0];
  if(!tpl)return '<div class="banner"><span>⚠</span><div class="sp">没有启用中的 Offer 模板，请先到「Offer 模板」页启用一个模板，或把 Offer 来源改为「手动上传」。</div></div>';
  if(d.tplId!==tpl.id)d.tplId=tpl.id;
  var sel=tpls.map(function(t){return '<option value="'+t.id+'"'+(d.tplId===t.id?" selected":"")+'>'+
    esc(t.name)+'（v'+t.ver+' · '+tplTrackName(t)+'）</option>'}).join("");
  var ks=tplVars(tpl);
  var custom=ks.filter(function(k){return OFFER_VARS.indexOf(k)<0});
  var jobTr=TPL_TRACK_NAME[(j&&j.track)||"social"]||"社招";
  var warnTpl=(d.manual&&tplTrackKey(tpl)!==((j&&j.track)||"social")&&tplTrackKey(tpl)!=="any")
    ?'<div class="banner" style="margin-bottom:12px"><span>⚠</span><div class="sp">当前模板适用「'+tplTrackName(tpl)+'」，与本次岗位通道「'+jobTr+'」不一致，请确认是否引用正确。</div></div>':'';
  var fields=ks.map(function(k,i){
    var req=REQ_VARS.indexOf(k)>=0||custom.indexOf(k)>=0;   /* 模板自定义变量一律必填 */
    return '<div class="fld"><label>'+esc(k)+(req?' <span style="color:var(--danger)">*</span>':'')+
      (custom.indexOf(k)>=0?' <span class="pill o">模板自定义</span>':'')+'</label>'+
      '<input class="ip" id="ov'+i+'" value="'+esc((d.vars||{})[k]||"")+'"></div>';
  }).join("");
  return warnTpl+
   '<div class="fld"><label>Offer 模板</label><select class="ip" id="of_tpl" onchange="pickTpl(\''+s.id+'\',this.value)">'+sel+'</select></div>'+
   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 14px">'+fields+'</div>';
}
/* 手动上传：Offer 附件上传组件（选择 / 拖拽 / 移除），选中后展示文件名与体积 */
function offerUploadBlock(){
  var d=S.offerDraft,f=d&&d.file,inner;
  if(f){
    inner='<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:11px 13px">'+
      '<div style="width:34px;height:34px;border-radius:6px;background:var(--dangerl);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:0 0 auto">PDF</div>'+
      '<div style="flex:1;min-width:0"><div style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</div>'+
      '<div style="font-size:12px;color:var(--ink3)">'+esc(f.size)+'</div></div>'+
      '<button class="btn sm" onclick="offerFilePick()">重新选择</button>'+
      '<button class="btn sm dgg" onclick="clearOfferFile()">移除</button>'+
    '</div>'+
    '<div class="hint">确认后即作为该候选人的 Offer 文件，可预览 / 下载 / 删除；删除后可重新上传。</div>';
  }else{
    inner='<div style="border:1px dashed var(--line2);border-radius:9px;background:#fafbfc;padding:24px 16px;text-align:center" '+
      'ondragover="event.preventDefault()" ondrop="dropOfferFile(event)">'+
      '<div style="font-size:13.5px;color:var(--ink2)">点击选择文件，或把 PDF 拖到此处</div>'+
      '<div style="font-size:12px;color:var(--ink3);margin-top:4px">仅支持 PDF，单个文件不超过 20 MB</div>'+
      '<div style="margin-top:12px"><button class="btn sm pri" onclick="offerFilePick()">选择文件</button></div>'+
    '</div>'+
    '<div class="hint">上传的是已经线下确认的 Offer，系统只做存档，不解析内容。</div>';
  }
  return '<div class="fld"><label>Offer 附件 <span style="color:var(--danger)">*</span></label>'+inner+
    '<input type="file" id="of_file" accept=".pdf,application/pdf" style="display:none" onchange="pickOfferFile(this)"></div>';
}
function offerFilePick(){
  var el=$("of_file");
  if(!el||typeof el.click!=="function"){toast("当前环境不支持选择文件","err");return}
  el.click();
}
function pickOfferFile(input){
  acceptOfferFile(input&&input.files&&input.files[0]);
  if(input){try{input.value=""}catch(e){}}
}
function dropOfferFile(e){
  if(e&&e.preventDefault)e.preventDefault();
  acceptOfferFile(e&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);
}
function acceptOfferFile(f){
  var d=S.offerDraft;if(!d||!f)return;
  if(!/\.pdf$/i.test(f.name||"")){toast("仅支持 PDF 文件","err");return}
  if(f.size>20*1024*1024){toast("文件超过 20 MB，请压缩后再上传","err");return}
  d.file={name:f.name,size:fmtSize(f.size)};
  var sb=bySub(d.subId);if(sb)drawOfferForm(sb,byId(sb.jobId));
  toast("已选择："+f.name,"ok");
}
function clearOfferFile(){
  var d=S.offerDraft;if(!d)return;
  d.file=null;
  var sb=bySub(d.subId);if(sb)drawOfferForm(sb,byId(sb.jobId));
}
function fmtSize(n){
  n=Number(n)||0;
  if(n>=1024*1024)return (n/1048576).toFixed(1)+" MB";
  return Math.max(1,Math.round(n/1024))+" KB";
}
function setOfferSrc(subId,src){
  var s=bySub(subId),d=S.offerDraft;if(!s||!d)return;
  if(offerSrc(d)===src)return;
  if(offerSrc(d)==="系统生成")readOfferVars();        /* 切走前留存已填关键字 */
  d.src=src;
  drawOfferForm(s,byId(s.jobId));
}
function uploadOffer(id){
  var s=bySub(id),d=S.offerDraft;if(!s||!d)return;
  if(!canWrite()){toast("只读角色不可上传 Offer","err");return}
  if(!d.file){toast("请先选择要上传的 Offer 文件","err");return}
  if(offersOf(id).length){toast("已存在 Offer 文件，如需重新上传请先删除原文件","err");return}
  var j=byId(s.jobId);
  var o={id:"of"+Date.now(),subId:id,candName:s.name,jobId:s.jobId,jobTitle:j?j.title:"—",
    src:"手动上传",tplId:"",tplName:"",tplVer:"",tplTrack:"",
    fileName:d.file.name,size:d.file.size,rendered:"",
    createdBy:S.user.name,createdAt:now()};
  S.offers.unshift(o);                          /* 只落一个 Offer 文件，不改候选人状态 */
  addLog("上传 Offer 文件",s.name+" · "+o.jobTitle,"手动上传",o.fileName);
  if(S.secClosed)S.secClosed.offer=false;   /* 生成 / 上传后确保 Offer 文件区展开可见 */
  save();S.offerDraft=null;closeAll();render();
  toast("Offer 文件已上传","ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}
function pickTpl(subId,tplId){        /* 切换模板：先存已填内容，再按新模板重绘表单 */
  var s=bySub(subId);if(!s)return;
  readOfferVars();
  S.offerDraft.tplId=tplId;S.offerDraft.manual=1;
  drawOfferForm(s,byId(s.jobId));
}
function readOfferVars(){
  var d=S.offerDraft,v=d.vars||{};
  var ks=tplVars(tplById(d.tplId));
  ks.forEach(function(k,i){if($("ov"+i))v[k]=($("ov"+i).value||"").trim()});
  d.vars=v;return v;
}
function offerDocHtml(subj,txt,meta,isHtml){   /* 预览用的「纸张」卡片：标题取模板邮件标题，正文按模板换行分段 */
  var paras=isHtml?'<div class="docbody">'+String(txt||"")+'</div>'
    :String(txt||"").split("\n").map(function(l){
      return l.trim()===""?'<div style="height:8px"></div>':'<div style="font-size:13.5px;line-height:1.95">'+esc(l)+'</div>';
    }).join("");
  return '<div style="background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:0 1px 4px rgba(16,24,40,.08);padding:26px 30px 20px">'+
    '<div style="font-size:16.5px;font-weight:700;text-align:center;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line)">'+esc(subj||"录用通知")+'</div>'+
    paras+
    (meta?'<div style="margin-top:18px;padding-top:12px;border-top:1px dashed var(--line2);font-size:11.5px;color:var(--ink3);line-height:1.8">'+meta+'</div>':'')+
  '</div>';
}
function previewOffer(id){
  var s=bySub(id);if(!s)return;
  var d=S.offerDraft;if(!d)return;
  if(offerSrc(d)!=="系统生成"){toast("手动上传无需预览模板全文，请直接选择文件","err");return}
  var v=readOfferVars();
  var tpl=tplById(d.tplId);
  if(!tpl){toast("请选择模板","err");return}
  var ks=tplVars(tpl),custom=ks.filter(function(k){return OFFER_VARS.indexOf(k)<0});
  var miss=ks.filter(function(k){return !v[k]&&(REQ_VARS.indexOf(k)>=0||custom.indexOf(k)>=0)});
  var subj=renderTpl(tpl,v,tpl.subject);
  var isH=!!tpl.html,txt=isH?renderTplHtml(tpl,v):renderTpl(tpl,v);
  var body=
   (miss.length?'<div class="banner" style="margin-bottom:12px"><span>⚠</span><div class="sp">必填项未填写：'+esc(miss.join("、"))+
      '。渲染结果中以「（待填写：X）」标出，建议补全后再生成。</div></div>':'')+
   '<div class="notice" style="margin-bottom:12px">以下为按模板 <b>'+esc(tpl.name)+' v'+tpl.ver+'</b> 变量替换后的全文，与生成的 PDF 内容一致。</div>'+
   offerDocHtml(subj,txt,'预览效果 · 生成后即为该 PDF 内容',isH);
  openModal("Offer 预览 · "+esc(s.name)+" · "+esc(tpl.name)+" v"+tpl.ver,body,
    '<button class="btn" onclick="drawOfferForm(bySub(\''+id+'\'),byId(bySub(\''+id+'\').jobId))">返回修改</button>'+
    '<button class="btn pri" onclick="genOffer(\''+id+'\')">生成 PDF</button>',true);
}
function genOffer(id){
  var s=bySub(id);if(!s)return;
  var d=S.offerDraft;if(!d)return;
  if(offerSrc(d)!=="系统生成"){toast("当前为手动上传，请使用上传流程","err");return}
  var tpl=tplById(d.tplId);if(!tpl){toast("模板不存在或已停用","err");return}
  var v=readOfferVars();
  var ks=tplVars(tpl),custom=ks.filter(function(k){return OFFER_VARS.indexOf(k)<0});
  var miss=ks.filter(function(k){return !v[k]&&(REQ_VARS.indexOf(k)>=0||custom.indexOf(k)>=0)});
  if(miss.length){toast("请先填写必填项："+miss.join("、"),"err");return}
  var j=byId(s.jobId);
  var isH=!!tpl.html;
  var o={id:"of"+Date.now(),subId:id,candName:s.name,jobId:s.jobId,jobTitle:j?j.title:"—",
    src:"系统生成",
    tplId:tpl.id,tplName:tpl.name,tplVer:tpl.ver,tplTrack:tplTrackName(tpl),
    vars:JSON.parse(JSON.stringify(v)),
    subject:renderTpl(tpl,v,tpl.subject),html:isH?1:0,
    rendered:isH?renderTplHtml(tpl,v):renderTpl(tpl,v),
    createdBy:S.user.name,createdAt:now()};
  o.fileName=offerFileName(o);o.size=offerSize(o);
  S.offers.unshift(o);                          /* 只落一个 Offer 文件，不改候选人状态 */
  addLog("生成 Offer PDF",s.name+" · "+o.jobTitle,tpl.name+" v"+tpl.ver,o.fileName);
  if(S.secClosed)S.secClosed.offer=false;   /* 生成 / 上传后确保 Offer 文件区展开可见 */
  save();S.offerDraft=null;closeAll();render();
  toast("Offer PDF 已生成","ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
  downloadOfferPdf(o.id);
}
/* Offer 以「文件」形态存在：一份 PDF，可预览 / 下载 / 删除；删除后可重新生成 */
function offerFileName(o){
  var tail=(o.kind==="pre"?"拟录用通知":"录用通知")+".pdf";
  return (o.fileName||(o.candName+"-"+o.jobTitle+"-"+tail)).replace(/[\\/:*?"<>|]/g,"-");
}
function offerSize(o){                          /* 演示：按正文长度估算文件体积 */
  var n=String(o.rendered||"").length;
  var kb=Math.max(96,Math.round((96+n*0.32)/10)*10);
  return kb+" KB";
}
function offerPdfHtml(o){               /* PDF 观感页面：预览窗口使用，打印 / 另存即为成品 PDF */
  if(o.src==="手动上传")return offerUploadedHtml(o);
  var paras=o.html?'<div class="bd">'+String(o.rendered||"")+'</div>'
    :String(o.rendered||"").split("\n").map(function(l){
      return l.trim()===""?'<div style="height:9px"></div>':'<div style="line-height:2">'+esc(l)+'</div>';
    }).join("");
  var hasSign=(o.rendered||"").indexOf("红星实业集团")>=0;
  return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>'+esc(offerFileName(o))+'</title><style>'+
    'body{margin:0;padding:32px 0;background:#f2f4f7;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1e2532}'+
    '.pg{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:24mm 20mm;box-sizing:border-box;box-shadow:0 2px 14px rgba(0,0,0,.1);font-size:15px}'+
    'h1{font-size:20px;text-align:center;margin:0 0 24px;padding-bottom:14px;border-bottom:1px solid #e4e8ef;font-weight:700}'+
    '.bd{line-height:2}'+
    '.bd p{margin:0 0 10px}.bd ul,.bd ol{margin:0 0 10px;padding-left:24px}.bd li{margin:3px 0}'+
    '.bd h3{font-size:16px;margin:16px 0 10px;font-weight:700}.bd blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid #e4e8ef;color:#555}'+
    '.ft{margin-top:36px;text-align:right;color:#333}'+
    '.wm{position:fixed;right:14px;bottom:10px;font-size:11px;color:#9aa2b1;background:rgba(255,255,255,.92);padding:4px 8px;border-radius:4px}'+
    '@media print{body{background:#fff;padding:0}.pg{box-shadow:none;margin:0;width:auto;min-height:auto;padding:0}.wm{display:none}}'+
    '</style></head><body><div class="pg">'+
    '<h1>'+esc(o.subject||"录用通知书")+'</h1>'+paras+
    (hasSign?'':'<div class="ft">红星实业集团 人力资源中心<br>'+esc((o.vars&&o.vars["发件日期"])||"")+'</div>')+
    '</div><div class="wm">'+esc(S.user.name)+' 预览于 '+esc(now())+'</div></body></html>';
}

  return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1">'+
    '<title>'+esc(offerFileName(o))+'</title><style>'+
    'body{margin:0;padding:32px 0;background:#f2f4f7;font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1e2532}'+
    '.pg{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:24mm 20mm;box-sizing:border-box;'+
    'box-shadow:0 2px 14px rgba(0,0,0,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}'+
    '.ic{width:64px;height:64px;border-radius:12px;background:#fdeceb;color:#d9392b;font-size:15px;font-weight:700;'+
    'display:flex;align-items:center;justify-content:center;margin-bottom:18px}'+
    '.nm{font-size:16px;font-weight:700;word-break:break-all;max-width:150mm}'+
    '.sz{font-size:13px;color:#8a8a8a;margin-top:6px}'+
    '.mt{margin-top:26px;font-size:12.5px;color:#8a8a8a;line-height:1.9;border-top:1px dashed #e4e8ef;padding-top:14px}'+
    '.wm{position:fixed;right:14px;bottom:10px;font-size:11px;color:#9aa2b1;background:rgba(255,255,255,.92);padding:4px 8px;border-radius:4px}'+

    '</style></head><body><div class="pg">'+
    '<div class="ic">PDF</div>'+
    '<div class="nm">'+esc(offerFileName(o))+'</div>'+
    '<div class="sz">'+esc(o.size||"")+'</div>'+
    '<div class="mt">该 Offer 由 HR 手动上传'+
      '<br>上传人：'+esc(o.createdBy||"—")+'　上传时间：'+esc(o.createdAt||"—")+
      '<br>演示环境未接入真实文件，此处为占位预览；生产环境直接渲染上传的 PDF 原文件。</div>'+
    '</div><div class="wm">'+esc(S.user.name)+' 预览于 '+esc(now())+'</div></body></html>';

function previewOfferPdf(oid){
  var o=offerById(oid);if(!o)return;
  var nm=o.kind==="pre"?"拟录用文件":"Offer PDF";
  addLog("预览 "+nm,o.candName+" · "+o.jobTitle,offerFileName(o),"新窗口打开预览");
  save();
  if(typeof window.open!=="function"){toast("当前环境不支持打开新窗口","err");return}
  var w=window.open("","_blank");
  if(!w){toast("新窗口被浏览器拦截，请允许本站弹出窗口后重试","err");return}
  w.document.write(offerPdfHtml(o));w.document.close();
  toast("已在新窗口打开 "+nm,"ok");
}
function downloadOfferPdf(oid){
  var o=offerById(oid);if(!o)return;
  addLog("下载 "+(o.kind==="pre"?"拟录用文件":"Offer PDF"),o.candName+" · "+o.jobTitle,offerFileName(o),"签名链接（5 分钟有效）");
  save();
  toast("已生成 PDF 下载链接："+offerFileName(o)+"（演示：5 分钟内有效）","ok");
}
function delOfferPdf(oid){
  var o=offerById(oid);if(!o)return;
  if(!canWrite()){toast("只读角色不可删除","err");return}
  var isPre=o.kind==="pre",nm=isPre?"拟录用文件":"Offer 文件";
  confirmBox("删除 "+nm,"确认删除 <b>"+esc(offerFileName(o))+"</b>？<br>删除后可重新生成新的 PDF。","确认删除","doDelOfferPdf('"+oid+"')",1);
}
function doDelOfferPdf(oid){
  var o=offerById(oid);if(!o)return;
  var isPre=o.kind==="pre";
  var i=S.offers.indexOf(o);if(i>=0)S.offers.splice(i,1);
  addLog("删除 "+(isPre?"拟录用文件":"Offer 文件"),o.candName+" · "+o.jobTitle,offerFileName(o),"文件已删除");
  closeAll();save();render();
  if(S.curSub)openSub(S.curSub);
  toast((isPre?"拟录用文件":"Offer 文件")+"已删除，可重新生成","ok");
}
function pgOfferTpl(){
  var tpls=S.offerTpls||[];
  var q=(S.oQ||"").trim().toLowerCase(),kf=S.tplKind||"";
  var rows=tpls.filter(function(t){return !kf||tplKind(t)===kf}).filter(function(t){return !q||t.name.toLowerCase().indexOf(q)>=0}).map(function(t){
    return '<tr><td><div class="tt">'+esc(t.name)+'</div></td>'+
      '<td><span class="pill '+(tplKind(t)==="pre"?"o":"n")+'">'+esc(tplKindName(t))+'</span></td>'+
      '<td><span class="pill b">'+esc(tplTrackName(t))+'</span></td>'+
      '<td style="font-size:13px;color:var(--ink2)" title="'+esc(t.subject||"未设置")+'">'+esc(t.subject||"—")+'</td>'+
      '<td>'+(t.status==="enabled"?'<span class="pill g"><i class="dt"></i>启用</span>':'<span class="pill n"><i class="dt"></i>停用</span>')+'</td>'+
      '<td style="font-size:13px;color:var(--ink3)">'+esc(t.updatedBy)+'<div class="mt"><span>'+esc(t.updatedAt)+'</span></div></td>'+
      '<td class="op">'+
        (hasPerm("otpl.edit")?'<button class="btn sm" onclick="editTpl(\''+t.id+'\')">编辑</button>':'')+
        (hasPerm("otpl.toggle")?'<button class="btn sm" onclick="toggleTpl(\''+t.id+'\')">'+(t.status==="enabled"?"停用":"启用")+'</button>':'')+
        (hasPerm("otpl.dup")?'<button class="btn sm" onclick="dupTpl(\''+t.id+'\')">复制</button>':'')+
        '<button class="btn sm" onclick="previewTpl(\''+t.id+'\')">预览</button>'+
      '</td></tr>';
  }).join("");
  return '<div class="card">'+
  '<div class="toolbar">'+
    '<input class="ip sr" placeholder="搜索模板名称" value="'+esc(S.oQ)+'" oninput="S.oQ=this.value;render()">'+
    '<select class="ip" style="width:132px" onchange="S.tplKind=this.value;render()">'+
      '<option value=""'+(kf?"":" selected")+'>全部用途</option>'+
      TPL_KIND.map(function(x){return '<option value="'+x[0]+'"'+(kf===x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select>'+
    '<button class="btn" onclick="S.oQ=\'\';S.tplKind=\'\';render()">重置</button>'+

function rteToolbar(edId,mini){

function rteBox(html,opt){
  opt=opt||{};

      'data-ph="'+esc(opt.ph||"在此撰写正文，可从下方变量点击插入到光标处…")+'" '+
      (opt.input?'oninput="'+opt.input+'" onblur="'+opt.input+'" ':'')+
      'onpaste="rtePaste(event,\''+id+'\')">'+html+'</div></div>'+

function rteKeep(id){                    /* 保证编辑器内有光标：在内部就保留，不在就落到末尾 */
  var ed=$(id||"tp_body_ed");if(!ed)return null;
  var sel=window.getSelection();
  if(!sel||!sel.rangeCount||!ed.contains(sel.anchorNode)){
    var r=document.createRange();r.selectNodeContents(ed);r.collapse(false);
    if(sel){sel.removeAllRanges();sel.addRange(r)}
    return sel;
  }
  return sel;
}
function rteCmd(cmd,id){
  var ed=$(id||"tp_body_ed");if(!ed)return;
  ed.focus();rteKeep(id);
  try{document.execCommand(cmd,false,null)}catch(e){}
  ed.dispatchEvent(new Event("input"));
}
function rteInsertVar(k,id){
  var ed=$(id||"tp_body_ed");if(!ed)return;
  var txt="{{"+k+"}}";
  ed.focus();
  var sel=rteKeep(id),ok=false;
  try{ok=document.execCommand("insertText",false,txt)}catch(e){ok=false}
  if(!ok&&sel&&sel.rangeCount){            /* 兜底：直接改 DOM，光标停在插入内容之后 */
    var r=sel.getRangeAt(0);r.deleteContents();
    var tn=document.createTextNode(txt);r.insertNode(tn);
    r.setStartAfter(tn);r.collapse(true);sel.removeAllRanges();sel.addRange(r);
  }
  ed.dispatchEvent(new Event("input"));
}
function rtePaste(e,id){                 /* 只收纯文本，避免从 Word 带入整段样式污染排版 */
  if(!e.clipboardData)return;
  e.preventDefault();
  var t=e.clipboardData.getData("text/plain")||"";
  try{document.execCommand("insertText",false,t)}catch(err){}
  var ed=$(id||"tp_body_ed");
  if(ed)ed.dispatchEvent(new Event("input"));
}

function itvRounds(s){
  if(!s)return [];
  if(!s.interviews||!s.interviews.length){
    s.interviews=[];
    if(s.interview&&s.interview.time)s.interviews.push(s.interview);
  }
  s.interviews.forEach(function(r,i){if(!r.round)r.round=i+1});
  s.interview=s.interviews[s.interviews.length-1]||null;
  return s.interviews;
}
/* 取某轮；不传轮次则取最新一轮（当前轮） */
function itvRound(s,n){
  var rs=itvRounds(s);
  if(n==null)return rs[rs.length-1]||null;
  var hit=rs.filter(function(r){return r.round===n})[0];
  return hit||rs[rs.length-1]||null;
}
/* 面试结论徽标：未录入=等待录入，缺考=红，通过=绿，不通过=红，待定=橙 */
function itvPill(v){
  if(!v||!v.done)return '<span class="pill a">等待录入</span>';
  if(v.attend==="缺考")return '<span class="pill r">缺考</span>';
  var r=v.result||"待定";
  return '<span class="pill '+(r==="通过"?"g":(r==="不通过"?"r":"a"))+'">'+esc(r)+'</span>';
}
/* 档案页的笔试 / 面试评价摘要：只读，按录入时间倒序（未录入的排最后），完整记录仍在「流程」页签 */
function evalSummarySec(s){
  var items=[],e=s.exam;
  if(e){
    var done=(e.status==="已完成");
    var res=done?(e.attend==="缺考"?"缺考":(e.result||"待定")):"待录入";
    var cls=done?((res==="缺考"||res==="不通过")?"r":(res==="通过"?"g":"a")):"a";
    items.push({ts:done?(e.gradeAt||""):"",
      h:'<div class="isum"><div class="isum-h"><b>笔试</b>'+
      '<span class="isum-m">'+esc(e.examTime||"—")+'</span>'+
      '<span class="pill '+cls+'"><i class="dt"></i>'+esc(res)+'</span></div>'+
      '<div class="isum-b'+(done?"":" ph")+'">'+
        (done?('成绩 '+esc(e.score||"—")+(e.comment?'　'+esc(e.comment):"")):"待录入笔试记录")+
      '</div></div>'});
  }
  var rs=itvRounds(s);
  rs.slice().reverse().forEach(function(v){
    var rn=v.round||1;
    var txt=v.done?esc(v.comment||"（未填写面试评价）"):"待录入面试记录";
    items.push({ts:v.done?(v.doneAt||""):"",
      h:'<div class="isum"><div class="isum-h"><b>第 '+rn+' 面</b>'+
      '<span class="isum-m">'+esc(v.time||"—")+(v.interviewer?' · 面试官 '+esc(v.interviewer):"")+'</span>'+
      itvPill(v)+'</div>'+
      '<div class="isum-b'+(v.done?"":" ph")+'">'+txt+'</div></div>'});
  });
  items.sort(function(a,b){return (b.ts||"").localeCompare(a.ts||"")});
  if(!items.length)return '<div class="dempty">尚无笔试 / 面试记录</div>';
  /* 「查看完整记录」固定放第一条标题行右侧（margin-left:auto 顶到行尾） */
  var link='<span class="op-a mute" style="margin-left:auto" onclick="goItv()">查看完整记录 ›</span>';
  items[0].h=items[0].h.replace('</div>',link+'</div>');
  return items.map(function(x){return x.h}).join("");
}

/* ---------- 附件上传组件（演示环境只留文件名与大小，不落真实二进制） ----------
   upBox(id,{multi,files,accept,t,s}) 出组件；文件选择 → 拖拽 → upAdd / upRemove / upFiles */
var UP={},UP_OPT={};
function upExt(n){
  var m=String(n||"").split(".");
  return (m.length>1?m.pop():"FILE").toUpperCase().slice(0,4);
}
function upSize(b){
  if(!b)return "";
  if(b<1024)return b+" B";
  if(b<1048576)return (b/1024).toFixed(1)+" KB";
  return (b/1048576).toFixed(1)+" MB";
}
function upListHtml(id){
  var opt=UP_OPT[id]||{};
  return (UP[id]||[]).map(function(f,i){
    return '<div class="upf"><div class="bd">'+esc(upExt(f.name))+'</div>'+
      '<div class="nm" title="'+esc(f.name)+'">'+esc(f.name)+'</div>'+
      (f.size?'<div class="sz">'+upSize(f.size)+'</div>':'')+
      (!opt.multi?'<button class="btn sm" onclick="upPick(\''+id+'\')">重新上传</button>':'')+
      '<button class="x" title="删除" onclick="upRemove(\''+id+'\','+i+')">×</button></div>';
  }).join("");
}
function upBox(id,opt){
  opt=opt||{};UP_OPT[id]=opt;
  UP[id]=(opt.files||[]).map(function(f){return typeof f==="string"?{name:f,size:0}:f});
  var n=(UP[id]||[]).length;
  return '<div class="upz" id="uz_'+id+'"'+(n&&!opt.multi?' style="display:none"':'')+
      ' onclick="upPick(\''+id+'\')"'+
      ' ondragover="event.preventDefault();this.classList.add(\'on\')"'+
      ' ondragleave="this.classList.remove(\'on\')"'+
      ' ondrop="event.preventDefault();this.classList.remove(\'on\');upAdd(\''+id+'\',event.dataTransfer.files)">'+
      '<div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg></div>'+
      '<div class="t">'+(opt.t||"点击上传，或将文件拖到此处")+'</div>'+
      '<div class="s">'+(opt.s||"")+'</div></div>'+
    '<div class="upl" id="ul_'+id+'">'+upListHtml(id)+'</div>';
}
function upSync(id){
  var opt=UP_OPT[id]||{},n=(UP[id]||[]).length;
  var z=$("uz_"+id),l=$("ul_"+id);
  if(l)l.innerHTML=upListHtml(id);
  if(z)z.style.display=(!opt.multi&&n>=1)?"none":"";
}
function upPick(id){
  var opt=UP_OPT[id]||{};
  var inp=document.createElement("input");
  inp.type="file";inp.accept=opt.accept||".pdf,.jpg,.jpeg,.png,.doc,.docx";
  if(opt.multi)inp.multiple=true;
  inp.style.display="none";
  inp.onchange=function(){upAdd(id,inp.files);};
  document.body.appendChild(inp);inp.click();
}
function upAdd(id,fl){
  var opt=UP_OPT[id]||{},add=[];
  Array.prototype.forEach.call(fl||[],function(f){add.push({name:f.name,size:f.size||0})});
  if(!add.length)return;
  UP[id]=opt.multi?(UP[id]||[]).concat(add):[add[0]];   /* 单份：新选中的直接替换旧文件 */
  upSync(id);
}
function upRemove(id,i){
  UP[id]=(UP[id]||[]).slice();UP[id].splice(i,1);upSync(id);
}
function upFiles(id){return (UP[id]||[]).slice()}

function doInterviewRec(id){
  if(!canWrite()){toast("只读角色不可录入面试记录","err");return}

function openPreCreate(id){
  if(!hasPerm(FLOW_PERM["拟录用"]||"subs.offer")){toast("当前角色无该操作权限","err");return}
  if(!canWrite()){toast("只读角色不可发起拟录用","err");return}
  var s=bySub(id);if(!s)return;
  if(["面试中","拟录用"].indexOf(s.status)<0){toast("仅「面试中 / 拟录用」可创建拟录用文件","err");return}
  var j=byId(s.jobId)||{},tpl=matchPreTpl(j);
  if(!tpl){toast("没有启用中的拟录用模板，请到「Offer 模板」启用","err");return}
  S.preDraft={subId:id,tplId:tpl.id,vars:defaultVars(s,j)};
  drawPreForm();
}
function drawPreForm(){
  var d=S.preDraft;if(!d)return;
  var s=bySub(d.subId);
  if(!s){S.preDraft=null;return}
  var j=byId(s.jobId)||{};
  var tpls=enabledTpls().filter(function(t){return tplKind(t)==="pre"});
  var tpl=tplById(d.tplId)||tpls[0];
  if(!tpl){toast("没有启用中的拟录用模板，请到「Offer 模板」启用","err");S.preDraft=null;return}
  if(d.tplId!==tpl.id)d.tplId=tpl.id;
  var sel=tpls.map(function(t){return '<option value="'+t.id+'"'+(d.tplId===t.id?" selected":"")+'>'+
    esc(t.name)+'（v'+t.ver+' · '+tplTrackName(t)+'）</option>'}).join("");
  var ks=tplVars(tpl),custom=ks.filter(function(k){return OFFER_VARS.indexOf(k)<0});
  var fields=ks.map(function(k,i){
    var req=REQ_VARS.indexOf(k)>=0||custom.indexOf(k)>=0;
    return '<div class="fld"><label>'+esc(k)+(req?' <span style="color:var(--danger)">*</span>':'')+
      (custom.indexOf(k)>=0?' <span class="pill o">模板自定义</span>':'')+'</label>'+
      '<input class="ip" id="pv'+i+'" value="'+esc((d.vars||{})[k]||"")+'"></div>';
  }).join("");
  var body=
   '<div class="fld"><label>拟录用模板</label><select class="ip" id="pre_tpl" onchange="pickPreTpl(\''+s.id+'\',this.value)">'+sel+'</select></div>'+
   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 14px">'+fields+'</div>'+
   '<div class="hint">关键字已按岗位与候选人信息自动带出，可修改后预览。</div>';
  openModal("创建拟录用文件 · "+esc(s.name)+" · "+(j?esc(j.title):""),body,
    '<button class="btn" onclick="closeAll()">取消</button>'+
    '<button class="btn pri" onclick="previewPre(\''+s.id+'\')">预览全文</button>',true);
}
function pickPreTpl(subId,tplId){       /* 切换模板：先存已填关键字，再按新模板重绘表单 */
  var s=bySub(subId);if(!s||!S.preDraft)return;
  readPreVars();
  S.preDraft.tplId=tplId;
  drawPreForm();
}
function readPreVars(){
  var d=S.preDraft,v=d.vars||{};
  var ks=tplVars(tplById(d.tplId));
  ks.forEach(function(k,i){if($("pv"+i))v[k]=($("pv"+i).value||"").trim()});
  d.vars=v;return v;
}
function previewPre(id){
  var s=bySub(id),d=S.preDraft;if(!s||!d)return;
  var tpl=tplById(d.tplId);if(!tpl){toast("请选择模板","err");return}
  var v=readPreVars();
  var ks=tplVars(tpl),custom=ks.filter(function(k){return OFFER_VARS.indexOf(k)<0});
  var miss=ks.filter(function(k){return !v[k]&&(REQ_VARS.indexOf(k)>=0||custom.indexOf(k)>=0)});
  var subj=renderTpl(tpl,v,tpl.subject);

   (miss.length?'<div class="banner" style="margin-bottom:12px"><span>⚠</span><div class="sp">必填项未填写：'+esc(miss.join("、"))+

function genPreFile(id){

  if(["面试中","拟录用"].indexOf(s.status)<0){toast("仅「面试中 / 拟录用」可生成拟录用文件","err");return}
  var v=readPreVars();

    createdBy:S.user.name,createdAt:now()};
  o.size=offerSize(o);

function advance(id,to){
  if(!hasPerm(FLOW_PERM[to]||"subs.screen")){toast("当前角色无权执行该流转","err");return}
  var s=bySub(id),j=byId(s.jobId),from=s.status;
  if(SUB_FLOW[from].indexOf(to)<0){toast("不允许的流转："+from+" → "+to,"err");return}
  if(to==="不合适"){openReject(id,0);return}   /* 备注必填 + 两个分支，统一走不合适处理弹窗 */
  if(to==="转入人才库"){openPool(id,0);return}   /* 复合动作：状态置不合适 + 人入池 + 原因必填 */
  if(to==="初筛通过"){openScreenPass(id,0);return}   /* 初筛意见选填，写入流转记录节点备注 */
  if(to==="面试中"){openInterview(id,0);return}   /* 先填面试时间 / 地点 / 携带简历 / 注意事项 */
  if(to==="拟录用"){openPreCreate(id);return}   /* 仿「创建 Offer」弹窗：选模板 → 预览 → 生成（确认后流转，不通知候选人） */
  if(to==="已发 offer"){openSendOffer(id);return}   /* 发送 Offer：核对附件 / 条款 / 收件人后再流转 */
  doAdvance(id,to);
}
function doAdvance(id,to,opt){
  if(!canWrite()){toast("只读角色不可流转","err");return}
  var s=bySub(id),j=byId(s.jobId),from=s.status;
  if(SUB_FLOW[from].indexOf(to)<0){toast("不允许的流转："+from+" → "+to,"err");return}
  if(to==="不合适"){openReject(id,0);return}
  var c=ensureCand(s);
  s.status=to;
  s.history.push({t:now(),act:"状态流转",by:S.user.name,from:from,to:to,note:(opt&&opt.note)||""});
  var nf=NOTIFY[to],quiet=(opt&&opt.noNotify);
  if(nf&&!quiet)s.notify.push({t:now(),ch:nf.ch,to:s.email,
    cc:nf.ccOwner?ownerEmail(j?j.owner:null):"",content:nf.txt(s,j)});
  addLog("候选人状态流转",s.name+" · "+(j?j.title:""),from,to);
  save();closeAll();render();
  if(!(opt&&opt.noToast))
    toast("已转为「"+to+"」"+((nf&&!quiet)?"，邮件已通知候选人并抄送招聘负责人":""),"ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}

  '</div><div class="notice">账号 ID 由系统生成，不可修改。停用后该账号无法登录后台，其负责岗位仍保留。</div>';
  openModal(id?"编辑账号 · "+esc(a.name):"新建账号",body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn pri" onclick="saveAcct(\''+esc(a.id)+'\')">保存</button>');

function saveAcct(id){
  var get=function(k){var e=$(k);return e?e.value.trim():""};
  var name=get("a_name"),title=get("a_title"),email=get("a_email");
  if(!name||!title||!email){toast("姓名、职务、邮箱为必填项","err");return}
  var o={name:name,title:title,email:email,phone:get("a_phone"),role:get("a_role"),status:get("a_status")};
  if(id){
    var cur=S.accounts.filter(function(x){return x.id===id})[0];
    var before=cur.name+" / "+roleName(cur.role)+" / "+(cur.status==="active"?"启用":"停用");
    Object.keys(o).forEach(function(k){cur[k]=o[k]});
    addLog("编辑账号",name,before,name+" / "+roleName(cur.role)+" / "+(cur.status==="active"?"启用":"停用"));
    if(cur.id===S.user.id){S.user=JSON.parse(JSON.stringify(cur))}
  }else{
    var nid="u"+Math.random().toString(36).slice(2,7);
    S.accounts.push(Object.assign({id:nid},o));
    addLog("新建账号",name,"",roleName(o.role)+" / "+(o.status==="active"?"启用":"停用"));
  }
  save();closeAll();render();toast("账号已保存","ok");
}
function toggleAcct(id){
  if(!hasPerm("accounts.toggle")){toast("当前角色无账号启停权限","err");return}
  var a=S.accounts.filter(function(x){return x.id===id})[0];
  if(a.id===S.user.id){toast("不能停用自己的账号","err");return}
  var to=a.status==="active"?"disabled":"active";
  addLog(to==="active"?"启用账号":"停用账号",a.name,a.status==="active"?"启用":"停用",to==="active"?"启用":"停用");
  a.status=to;save();render();toast(to==="active"?"已启用":"已停用","ok");
}

function openRole(id){

    '<div class="fld"><label>角色标识<i>*</i></label><input class="ip" id="r_code" value="'+esc(r?r.id:"")+'"'+(isNew?' placeholder="小写字母，如 lead"':' readonly style="background:#fafbfc;color:var(--ink3)"')+'>'+
      '<div class="hint">'+(isNew?"创建后不可修改，用于账号与权限绑定":"角色标识创建后不可修改")+'</div></div>'+
  '</div>'+
  '<div class="fld"><label>数据范围</label><select class="ip" id="r_scope"'+((r&&r.builtin)?" disabled style=\"background:#fafbfc;color:var(--ink3)\"":"")+'>'+

  '</select>'+((r&&r.builtin)?'<div class="hint">内置角色的数据范围固定，需要其他范围请新建自定义角色</div>':'')+'</div>'+
  '<div class="fld"><label>角色说明</label><textarea class="ip" id="r_desc" rows="2" style="min-height:52px" placeholder="简要说明该角色的职责范围，便于后续维护">'+esc(r?r.desc:"")+'</textarea></div>'+
  (isNew?'<div class="fld"><label>权限来源</label><select class="ip" id="r_copy">'+
      '<option value="">空白（保存后在权限配置中勾选）</option>'+
      S.roles.map(function(x){return '<option value="'+x.id+'">复制「'+esc(x.name)+'」的权限</option>'}).join("")+
    '</select><div class="hint">保存后会自动打开权限配置，可继续调整</div></div>':
    '<div class="notice">角色的菜单与操作权限在「配置权限」中调整；仅修改名称与说明不会影响已有权限。</div>');

function saveRole(id){
  if(!hasPerm(id?"roles.edit":"roles.create")){toast("当前角色无角色维护权限","err");return}
  var name=(($("r_name")||{}).value||"").trim();
  var code=(($("r_code")||{}).value||"").trim().toLowerCase();
  var desc=(($("r_desc")||{}).value||"").trim();
  var scopeEl=$("r_scope"),scope=scopeEl?scopeEl.value:"own";
  if(!name){toast("请填写角色名称","err");return}
  if(id){
    var r=roleById(id);if(!r)return;
    var before=r.name+" / "+SCOPE_NAME[r.scope];
    r.name=name;r.desc=desc;
    if(!r.builtin)r.scope=scope;
    addLog("编辑角色",name,before,name+" / "+SCOPE_NAME[r.scope]);
    save();closeAll();render();toast("角色已保存","ok");
    return;
  }
  if(!/^[a-z][a-z0-9_]{2,15}$/.test(code)){toast("角色标识需以字母开头，3-16 位小写字母 / 数字 / 下划线","err");return}
  if(roleById(code)||ROLES[code]){toast("角色标识已存在，请更换","err");return}
  var src=(($("r_copy")||{}).value)||"";
  var base=src?roleById(src):null;
  S.roles.push({id:code,name:name,desc:desc,scope:scope,builtin:0,perms:base?base.perms.slice():[]});
  addLog("新建角色",name,"",SCOPE_NAME[scope]+" / 权限 "+(base?base.perms.length:0)+" 项");
  save();closeAll();render();toast("角色已创建，请继续配置权限","ok");
  setTimeout(function(){openPerm(code)},10);
}
function openPerm(id){
  if(!hasPerm("roles.perm")){toast("当前角色无权限配置权限","err");return}
  var r=roleById(id);if(!r)return;
  var locked=r.id==="admin";
  var body='<div class="notice" style="margin-bottom:14px">'+
    '角色 <b>'+esc(r.name)+'</b> · 数据范围 <b>'+SCOPE_NAME[r.scope]+'</b>'+
    (locked?' · 内置管理员固定拥有全部权限，不可调整':'')+
    (r.id===S.user.role?'<br><span style="color:var(--warn)">这是你当前登录使用的角色，保存后立即对本人生效。</span>':'')+
  '</div>';
  if(!locked)body+='<div class="fld"><label>数据范围</label><select class="ip" id="pm_scope"'+(r.builtin?' disabled style="background:#fafbfc;color:var(--ink3)"':'')+'>'+
    ["all","own","read"].map(function(s){return '<option value="'+s+'"'+(r.scope===s?" selected":"")+'>'+SCOPE_NAME[s]+'</option>'}).join("")+
    '</select>'+(r.builtin?'<div class="hint">内置角色的数据范围固定，如需其他范围请新建自定义角色</div>':'')+'</div>';
  PERM_GROUPS.forEach(function(g,gi){
    var c=g.items.filter(function(it){return locked||r.perms.indexOf(it[0])>=0}).length;
    body+='<div class="pmx"><div class="pmh"><b>'+g.g+'</b><span id="pmc'+gi+'">'+c+' / '+g.items.length+'</span><div class="sp"></div>'+
      (locked?'':'<span class="lnk" onclick="pmAll('+gi+',1)">全选</span><span class="dv">|</span><span class="lnk" onclick="pmAll('+gi+',0)">清空</span>')+
      '</div><div class="pmb" id="pmg'+gi+'"><div class="pm-i">'+
      g.items.map(function(it){
        var on=locked||r.perms.indexOf(it[0])>=0;
        return '<label class="pm-c'+(on?" on":"")+(locked?" dis":"")+'" title="'+esc(it[2])+'">'+
          '<input type="checkbox" class="pmk" data-k="'+it[0]+'"'+(on?" checked":"")+(locked?" disabled":"")+' onchange="pmTick(this,'+gi+')">'+
          '<span>'+esc(it[1])+'<div class="k">'+it[0]+'</div></span></label>';
      }).join("")+'</div></div></div>';
  });
  openModal("配置权限 · "+esc(r.name),body,
    '<button class="btn" onclick="closeAll()">'+(locked?"关闭":"取消")+'</button>'+
    (locked?'':'<button class="btn pri" onclick="savePerm(\''+r.id+'\')">保存权限</button>'),1);
}
function pmTick(el,gi){
  var lb=el.parentNode;
  while(lb&&lb.tagName!=="LABEL")lb=lb.parentNode;
  if(lb)lb.className="pm-c"+(el.checked?" on":"");
  if(gi!=null)pmCount(gi);
}
function pmAll(gi,on){
  var box=$("pmg"+gi);if(!box)return;
  var ks=box.querySelectorAll("input.pmk");
  for(var i=0;i<ks.length;i++){ks[i].checked=!!on;pmTick(ks[i],null)}
  pmCount(gi);
}
function pmCount(gi){
  var box=$("pmg"+gi),el=$("pmc"+gi);if(!box||!el)return;
  var ks=box.querySelectorAll("input.pmk"),n=0;
  for(var i=0;i<ks.length;i++)if(ks[i].checked)n++;
  el.textContent=n+" / "+ks.length;
}
function savePerm(id){
  if(!hasPerm("roles.perm")){toast("当前角色无权限配置权限","err");return}
  var r=roleById(id);if(!r)return;
  if(r.id==="admin"){toast("内置管理员固定拥有全部权限","err");return}
  var ks=[],boxes=document.querySelectorAll("#md input.pmk");
  for(var i=0;i<boxes.length;i++)if(boxes[i].checked)ks.push(boxes[i].getAttribute("data-k"));
  var scEl=$("pm_scope"),sc=scEl?scEl.value:r.scope;
  var before=r.perms.length+" 项 / "+SCOPE_NAME[r.scope];
  r.perms=ks;
  if(!r.builtin)r.scope=sc;
  addLog("调整角色权限",r.name,before,ks.length+" 项 / "+SCOPE_NAME[r.scope]);
  save();closeAll();render();
  toast(r.id===S.user.role?"权限已保存，已对当前账号生效":"权限已保存，绑定该角色的账号刷新后生效","ok");
}
function delRole(id){
  if(!hasPerm("roles.delete")){toast("当前角色无删除角色权限","err");return}
  var r=roleById(id);if(!r)return;
  if(r.builtin){toast("内置角色不可删除","err");return}
  var n=S.accounts.filter(function(a){return a.role===id}).length;
  if(n){toast("该角色下还有 "+n+" 个账号，请先在「账号管理」改派","err");return}
  if(r.id===S.user.role){toast("不能删除自己正在使用的角色","err");return}
  confirmBox("删除角色","确定删除角色 <b>"+esc(r.name)+"</b>？<br><span style=\"color:var(--ink3);font-size:13px\">删除后其权限配置一并移除，不可恢复。</span>","确认删除","doDelRole('"+id+"')",1);
}
function doDelRole(id){
  var r=roleById(id);if(!r)return;
  S.roles=S.roles.filter(function(x){return x.id!==id});
  addLog("删除角色",r.name,r.perms.length+" 项权限 / "+SCOPE_NAME[r.scope],"角色已删除");
  save();render();toast("角色已删除","ok");
}

  return '<div class="card"><div class="hd"><h3>'+o.title+'</h3><div class="sp"></div>'+
    '<span style="font-size:12.5px;color:var(--ink3)">共 '+o.list.length+' 个</span></div><div class="bd">'+
    '<div style="font-size:12.5px;color:var(--ink3);margin-bottom:12px">'+o.desc+'</div>'+
    '<div class="ctags">'+o.list.map(function(c){
      return '<span class="ctag">'+esc(c)+'<span class="x" title="删除" onclick="'+o.del+'(\''+esc(c)+'\')">×</span></span>';
    }).join("")+'</div>'+
    '<div style="display:flex;gap:10px;align-items:flex-end;margin-top:14px">'+
      '<div class="fld" style="margin:0;width:190px"><label>'+o.addLabel+'</label>'+
        '<input class="ip" id="'+o.inputId+'" placeholder="'+o.ph+'" onkeydown="if(event.key===\'Enter\')'+o.add+'()"></div>'+
      '<button class="btn pri" onclick="'+o.add+'()">添加</button>'+
    '</div>'+
  '</div></div>';
}
function addCity(){
  if(!hasPerm("sys.setting")){toast("无权限修改系统设置","err");return}
  var e=$("st_city");if(!e)return;
  var v=(e.value||"").trim();
  if(!v){toast("请输入城市名称","warn");e.focus();return}
  if(v.length>10){toast("城市名称不超过 10 个字","warn");return}
  S.settings.cities=cityList().slice();
  if(S.settings.cities.indexOf(v)>=0){toast("「"+v+"」已存在","warn");return}
  S.settings.cities.push(v);
  addLog("新增工作城市",v,"","工作城市字典共 "+S.settings.cities.length+" 个");
  save();render();toast("已添加「"+v+"」","ok");
}
function delCity(name){
  if(!hasPerm("sys.setting")){toast("无权限修改系统设置","err");return}
  var used=S.jobs.filter(function(j){return j.city===name}).length;
  if(used){toast("有 "+used+" 个岗位在用「"+name+"」，请先调整岗位工作城市","err");return}
  if(cityList().length<=1){toast("至少保留一个工作城市","err");return}
  S.settings.cities=cityList().filter(function(c){return c!==name});
  addLog("删除工作城市",name,"","工作城市字典剩 "+S.settings.cities.length+" 个");
  save();render();toast("已删除「"+name+"」","ok");
}

function delCat(name){

  if(catList().length<=1){toast("至少保留一个职位类别","err");return}
  S.settings.cats=catList().filter(function(c){return c!==name});

function saveSettings(){
  var g=function(k){var e=$(k);return e?e.value:""};
  S.settings={inbox:g("st_inbox"),cc:g("st_cc"),retain:g("st_retain"),maxSize:g("st_size"),
    autoExpire:g("st_exp"),blockIntercept:g("st_block"),cities:cityList().slice(),cats:catList().slice()};
  addLog("修改系统设置","邮件汇总与合规配置","",S.settings.inbox+" / 抄送 "+S.settings.cc+" / 留存 "+S.settings.retain+" 个月");
  save();render();toast("设置已保存","ok");
}
function exportJson(){
  var data=JSON.stringify({jobs:S.jobs,subs:S.subs,accounts:S.accounts,settings:S.settings},null,2);
  var blob=new Blob([data],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="redstar-hr-data.json";a.click();
  toast("已导出 redstar-hr-data.json","ok");
}
function doReset(){
  seedAll();S.user=null;save();renderLogin();toast("已重置为初始数据","ok");
}

/* ==========================================================
   自动过期（B-15）
   ========================================================== */
function runExpire(manual){
  if(S.settings.autoExpire==="0"&&!manual)return 0;
  var n=0;
  S.jobs.forEach(function(j){
    if(j.status==="online"&&j.deadline<today()){
      j.status="expired";j.updated_at=now();j.updated_by="定时任务";n++;
      addLog("岗位自动过期",j.title,"在招","已过期（截止 "+j.deadline+"）· 已通知负责人 "+ownerName(j.owner));
    }
  });
  if(n){recalc();save()}
  if(manual){render();toast(n?"检测到 "+n+" 个过期岗位，已置为「已过期」":"未检测到过期岗位","ok")}
  return n;
}

/* ==========================================================
   启动
   ========================================================== */
if(!load()){seedAll()}
seedInterviews();   /* 兼容旧数据：仅补齐缺失的演示面试信息，不覆盖已填内容 */
seedPlans();        /* 兼容旧数据：尚无拟录用样本时补两份，供演示该环节 */
runExpire(0);
render();
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
</script>
