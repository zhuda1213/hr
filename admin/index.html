<!doctype html>
<html lang="zh-CN" data-page-node-id="hpIpcFzhHwVRDsXXdd5p1z">
<head data-page-node-id="kpSVa2w2lOV3iuVGOs01cf">
<meta charset="utf-8" data-page-node-id="BM52AjXGZfbESCJLNmANGj">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="t5RT18et1ZnBcHtnSv2AXd">
<title>红星招聘 · HR 管理后台</title>
<style>
:root{
  --brand:#1668dc;--brand-d:#0b4fa6;--brand-l:#e8f1fd;
  --ink:#1a1a1a;--ink2:#5c5c5c;--ink3:#8a8a8a;--ink4:#b0b0b0;
  --line:#e6e8eb;--line2:#d3d7dd;--bg:#f4f5f7;--white:#fff;
  --ok:#12a150;--okl:#e8f6ee;--warn:#c8811a;--warnl:#fdf3e3;
  --danger:#d9392b;--dangerl:#fdeceb;--purple:#6f42c1;--purplel:#f1ecfa;
  --side:#17233d;--side2:#0f1930;
  --r:10px;--sd:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font-family:inherit;font-size:14px;outline:none}
table{border-collapse:collapse;width:100%}

/* ---------- 登录 ---------- */
.login{position:fixed;inset:0;display:flex;background:var(--side)}
.login-l{flex:1;background:linear-gradient(135deg,#0f1930 0%,#1c3a6e 100%);color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:center}
.login-l h1{font-size:30px;letter-spacing:1px;margin-bottom:14px}
.login-l p{color:#a9bcd8;font-size:15px;max-width:420px;line-height:1.9}
.login-l .mk{width:52px;height:52px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin-bottom:24px}
.login-l .tags{margin-top:32px;display:flex;gap:10px;flex-wrap:wrap}
.login-l .tags span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;font-size:12.5px;color:#cfe0f5}
.login-r{width:440px;background:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
.login-r h2{font-size:21px;margin-bottom:6px}
.login-r .sub{color:var(--ink3);font-size:13px;margin-bottom:26px}
.acct{border:1px solid var(--line);border-radius:8px;padding:11px 13px;display:flex;align-items:center;gap:11px;cursor:pointer;margin-bottom:9px;transition:.15s}
.acct:hover{border-color:#b9cdf0;background:#fafcff}
.acct.on{border-color:var(--brand);background:var(--brand-l);box-shadow:0 0 0 2px rgba(22,104,220,.12)}
.acct .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}
.acct .av.g{background:#7a8699}.acct .av.p{background:var(--purple)}
.acct b{font-weight:600;font-size:14px}
.acct small{display:block;color:var(--ink3);font-size:12px}
.acct .rl{margin-left:auto;font-size:11.5px;padding:2px 8px;border-radius:4px;background:#f0f2f5;color:var(--ink2)}

/* ---------- 布局 ---------- */
.shell{display:flex;min-height:100vh}
.side{width:216px;background:var(--side);color:#c3d0e2;flex:none;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:20}
.side .lg{height:58px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.side .lg .mk{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.side .lg b{color:#fff;font-size:15px;letter-spacing:.5px}
.side .nav{padding:12px 10px;flex:1;overflow:auto}
.side .nav .gp{font-size:11px;color:#6b7c96;padding:12px 10px 6px;letter-spacing:1px}
.side .nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;cursor:pointer;color:#c3d0e2;font-size:14px;margin-bottom:2px}
.side .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side .nav a.on{background:var(--brand);color:#fff;font-weight:500}
.side .nav a .cnt{margin-left:auto;background:rgba(255,255,255,.14);border-radius:10px;padding:0 7px;font-size:11.5px}
.side .nav a.on .cnt{background:rgba(255,255,255,.25)}
.side .ft{padding:14px 18px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#6b7c96}
.wrap{flex:1;margin-left:216px;display:flex;flex-direction:column;min-width:0}
.top{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:14px;position:sticky;top:0;z-index:15}
.top h2{font-size:16px;font-weight:600}
.top .crumb{color:var(--ink3);font-size:13px}
.top .sp{flex:1}
.top .who{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2)}
.top .who .av{width:30px;height:30px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:600}
.main{padding:20px 22px 40px;flex:1}

/* ---------- 组件 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sd);margin-bottom:16px}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card .hd h3{font-size:14.5px;font-weight:600}
.card .hd .sp{flex:1}
.card .bd{padding:16px 18px}
.card .bd.np{padding:0}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sd)}
.stat .lb{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stat .vl{font-size:27px;font-weight:700;line-height:1.3;margin-top:4px;letter-spacing:-.5px}
.stat .ex{font-size:12px;color:var(--ink3);margin-top:2px}
.stat.b .vl{color:var(--brand)}.stat.g .vl{color:var(--ok)}.stat.o .vl{color:var(--warn)}.stat.p .vl{color:var(--purple)}

.btn{height:34px;padding:0 15px;border-radius:7px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{background:#0d8a44;color:#fff}
.btn.dg{background:var(--danger);border-color:var(--danger);color:#fff}.btn.dg:hover{background:#bf2f23;color:#fff}
.btn.gh{border-color:transparent;background:transparent;color:var(--ink2)}.btn.gh:hover{background:#f2f4f7;color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.dgg{color:var(--danger);border-color:#f3cfcb}.btn.dgg:hover{background:var(--dangerl);border-color:var(--danger);color:var(--danger)}

.ip{height:34px;border:1px solid var(--line2);border-radius:7px;padding:0 11px;width:100%;color:var(--ink);background:#fff}
.ip:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,104,220,.12)}
select.ip{cursor:pointer}
textarea.ip{height:auto;padding:9px 11px;line-height:1.7;resize:vertical}
.ip.err{border-color:var(--danger);background:#fffafa}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
.fld label i{color:var(--danger);font-style:normal;margin-left:2px}
.fld .hint{font-size:12px;color:var(--ink3);margin-top:5px}
.fld .err2{font-size:12px;color:var(--danger);margin-top:5px;display:none}
.fld.bad .err2{display:block}

/* ---------- 富文本正文编辑器（B-55） ---------- */
.rte{border:1px solid var(--line2);border-radius:8px;background:#fff;overflow:hidden}
.rte:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(22,104,220,.08)}
.rte-tb{display:flex;gap:2px;align-items:center;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--line);background:#fafbfc}
.rte-tb .sp2{width:1px;height:15px;background:var(--line2);margin:0 5px}
.rte-b{min-width:27px;height:25px;padding:0 7px;border:none;background:transparent;border-radius:5px;cursor:pointer;
  font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center}
.rte-b:hover{background:#eceff4;color:var(--ink)}
.rte-b:active{background:var(--brand-l);color:var(--brand-d)}
.rte-bd{min-height:230px;max-height:44vh;overflow:auto;padding:12px 14px;font-size:13.5px;line-height:1.95;
  color:var(--ink);outline:none;word-break:break-word}
.rte-bd:empty:before{content:attr(data-ph);color:var(--ink4)}
.rte-bd p{margin:0 0 8px}
.rte-bd ul,.rte-bd ol{margin:0 0 8px;padding-left:22px}
.rte-bd li{margin:2px 0}
.rte-bd b,.rte-bd strong{font-weight:700}
.varbar{margin-top:9px}
.varbar .lb{font-size:12px;color:var(--ink3);margin-bottom:6px}
.varbar .vs{display:flex;gap:6px;flex-wrap:wrap}
.vchip{font-size:12px;padding:3px 9px;border-radius:14px;border:1px solid var(--line2);background:#fff;
  color:var(--ink2);cursor:pointer;line-height:1.7;user-select:none}
.vchip:hover{border-color:var(--brand);color:var(--brand-d);background:var(--brand-l)}
.vchip i{font-style:normal;color:var(--danger);margin-left:1px}
/* 富文本正文在「纸张」预览与 PDF 中的排版 */
.docbody{font-size:13.5px;line-height:1.95}
.docbody p{margin:0 0 9px}
.docbody ul,.docbody ol{margin:0 0 9px;padding-left:22px}
.docbody li{margin:2px 0}
.docbody h3{font-size:15px;margin:14px 0 8px;font-weight:700}
.docbody blockquote{margin:0 0 9px;padding-left:10px;border-left:3px solid var(--line2);color:var(--ink2)}
.docbody u{text-decoration:underline}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.toolbar .ip{width:auto;min-width:120px}
.toolbar .sr{flex:1;min-width:190px;max-width:300px}

.tbwrap{overflow:auto}
table.data{width:100%;font-size:13.5px}
table.data th{background:#fafbfc;color:var(--ink2);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
table.data td{padding:12px 14px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
table.data tr:hover td{background:#fafbfd}
table.data tr.sel td{background:#f3f8ff}
table.data .tt{font-weight:600;color:var(--ink)}
table.data .mt{font-size:12px;color:var(--ink3);margin-top:3px}
table.data .mt span{margin-right:10px}
table.data td.op{white-space:nowrap;text-align:right}
table.data td.op .btn{margin-left:5px}
.empty{padding:56px 20px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px;font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;line-height:1.7;white-space:nowrap}
.pill.g{background:var(--okl);color:#0b7a3c}
.pill.b{background:var(--brand-l);color:var(--brand-d)}
.pill.o{background:var(--warnl);color:#9a6010}
.pill.r{background:var(--dangerl);color:#b32c20}
.pill.p{background:var(--purplel);color:#5a32a3}
.pill.n{background:#f0f2f5;color:var(--ink2)}
.pill.t{background:#e3f4ef;color:#0f766e}
.pill.a{background:#fdf0dc;color:#8a5300}
.pill .dt{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block}

/* 详情内的投递切换（同一候选人多次投递，B-54） */
.ptabs{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 14px}
.ptab{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer;line-height:1.6;max-width:100%}
.ptab:hover{border-color:var(--brand);color:var(--brand-d)}
.ptab.on{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d);font-weight:600;cursor:default}
.ptab .pill{padding:1px 7px;font-size:11.5px;line-height:1.6}
.ptab .tt2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.ptab .n2{font-size:11.5px;color:var(--ink3);font-weight:400}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 18px}
.tabs a{padding:11px 15px;cursor:pointer;font-size:13.5px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--brand)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tabs a .n{font-size:12px;color:var(--ink3);margin-left:4px}
.tabs a.on .n{color:var(--brand)}

.brow{display:flex;align-items:center;gap:12px;margin-bottom:11px;font-size:13px}
.brow .bl{width:82px;color:var(--ink2);flex:none;text-align:right}
.brow .btr{flex:1;height:9px;background:#f0f2f5;border-radius:5px;overflow:hidden}
.brow .btr i{display:block;height:100%;border-radius:5px;background:var(--brand)}
.brow .bv{width:34px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.trend{display:flex;align-items:flex-end;gap:6px;height:132px;padding:8px 0 0}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.trend .col i{width:100%;max-width:26px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;display:block}
.trend .col span{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.trend .col b{font-size:11px;color:var(--ink2);font-weight:600}

.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.kv .it .k{font-size:12px;color:var(--ink3);margin-bottom:2px}
.kv .it .v{font-size:13.5px;color:var(--ink);word-break:break-all}
.kv .it.full{grid-column:1/-1}

/* ---------- 遮罩 / 抽屉 / 弹窗 ---------- */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:60;display:none}
.ov.on{display:block}
.dw{position:fixed;top:0;right:0;bottom:0;width:600px;max-width:96vw;background:#fff;z-index:61;display:none;flex-direction:column;box-shadow:-8px 0 28px rgba(16,24,40,.14)}
.dw.on{display:flex}
.dw .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dw .dh h3{font-size:16px;font-weight:600}
.dw .dh .sp{flex:1}
.dw .db{flex:1;overflow:auto;padding:18px 20px}
.dw .df{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfc}
.md{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;max-width:94vw;max-height:88vh;background:#fff;border-radius:12px;z-index:61;display:none;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(16,24,40,.24)}
.md.on{display:flex}
.md.wide{width:880px}
.md .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.md .mh .sp{flex:1}
.md .mb{padding:18px 20px;overflow:auto;flex:1}
.md .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfc}
.x{cursor:pointer;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:18px;line-height:1}
.x:hover{background:#f2f4f7;color:var(--ink)}

.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:99;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:80vw}
.toast.on{display:block}
.toast.ok{background:var(--ok)}.toast.err{background:var(--danger)}.toast.warn{background:var(--warn)}

/* ---------- 预览（C端视角） ---------- */
.pv{max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.pv .ph{padding:16px 18px;border-bottom:1px solid var(--line)}
.pv .ph h4{font-size:18px;font-weight:700}
.pv .ph .sl{color:var(--salary,#e8590c);color:#e8590c;font-size:16px;font-weight:700;margin-top:4px}
.pv .ph .tg{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.pv .ph .tg span{background:#f4f5f7;color:var(--ink2);font-size:12px;padding:3px 9px;border-radius:5px}
.pv .pb{padding:16px 18px}
.pv .pb h5{font-size:14px;font-weight:600;margin:14px 0 8px}
.pv .pb ul{padding-left:18px;color:var(--ink2);font-size:13.5px}
.pv .pb ul li{margin-bottom:5px}
.pv .pf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;background:#fafbfc}
.pv .pf .b1{flex:1;height:40px;border-radius:8px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--ink2)}
.pv .pf .b2{flex:2;height:40px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.pv .pf.off .b2{background:#c8ccd2}
.wm{background:var(--warnl);color:#9a6010;font-size:12.5px;padding:8px 18px;text-align:center;border-bottom:1px solid #f2e0c0}

.note{border-left:3px solid var(--line2);padding:8px 12px;background:#fafbfc;border-radius:0 6px 6px 0;margin-bottom:10px}
.note .nh{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2)}
.note .nh b{font-weight:600}
.note .nh span{color:var(--ink3);font-size:12px}
.note .nb{font-size:13.5px;margin-top:4px;white-space:pre-wrap}
.tl{border-left:2px solid var(--line);padding-left:16px;margin-left:5px}
.tl .ti{position:relative;padding-bottom:16px}
.tl .ti:before{content:"";position:absolute;left:-21px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px #fff}
.tl .ti.g:before{background:var(--ink4)}
.tl .ti .th{font-size:13.5px}
.tl .ti .th b{font-weight:600}
.tl .ti .td{font-size:12px;color:var(--ink3);margin-top:2px}
.tl .ti .tn{font-size:12.5px;color:var(--ink2);background:#f7f8fa;border-radius:6px;padding:6px 10px;margin-top:6px}

.banner{background:var(--warnl);border:1px solid #f0dcb8;color:#8a5a10;padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.banner .sp{flex:1}
.eye{cursor:pointer;color:var(--brand);font-size:12px;margin-left:6px}
.dmono{font-variant-numeric:tabular-nums}
.sec-t{font-size:13px;font-weight:600;color:var(--ink2);margin:18px 0 10px;padding-left:9px;border-left:3px solid var(--brand)}
.db>.sec-t:first-child,.mb>.sec-t:first-child{margin-top:0}
.sec>.sec-t.tg{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;margin:13px 0 0;
  padding-top:8px;padding-bottom:8px;padding-right:2px;border-radius:0 8px 8px 0;transition:background .14s}
.sec>.sec-t.tg:hover{color:var(--brand);background:#fafbfc}
.sec>.sec-t.tg .rt{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.sec>.sec-t.tg .chev{font-size:20px;color:var(--ink2);transition:transform .16s;flex:0 0 auto;line-height:1}
.sec>.sec-t.tg:hover .chev{color:var(--brand)}

  if(ps.indexOf(k)>=0)return true;

}

      s.history.push({t:dayAgo(40)+" 17:10",act:"登记离职",by:"HR",note:dayAgo(40)+" 离职（主动离职 · 职业发展）· 可再联系（已转入人才库）"});
    }else{
      s.onboard={state:"未入职",planDate:dayAgo(4),realDate:"",cs:"候选人拒绝",reason:"接受了其他 offer",note:"",to:"",by:"HR",at:dayAgo(3)+" 11:05"};
      s.history.push({t:dayAgo(3)+" 11:05",act:"未入职",by:"HR",note:"候选人拒绝 · 接受了其他 offer"});
    }
  });
  /* 回流样本：已离职者再次投递另一岗位，用于验证「曾入职」提示（B-52） */
  var lv=out.filter(function(s){return !!onbLeft(s)})[0];
  if(lv&&!out.filter(function(s){return s.phone===lv.phone&&s.id!==lv.id}).length){
    var j2=pool.filter(function(j){return j.id!==lv.jobId})[0];
    if(j2){
      var r2=JSON.parse(JSON.stringify(lv));
      r2.id="s"+(3000+out.length);
      r2.jobId=j2.id;r2.status="待筛选";r2.time=dayAgo(1)+" 10:20";
      r2.history=[{t:r2.time,act:"投递成功",by:"候选人",from:"",to:"",note:"H5 投递"}];
      r2.notes=[];r2.notify=[];delete r2.onboard;
      r2.attach=r2.name+"-简历-"+j2.title.replace(/（.*?）/g,"")+".pdf";
      r2.msg="此前曾在贵司任职，因个人发展离开，现希望重新加入。";
      out.push(r2);
      out.sort(function(a,b){return a.time<b.time?1:-1});
    }
  }
  return out;
}

/* ---------- 持久化 ---------- */
function save(){
  try{
    localStorage.setItem("rs_hr_admin_v1",JSON.stringify({
      jobs:S.jobs,subs:S.subs,cands:S.cands,logs:S.logs,accounts:S.accounts,roles:S.roles,settings:S.settings,user:S.user,offers:S.offers,offerTpls:S.offerTpls
    }));
  }catch(e){}
}
function load(){
  try{
    var raw=localStorage.getItem("rs_hr_admin_v1");
    if(!raw)return false;
    var d=JSON.parse(raw);
    S.jobs=d.jobs||[];S.subs=d.subs||[];S.cands=d.cands||[];S.logs=d.logs||[];S.accounts=d.accounts||[];
    S.settings=d.settings||JSON.parse(JSON.stringify(DEFAULT_SETTINGS));S.user=d.user||null;
    S.roles=d.roles||seedRoles();
    S.offers=d.offers||[];S.offerTpls=d.offerTpls||[];
    if(!S.cands.length&&S.subs.length)S.cands=buildCands();
    if(S.settings.blockIntercept==null)S.settings.blockIntercept="1";
    if(!roleById("admin"))S.roles.unshift(seedRoles()[0]);
    S.roles.forEach(function(r){
      r.perms=migratePerms(r.perms);
      if(!r.perms.length&&r.id==="admin")r.perms=PERM_KEYS.slice();
    });
    return true;
  }catch(e){return false}
}
function seedAll(){
  S.jobs=initJobs();
  S.subs=genSubs(S.jobs);
  S.cands=buildCands();
  seedCandFlags();
  seedExams();
  seedNotes();
  S.offerTpls=seedTpls();
  S.offers=[];
  S.accounts=JSON.parse(JSON.stringify(ACCOUNTS));
  S.roles=seedRoles();
  S.settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  S.logs=[{id:uid(),t:now(),who:"系统",whoId:"system",act:"数据初始化",obj:"岗位 17 个 / 候选人 "+S.subs.length+" 份",before:"",after:""}];
  recalc();
}
function recalc(){
  var m={};S.subs.forEach(function(s){m[s.jobId]=(m[s.jobId]||0)+1});
  S.jobs.forEach(function(j){j.apply_count=m[j.id]||0});
}

/* ---------- 权限 ---------- */
/* 管理员级：内置 admin，或自定义角色同时拿到四个系统菜单的全部按钮（含恢复投递等敏感操作） */
function isAdmin(){
  if(!S.user)return false;
  var r=roleOf(S.user.role);
  if(r.id==="admin")return true;
  return ["accounts","roles","logs","settings"].every(function(m){
    return !!MENU_BY_ID[m]&&permCount(r.perms,m)===MENU_BY_ID[m].actions.length;
  });
}
/* 只读：不具备任何写权限（自定义的纯查看角色同样按只读处理） */
function isViewer(){
  if(!S.user)return false;
  return !WRITE_PERMS.some(function(k){return hasPerm(k)});
}
function canWrite(){return !isViewer()}
function myJobs(){
  if(!S.user)return [];
  var list=S.jobs.filter(function(j){return j.status!=="deleted"});
  if(roleScope()==="all")return list;
  return list.filter(function(j){return j.owner===S.user.id});
}
function mySubs(){
  if(!S.user)return [];
  var sc=roleScope();
  if(sc==="read"||sc==="all")return S.subs;      // 只读全部 / 全部数据：可见所有候选人
  var ids={};myJobs().forEach(function(j){ids[j.id]=1});
  return S.subs.filter(function(s){return ids[s.jobId]});
}
function canEditJob(j){return canWrite()&&(roleScope()==="all"||j.owner===S.user.id)}

/* ---------- 候选人主档 / 人才库 / 黑名单（B-31 ~ B-35） ---------- */
function dayAdd(n){var d=new Date();d.setDate(d.getDate()+n);return fmtD(d)}
function candOf(phone){for(var i=0;i<S.cands.length;i++)if(S.cands[i].phone===phone)return S.cands[i];return null}
function newCand(s){return {id:"c"+uid(),phone:s.phone,name:s.name,pooled:0,poolBy:"",poolAt:"",poolReason:"",
  blocked:0,blockReason:"",blockEvidence:"",blockBy:"",blockAt:"",blockUntil:"",invites:[]}}
function ensureCand(s){var c=candOf(s.phone);if(c)return c;c=newCand(s);S.cands.push(c);return c}
function subsOfPhone(p){return S.subs.filter(function(s){return s.phone===p})}
function candsInScope(){
  var ph={};mySubs().forEach(function(s){ph[s.phone]=1});
  return S.cands.filter(function(c){return ph[c.phone]});
}
function poolCount(){return candsInScope().filter(function(c){return c.pooled}).length}
function blockCount(){return candsInScope().filter(function(c){return c.blocked}).length}
function buildCands(){
  var m={},out=[];
  S.subs.forEach(function(s){
    if(m[s.phone])return;
    m[s.phone]=1;out.push(newCand(s));
  });
  return out;
}
function seedCandFlags(){
  var bys=["王敏","刘思远","陈静","赵鹏"];
  S.cands.forEach(function(c,i){
    if(i%4===1){c.pooled=1;c.poolBy=bys[i%bys.length];c.poolAt=dayAgo(6);c.poolReason="本轮 HC 已满，履历可复用"}
  });
  var b1=S.cands[2],b2=S.cands[7];
  if(b1){b1.blocked=1;b1.blockReason="学历造假";b1.blockEvidence="学信网核验截图-已归档.pdf";b1.blockBy="王敏";b1.blockAt=dayAgo(9);b1.blockUntil=dayAdd(730);b1.pooled=0}
  if(b2){b2.blocked=1;b2.blockReason="背调风险";b2.blockEvidence="前雇主背调反馈-2026.pdf";b2.blockBy="陈静";b2.blockAt=dayAgo(4);b2.blockUntil=dayAdd(365);b2.pooled=0}
  var n=0;
  S.subs.forEach(function(s){
    if(n>=2||s.status!=="不合适")return;
    var c=candOf(s.phone);if(!c||c.blocked)return;
    var j=byId(s.jobId)||{title:"—"};
    s.status="转入人才库";
    s.history.push({t:dayAgo(2)+" 15:20",act:"状态流转",by:"王敏",from:"不合适",to:"转入人才库"});
    c.pooled=1;c.poolBy="王敏";c.poolAt=dayAgo(2);c.poolReason="本轮不匹配，履历优质可复用";
    n++;
  });
  /* 离职回流：已登记离职且「可再联系」的候选人同步进人才库（B-52） */
  S.subs.forEach(function(s){
    var L=onbLeft(s);
    if(!L||L.to!=="人才库")return;
    var c=candOf(s.phone);
    if(c&&!c.blocked){c.pooled=1;c.poolBy=L.by||"HR";c.poolAt=L.date;c.poolReason="离职回流 · "+L.reason}
  });
}
/* 移出人才库：把「转入人才库」留下的终态投递一并了结，避免人被移出、投递永远卡在终态（B-54） */
function poolStuck(c){
  return subsOfCand(c).filter(function(s){return s.status==="转入人才库"&&!!revertTo(s)});
}
function togglePool(id,fromList){
  if(!hasPerm("pool.manage")){toast("当前角色无人才库维护权限","err");return}
  var s=bySub(id);if(!s)return;
  var c=ensureCand(s);
  if(c.blocked){toast("该候选人已在黑名单，不可移入人才库（两者互斥）","err");return}
  if(c.pooled){
    if(poolStuck(c).length)openPoolRemove(id,fromList);
    else doPoolRemove(id,fromList,0);
  }else{
    c.pooled=1;c.poolBy=S.user.name;c.poolAt=now();c.poolReason=c.poolReason||"HR 手动移入";
    addLog("移入人才库",s.name,"一般候选人","人才库");
    save();closeAll();render();toast("已移入人才库，可在「人才库」菜单查看","ok");
    if(!fromList)setTimeout(function(){S.curSub=id;openSub(id)},10);
  }
}
function openPoolRemove(id,fromList){
  var s=bySub(id);if(!s)return;
  var c=ensureCand(s),bl=poolStuck(c);
  var rows='<div style="font-size:13px;color:var(--ink2);line-height:1.9">'+bl.map(function(x){
    var j=byId(x.jobId)||{};
    return '· 「'+esc(j.title||"—")+'」 → 可恢复到 <b>'+esc(revertTo(x))+'</b>';
  }).join("<br>")+'</div>';
  var body='<div class="notice" style="margin-bottom:12px">该候选人名下有 <b>'+bl.length+'</b> 份投递因为「转入人才库」停在终态。移出人才库后，它们不会自动消失，仍会留在「候选人管理」的「全部」页签里。</div>'+
    rows+
    (isAdmin()
      ? '<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);margin-top:12px">'+
          '<input type="checkbox" id="pr_rev" checked style="margin-top:3px"><span>同时把这些投递恢复到原环节（各追加一条「恢复投递」流转记录与操作日志）</span></label>'
      : '<div class="hint" style="margin-top:12px">恢复投递仅管理员可操作；移出后如需继续推进，请联系管理员恢复。</div>');
  openModal("移出人才库 · "+esc(s.name),body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn pri" onclick="doPoolRemove(\''+id+'\','+(fromList?1:0)+',1)">确认移出</button>');
}
function doPoolRemove(id,fromList,askRev){
  var s=bySub(id);if(!s)return;
  var c=ensureCand(s);
  var also=askRev&&isAdmin()&&$("pr_rev")&&$("pr_rev").checked;
  var n=0;
  if(also)poolStuck(c).forEach(function(x){if(applyRevert(x,"随「移出人才库」恢复到原环节"))n++});
  c.pooled=0;
  addLog("移出人才库",s.name,"人才库","一般候选人"+(n?"（同时恢复 "+n+" 份投递）":""));
  save();closeAll();render();
  toast(n?"已移出人才库，并恢复 "+n+" 份投递":"已移出人才库","ok");
  if(!fromList){S.curSub=id;openSub(id)}
}
function openBlock(id){

  var body='<div class="fld"><label>拉黑原因 <i>*</i></label><select class="ip" id="bk_r">'+

    '<div class="fld"><label>备注 <i>*</i></label><textarea class="ip" id="bk_n" rows="3" placeholder="如：学历证书核验未通过，附学信网截图"></textarea>'+

    '<div class="notice">拉黑生效后：该候选人提交任何岗位投递时由服务端<b>静默拦截</b>（B-34）并返回通用失败文案，不告知黑名单存在；同时自动移出人才库。</div>';
  openModal("加入黑名单 · "+esc(s.name),body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn dgg" onclick="saveBlock(\''+id+'\')">确认拉黑</button>');
}
function saveBlock(id){
  var s=bySub(id);if(!s)return;
  var e=(($("bk_e")||{}).value||"").trim();
  if(!e){toast("请填写证据附件名称","err");return}
  var r=(($("bk_r")||{}).value)||BLOCK_REASONS[0];
  var u=(($("bk_u")||{}).value)||"730";
  var nt=(($("bk_n")||{}).value||"").trim();
  if(!nt){toast("备注必填，请说明拉黑依据","err");return}
  var c=ensureCand(s),wasPool=c.pooled?1:0;
  c.blocked=1;c.blockReason=r;c.blockEvidence=e;c.blockBy=S.user.name;c.blockAt=now();
  c.blockUntil=(u==="0"?"长期":dayAdd(parseInt(u)));
  c.pooled=0;
  s.history.push({t:now(),act:"加入黑名单",by:S.user.name,note:nt+"（原因："+r+"）"});
  addLog("加入黑名单",s.name+" · "+r+"（"+nt.slice(0,30)+"）",(wasPool?"人才库":"一般候选人"),"黑名单 · 有效期至 "+c.blockUntil);
  save();closeAll();render();toast("已加入黑名单，投递将被静默拦截","ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}
function unblock(id,fromList){
  var s=bySub(id);if(!s)return;

}
function doUnblock(id,fromList){

  var pending=subs.filter(function(s){return s.status==="待筛选"});
  var interview=subs.filter(function(s){return s.status==="面试中"});
  var offer=subs.filter(function(s){return s.status==="已发 offer"});
  var expiredN=jobs.filter(function(j){return jobEffStatus(j)==="expired"}).length;

  var stHtml=Object.keys(JOB_STATUS).filter(function(k){return k!=="deleted"}).map(function(k){
    var n=jobs.filter(function(j){return j.status===k}).length;

  var trend='<div class="trend">'+days.map(function(d){

    return '<div class="col"><b>'+(v||"")+'</b><i style="height:'+Math.round(v/mx*86)+'%"></i><span>'+d.slice(5)+'</span></div>';

  var cmx=Math.max(1,catArr.length?catM[catArr[0]]:1);
  var catHtml=catArr.map(function(c){return barRow(c+"类",catM[c],cmx,"var(--brand)")}).join("");

  var recent=subs.slice().sort(function(a,b){return a.time<b.time?1:-1}).slice(0,6).map(function(s){

  var logs=S.logs.slice(0,6).map(function(l){

  var banner=expiredN?'<div class="banner"><span>⚠</span><div class="sp">有 <b>'+expiredN+'</b> 个岗位已过截止日期自动置为「已过期」，请及时处理或延长截止日期。</div><button class="btn sm" onclick="go(\'jobs\')">去处理</button></div>':'';

  return banner+
  '<div class="grid g4" style="margin-bottom:16px">'+
    stat("在招岗位",online.length,"共 "+jobs.length+" 个岗位（含草稿/下线）","b")+

    stat("累计收到简历",subs.length,"待筛选 "+pending.length+" 份","o")+
    stat("面试中 / 已发 offer",interview.length+" / "+offer.length,
      "待入职 "+offer.filter(function(s){var t=onbState(s);return t==="待回复"||t==="待入职"}).length+
      " · 在职 "+offer.filter(function(s){return onbState(s)==="已入职"&&!onbLeft(s)}).length+
      " · 已离职 "+offer.filter(function(s){return !!onbLeft(s)}).length+
      " · 未入职 "+offer.filter(function(s){return onbState(s)==="未入职"}).length,"p")+
  '</div>'+
  '<div class="grid g2" style="margin-bottom:16px">'+
    stat("笔试中",mySubs().filter(function(s){return s.status==="笔试中"}).length,"线下笔试已安排，等待录入成绩（B-40 / B-41）","o")+
    stat("Offer 文件",offerList().length,"已按模板生成的 PDF，可预览 / 下载 / 删除","p")+

  '</div>'+
  '<div class="grid g2">'+
    '<div class="card"><div class="hd"><h3>岗位状态分布</h3></div><div class="bd">'+stHtml+'</div></div>'+

      (recent||'<tr><td colspan="4"><div class="empty">暂无投递</div></td></tr>')+'</tbody></table></div></div></div>'+
    '<div class="card"><div class="hd"><h3>简历类别分布</h3></div><div class="bd">'+(catHtml||'<div class="empty">暂无数据</div>')+'</div></div>'+
  '</div>'+
  '<div class="card"><div class="hd"><h3>最近操作</h3><div class="sp"></div>'+(hasPerm("sys.log")?'<a style="font-size:13px;color:var(--brand);cursor:pointer" onclick="go(\'logs\')">全部日志</a>':'')+'</div>'+
    '<div class="bd"><div class="tl">'+(logs||'<div class="empty">暂无操作记录</div>')+'</div></div></div>';
}
function stat(lb,vl,ex,c){
  return '<div class="stat '+(c||"")+'"><div class="lb">'+lb+'</div><div class="vl">'+vl+'</div><div class="ex">'+ex+'</div></div>';
}
function barRow(lb,v,mx,color){
  return '<div class="brow"><span class="bl">'+esc(lb)+'</span><div class="btr"><i style="width:'+Math.round(v/mx*100)+'%;background:'+color+'"></i></div><span class="bv">'+v+'</span></div>';
}
function statusPill(st){
  return '<span class="pill '+(SUB_COLOR[st]||"n")+'"><i class="dt"></i>'+esc(st)+'</span>';
}
/* ---------- 入职跟进 ---------- */
function onb(s){                 /* 首次写入时才建对象，避免读渲染改数据 */
  if(!s.onboard)s.onboard={state:"待回复",planDate:"",realDate:"",cs:"",reason:"",note:"",to:"",by:"",at:""};
  return s.onboard;
}
function onbState(s){return (s.onboard&&s.onboard.state)||"待回复"}
function onbLeft(s){return (s.onboard&&s.onboard.left)||null}          /* 离职标记：仅挂在「已入职」之下 */
function onbOpen(s){var st=onbState(s);return st==="待回复"||st==="待入职"}   /* 跟进未终结，可参与批量（B-51） */
function batchableRow(s,bt){return s.status===bt&&(bt!=="已发 offer"||onbOpen(s))}  /* 已发 offer 的终结跟进（已入职 / 未入职）不进批量 */
function hiredBefore(s){          /* 同一候选人（按手机号、限本人可见范围）此前的入职记录，用于回流提示 */
  var m=mySubIds();
  return subsOfPhone(s.phone).filter(function(x){return x.id!==s.id&&m[x.id]&&onbLeft(x)})
    .sort(function(a,b){return (onbLeft(a).date||"")<(onbLeft(b).date||"")?1:-1});
}
function onbPill(s){
  var L=onbLeft(s);
  if(L)return '<span class="pill n" title="曾入职，'+esc(L.date)+' 离职 · '+esc(L.type)+'"><i class="dt"></i>已离职</span>';
  var st=onbState(s);
  return '<span class="pill '+(ONB_COLOR[st]||"n")+'"><i class="dt"></i>'+st+'</span>';
}
function onbToTxt(v){return {"人才库":"已转入人才库","不合适":"已转不合适","黑名单":"已加入黑名单"}[v]||""}
function onbBtns(id,s){
  if(!canWrite())return "";
  var st=onbState(s);
  if(st==="待回复")
    return '<button class="btn ok" onclick="openAccept(\''+id+'\')">登记 offer 接受</button>'+
      '<button class="btn dgg" onclick="openNoShow(\''+id+'\')">登记未入职</button>';
  if(st==="待入职")
    return '<button class="btn ok" onclick="openOnboard(\''+id+'\')">登记入职</button>'+
      '<button class="btn dgg" onclick="openNoShow(\''+id+'\')">登记未入职</button>';
  if(st==="已入职"){                      /* 入职之后：可登记离职（B-52），离职后仅可修改 */
    var L=onbLeft(s);
    return (L?'<button class="btn" onclick="openLeave(\''+id+'\',1)">修改离职信息</button>'
             :'<button class="btn" onclick="openLeave(\''+id+'\')">登记离职</button>')+
      (isAdmin()?'<button class="btn" onclick="resetOnb(\''+id+'\')">更正跟进结果</button>':"");
  }
  return isAdmin()?'<button class="btn" onclick="resetOnb(\''+id+'\')">更正跟进结果</button>':"";
}
function jobEffStatus(j){return (j.status==="online"&&j.deadline<today())?"expired":j.status}
function jobStatusPill(st){
  var m=JOB_STATUS[st]||{t:st,c:"n"};
  return '<span class="pill '+m.c+'"><i class="dt"></i>'+m.t+'</span>';
}
function trackPill(t){
  return t==="campus"?'<span class="pill p">校招</span>':'<span class="pill b">社招</span>';
}

/* ==========================================================
   岗位管理（B-01 ~ B-16）
   ========================================================== */
function jobScope(){
  var list=myJobs();
  if(S.jTab!=="all")list=list.filter(function(j){return j.track===S.jTab});
  return list;
}
function jobFiltered(){
  var list=jobScope(),q=S.jQ.trim().toLowerCase(),f=S.jF;
  if(q)list=list.filter(function(j){return (j.title+" "+j.cat).toLowerCase().indexOf(q)>=0});
  if(f.status)list=list.filter(function(j){return j.status===f.status});
  if(f.city)list=list.filter(function(j){return j.city===f.city});
  if(f.cat)list=list.filter(function(j){return j.cat===f.cat});
  if(f.owner)list=list.filter(function(j){return j.owner===f.owner});
  return list.sort(function(a,b){
    if((b.sort_weight||0)!==(a.sort_weight||0))return (b.sort_weight||0)-(a.sort_weight||0);
    return a.publish_date<b.publish_date?1:-1;
  });
}
function pgJobs(){
  var scope=jobScope();
  var onl=scope.filter(function(j){return j.status==="online"&&j.deadline>=today()});
  var off=scope.filter(function(j){return j.status==="offline"});
  var hc=0;onl.forEach(function(j){hc+=j.hc});
  var app=0;scope.forEach(function(j){app+=j.apply_count});
  var list=jobFiltered();
  /* 分页（N-01）：与候选人管理同一套分页条，默认每页 10 条 */
  var jps=jobPageSize(),jtotal=list.length,jpages=Math.max(1,Math.ceil(jtotal/jps));
  if(S.jPage>jpages)S.jPage=jpages;
  if(S.jPage<1)S.jPage=1;
  var pageList=list.slice((S.jPage-1)*jps,S.jPage*jps);

  var owners=S.accounts.filter(function(a){return a.role!=="viewer"});
  var rows=pageList.map(function(j){
    var sel=S.jSel.indexOf(j.id)>=0;
    var editable=canEditJob(j);
    var ops="";
    if(hasPerm("jobs.edit"))ops+='<button class="btn sm" onclick="editJob('+j.id+')">编辑</button>';
    if(hasPerm("jobs.preview"))ops+='<button class="btn sm" onclick="previewJob('+j.id+')">预览</button>';
    if(editable&&hasPerm("jobs.publish")){
      if(j.status==="online")ops+='<button class="btn sm" onclick="setStatus('+j.id+',\'offline\')">下线</button>';
      else ops+='<button class="btn sm" onclick="setStatus('+j.id+',\'online\')">上架</button>';
    }
    if(editable&&hasPerm("jobs.edit")){
      ops+='<button class="btn sm gh" onclick="dupJob('+j.id+')">复制</button>';
      ops+='<button class="btn sm gh" onclick="toggleTop('+j.id+')">'+((j.sort_weight||0)>0?"取消置顶":"置顶")+'</button>';
    }
    if(editable&&hasPerm("jobs.delete"))ops+='<button class="btn sm dgg" onclick="delJob('+j.id+')">删除</button>';
    return '<tr class="'+(sel?"sel":"")+'">'+
      (hasPerm("jobs.batch")?'<td style="width:36px"><input type="checkbox" '+(sel?"checked":"")+' onchange="toggleSel('+j.id+',this.checked)"></td>':'')+
      '<td><div class="tt">'+esc(j.title)+(j.demo?' <span class="pill n">演示</span>':'')+'</div>'+
        '<div class="mt"><span>类别：'+esc(j.cat)+'</span><span>更新：'+esc(j.updated_at)+'</span><span>收到简历：<b style="color:var(--brand)">'+j.apply_count+'</b> 份</span></div></td>'+
      '<td>'+esc(j.city)+'</td>'+
      '<td class="dmono" style="color:#e8590c">'+esc(j.salary)+'</td>'+
      '<td class="dmono">'+j.hc+'</td>'+
      '<td class="dmono" style="color:'+(j.deadline<today()?"var(--danger)":"var(--ink2)")+'">'+esc(j.deadline)+'</td>'+
      '<td>'+trackPill(j.track)+'</td>'+
      '<td>'+jobStatusPill(jobEffStatus(j))+'</td>'+
      '<td style="font-size:13px">'+esc(ownerName(j.owner))+'</td>'+
      '<td class="op">'+ops+'</td></tr>';
  }).join("");

  var batch=hasPerm("jobs.batch")&&S.jSel.length?'<div style="padding:10px 18px;background:#f3f8ff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px">'+
    '已选 <b>'+S.jSel.length+'</b> 个岗位'+

function addLine(k){S.editJob[k].push("");drawJobForm()}
function rmLine(k,i){S.editJob[k].splice(i,1);if(!S.editJob[k].length)S.editJob[k].push("");drawJobForm()}
function saveJob(publish){
  var j=S.editJob,e={};
  if(!(j.title||"").trim())e.title=1;
  if(!(j.salary||"").trim())e.salary=1;
  j.duty=j.duty.map(function(x){return (x||"").trim()}).filter(Boolean);
  j.requirement=j.requirement.map(function(x){return (x||"").trim()}).filter(Boolean);
  if(!j.duty.length)e.duty=1;
  if(!j.requirement.length)e.requirement=1;
  if(Object.keys(e).length){S.formErr=e;drawJobForm();toast("请完善带 * 的必填项","err");return}
  if(!j.tags.length)j.tags=["五险一金"];
  if(!j.owner)j.owner=autoOwner(j);

  if(j.id){
    var cur=byId(j.id);
    var before="状态："+JOB_STATUS[cur.status].t+" · HC："+cur.hc+" · 截止："+cur.deadline;
    ["track","cat","title","city","addr","salary","exp","deg","hc","deadline","duty","requirement","tags","owner","sort_weight"].forEach(function(k){cur[k]=j[k]});
    cur.updated_at=now();cur.updated_by=S.user.name;
    if(publish&&cur.status!=="online"){cur.status="online";addLog("岗位上架",cur.title,JOB_STATUS[cur.status].t,"在招")}
    addLog("编辑岗位",cur.title,before,"状态："+JOB_STATUS[cur.status].t+" · HC："+cur.hc+" · 截止："+cur.deadline);
    toast("已保存，前台同步更新","ok");
  }else{
    var nid=Math.max.apply(null,S.jobs.map(function(x){return x.id}))+1;
    j.id=nid;j.publish_date=today();j.status=publish?"online":"draft";
    j.view_count=0;j.apply_count=0;j.created_by=S.user.name;j.updated_by=S.user.name;j.updated_at=now();
    S.jobs.unshift(j);
    addLog("新建岗位",j.title,"",(publish?"在招":"草稿")+" · HC："+j.hc+" · 负责人："+ownerName(j.owner));
    toast(publish?"岗位已发布上线":"岗位已保存为草稿","ok");
  }
  recalc();save();closeAll();render();
  if(publish&&!(j.addr||"").trim()){setTimeout(function(){toast("提示：该岗位未填写工作地点，C 端仅显示工作城市，建议补填","warn")},700)}
}
function setStatus(id,to){
  if(!hasPerm("jobs.publish")){toast("当前角色无上下架权限","err");return}
  var j=byId(id);
  if(!canEditJob(j)){toast("仅岗位负责人或管理员可操作","err");return}
  if(to==="online"&&j.deadline<today()){toast("截止日期已过，请先延长截止日期","err");return}
  var before=JOB_STATUS[j.status].t;
  j.status=to;j.updated_at=now();j.updated_by=S.user.name;
  addLog(to==="online"?"岗位上架":"岗位下线",j.title,before,JOB_STATUS[to].t);
  save();render();
  toast(to==="online"?"已上架，前台可见可投递":"已下线，前台不可见不可投递，简历保留","ok");
}
function toggleTop(id){

  var j=byId(id);

function doDelJob(id){
  var j=byId(id);j.status="deleted";j.updated_at=now();j.updated_by=S.user.name;
  addLog("删除岗位（软删除）",j.title,"在招/下线","已删除 · 保留 "+j.apply_count+" 份投递");
  save();render();toast("已删除","ok");
}
function batchSet(to){
  if(!hasPerm("jobs.publish")){toast("当前角色无上下架权限","err");return}
  var n=0;
  S.jSel.forEach(function(id){
    var j=byId(id);
    if(!j||!canEditJob(j))return;
    if(to==="online"&&j.deadline<today())return;
    var b=JOB_STATUS[j.status].t;j.status=to;j.updated_at=now();j.updated_by=S.user.name;n++;
    addLog(to==="online"?"批量上架":"批量下线",j.title,b,JOB_STATUS[to].t);
  });
  save();clearSel();render();toast("已处理 "+n+" 个岗位","ok");
}
function batchDel(){
  if(!hasPerm("jobs.delete")){toast("当前角色无删除岗位权限","err");return}
  var ids=S.jSel.slice();
  confirmBox("批量删除","确定删除选中的 <b>"+ids.length+"</b> 个岗位吗？删除为软删除，已收到的简历将完整保留。","确认删除","doBatchDel()",1);
}
function doBatchDel(){
  var n=0;
  S.jSel.forEach(function(id){
    var j=byId(id);if(!j||!canEditJob(j))return;
    j.status="deleted";j.updated_at=now();j.updated_by=S.user.name;n++;
    addLog("批量删除岗位",j.title,"","已删除");
  });
  save();clearSel();render();toast("已删除 "+n+" 个岗位","ok");
}

/* ==========================================================
   候选人管理（B-22 ~ B-30）
   ========================================================== */
function subsFiltered(){
  var list=mySubs();
  if(S.sTab!=="全部")list=list.filter(function(s){return s.status===S.sTab});
  var q=S.sQ.trim().toLowerCase();
  if(q)list=list.filter(function(s){
    return (s.name+" "+s.school+" "+s.major+" "+s.deg+" "+s.skill+" "+s.city+" "+s.phone).toLowerCase().indexOf(q)>=0;
  });
  if(S.sF.job)list=list.filter(function(s){return s.jobId===parseInt(S.sF.job)});
  if(S.sF.deg)list=list.filter(function(s){return s.deg===S.sF.deg});
  if(S.sF.cross)list=list.filter(function(s){
    var jj=byId(s.jobId);
    var isCross=!!(jj&&s.city&&jj.city&&s.city!==jj.city);
    return S.sF.cross==="cross"?isCross:!isCross;   /* 同城 = 非跨城，两类互补不丢数据 */
  });
  if(S.sF.onb)list=list.filter(function(s){
    if(s.status!=="已发 offer")return false;
    if(S.sF.onb==="已离职")return !!onbLeft(s);          /* 已离职是「已入职」下的标记，作为独立筛选维度 */
    return onbState(s)===S.sF.onb&&!onbLeft(s);          /* 选「已入职」时只保留在职者，避免与已离职混算 */
  });
  var sc=S.sF.scope;
  if(sc)list=list.filter(function(s){
    var c=candOf(s.phone);if(!c)return false;
    if(sc==="pool")return !!c.pooled;
    if(sc==="block")return !!c.blocked;
    if(sc==="normal")return !c.pooled&&!c.blocked;
    return true;
  });
  return list.sort(function(a,b){return a.time<b.time?1:-1});
}
function subCount(st){
  var l=mySubs();
  return st==="全部"?l.length:l.filter(function(s){return s.status===st}).length;
}
function pgSubs(){
  if(SUB_STATUS.indexOf(S.sTab)<0)S.sTab="全部";   /* 兼容旧数据停在已下线页签的情况 */
  var list=subsFiltered();
  var canBatch=hasPerm("subs.batch")&&!!batchTabStatus();   /* 勾选与批量：「待筛选 / 初筛通过 / 笔试中 / 面试中 / 已发 offer」（B-49 / B-51） */
  // 选择集实时收敛到「当前筛选结果 ∩ 当前批量页签状态」：避免选中看不见或已不可流转的行
  if(!canBatch)S.sSel=[];
  else{
    var bt=batchTabStatus(),ok={};list.forEach(function(s){if(batchableRow(s,bt))ok[s.id]=1});
    S.sSel=S.sSel.filter(function(id){return ok[id]});
  }
  var selList=canBatch?list.filter(function(s){return batchableRow(s,batchTabStatus())}):[];
  // 分页（N-01）：每页条数可配置，默认 10
  var ps=subPageSize(),total=list.length,pages=Math.max(1,Math.ceil(total/ps));
  if(S.sPage>pages)S.sPage=pages;
  if(S.sPage<1)S.sPage=1;
  var pageList=list.slice((S.sPage-1)*ps,S.sPage*ps);
  var allSel=selList.length>0&&selList.every(function(s){return S.sSel.indexOf(s.id)>=0});
  var jobOpts=myJobs().map(function(j){return '<option value="'+j.id+'"'+(S.sF.job==j.id?" selected":"")+'>'+esc(j.title)+'</option>'}).join("");
  var rows=pageList.map(function(s){
    var sel=S.sSel.indexOf(s.id)>=0;
    var j=byId(s.jobId);

    var hb0=hiredBefore(s)[0],L0=hb0?onbLeft(hb0):null;
    var hbTag=hb0?' <span class="pill n" title="曾入职「'+esc((byId(hb0.jobId)||{}).title||"—")+'」，'+esc(L0.date)+' 离职（'+esc(L0.type)+'）">曾入职</span>':"";
    var othN=c0?subsOfCand(c0).filter(function(x){return x.id!==s.id&&!isTerminal(x.status)}).length:0;
    var cross=(j&&s.city&&j.city&&s.city!==j.city);
    return '<tr class="'+(sel?"sel":"")+'">'+
      (canBatch?'<td style="width:36px">'+(S.sTab==="已发 offer"&&!onbOpen(s)?'':'<input type="checkbox" '+(sel?"checked":"")+' onchange="toggleSubSel(\''+s.id+'\',this.checked)">')+'</td>':'')+
      '<td><div class="tt">'+esc(s.name)+bd+hbTag+'</div><div class="mt"><span>'+esc(s.deg)+' · '+esc(s.school)+'</span>'+
        (othN?'<span style="color:var(--brand)">另有 '+othN+' 个在流程中的投递</span>':'')+'</div></td>'+
      '<td class="dmono">'+(rv?esc(s.phone):esc(maskPhone(s.phone)))+
        (hasPerm("subs.contact")?'<span class="eye" onclick="toggleReveal(\''+s.id+'\')">'+(rv?"隐藏":"查看")+'</span>':'')+'</td>'+
      '<td style="font-size:13px">'+esc(j?j.title:"—")+'<div class="mt"><span>'+(j?(j.track==="campus"?"校招":"社招"):"")+' · '+esc(j?j.city:"")+'</span></div></td>'+
      '<td style="font-size:13px">'+esc(s.years)+'<div class="mt"><span>'+esc(s.major)+'</span></div></td>'+
      '<td style="font-size:13px">'+esc(s.city)+
        (cross?' <span class="pill o" title="现居 '+esc(s.city)+' · 岗位工作城市 '+esc(j.city)+'">跨城</span>':'')+'</td>'+
      '<td class="dmono" style="color:var(--ink3);font-size:12.5px">'+esc(s.time)+'</td>'+
      '<td>'+statusPill(s.status)+
        (s.status==="已发 offer"?'<div style="margin-top:4px">'+onbPill(s)+'</div>':'')+'</td>'+
      '<td class="op"><button class="btn sm" onclick="openSub(\''+s.id+'\',\'sub\')">查看</button></td>'+
    '</tr>';
  }).join("");

  return '<div class="card">'+
    '<div class="tabs">'+SUB_STATUS.map(function(st){
      var noN=(st==="全部"||st==="已发 offer"||st==="不合适");   /* 这三个页签不显示统计总数 */
      return '<a class="'+(S.sTab===st?"on":"")+'" onclick="setSTab(\''+st+'\')">'+st+(noN?"":'<span class="n">'+subCount(st)+'</span>')+'</a>';
    }).join("")+'</div>'+
    '<div class="toolbar">'+
      '<input class="ip sr" placeholder="搜索姓名 / 院校 / 专业 / 学历 / 技能（B-29）" value="'+esc(S.sQ)+'" oninput="onSubSearch(this.value)">'+
      '<select class="ip" onchange="S.sPage=1;S.sF.job=this.value?parseInt(this.value):\'\';renderSubs()"><option value="">全部岗位</option>'+jobOpts+'</select>'+
      '<select class="ip" onchange="S.sPage=1;S.sF.deg=this.value;renderSubs()"><option value="">全部学历</option>'+DEGS.map(function(d){return '<option'+(S.sF.deg===d?" selected":"")+'>'+d+'</option>'}).join("")+'</select>'+
      '<select class="ip" onchange="S.sPage=1;S.sF.cross=this.value;renderSubs()"><option value="">全部城市关系</option>'+
        '<option value="cross"'+(S.sF.cross==="cross"?" selected":"")+'>跨城（现居 ≠ 岗位城市）</option>'+
        '<option value="same"'+(S.sF.cross==="same"?" selected":"")+'>同城</option></select>'+
      (S.sTab==="已发 offer"?'<select class="ip" onchange="S.sPage=1;S.sF.onb=this.value;renderSubs()"><option value="">全部跟进状态</option>'+
        ONB_STATES.concat(["已离职"]).map(function(x){return '<option value="'+x+'"'+(S.sF.onb===x?" selected":"")+'>'+x+'</option>'}).join("")+'</select>':'')+
      '<button class="btn" onclick="S.sQ=\'\';S.sF={job:\'\',deg:\'\',scope:\'\',cross:\'\',onb:\'\'};S.sSel=[];S.sPage=1;render()">重置</button>'+
      (hasPerm("subs.export")?'<button class="btn pri" onclick="openExport()">导出</button>':'')+
      '<div class="sp" style="flex:1"></div>'+
      '<span style="font-size:13px;color:var(--ink3)">手机号默认脱敏（N-02）</span>'+
    '</div>'+
    /* 批量栏常驻「待筛选 / 初筛通过」页签：未勾选时按钮仍在，仅置灰（B-49） */
    (canBatch&&selList.length?'<div style="padding:10px 18px;background:#f3f8ff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap">'+
      '已选 <b>'+S.sSel.length+'</b> 份简历'+
      batchBtns(S.sSel.length)+
      '<div class="sp" style="flex:1"></div>'+
      '<span style="font-size:12px;color:var(--ink3)">'+
        (S.sSel.length
          ? (S.sTab==="已发 offer"?'勾选跨页保持；已入职 / 未入职 不参与批量（B-51）':'勾选跨页保持，筛选变化时自动剔除失效项（B-49）')
          : ('先勾选候选人后按钮可用'+(S.sTab==="已发 offer"?"（B-51）":"（B-49）")))+
      '</span></div>':'')+
    '<div class="bd np"><div class="tbwrap"><table class="data"><thead><tr>'+
      (canBatch?'<th style="width:36px"><input type="checkbox" '+(allSel?"checked":"")+' onchange="selAllFiltered(this.checked)"></th>':'')+
      '<th>候选人</th><th>手机号</th><th>投递岗位</th><th>年限 / 专业</th><th>现居城市</th><th>投递时间</th><th>状态</th><th style="text-align:right">操作</th>'+
    '</tr></thead><tbody>'+(rows||'<tr><td colspan="'+(canBatch?9:8)+'"><div class="empty"><b>没有符合条件的候选人</b>试试调整筛选或搜索条件</div></td></tr>')+
    '</tbody></table></div>'+
    (total>0?'<div style="padding:11px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:13px;flex-wrap:wrap">'+
      '第 '+((S.sPage-1)*ps+1)+' – '+Math.min(S.sPage*ps,total)+' 份 / 共 '+total+' 份'+

      '</div>':'')+
    '</div></div>';

var EXP_COLS=[["姓名","name"],["手机号","phone"],["邮箱","email"],["学历","deg"],["毕业院校","school"],["专业","major"],
  ["工作年限","years"],["现居城市","city"],["投递岗位","job"],["状态","status"],["投递时间","time"],
  ["技能","skill"],["候选人留言","msg"],["简历附件","attach"],["最新评价结论","note"]];
function expVal(s,k){
  if(k==="job"){var j=byId(s.jobId);return j?j.title:"—"}
  if(k==="note"){var n=(s.notes||[]).slice(-1)[0];if(!n)return "—";
    return n.stage+(n.score?(" "+n.score+" 分"):"")+(n.verdict?(" · "+n.verdict):"")}
  var v=s[k];
  return (v===undefined||v===null||v==="")?"—":String(v);
}
function filterSummary(){
  var a=[];
  if(S.sTab!=="全部")a.push("状态="+S.sTab);
  if(S.sQ.trim())a.push("关键词="+S.sQ.trim());
  if(S.sF.job){var j=byId(S.sF.job);a.push("岗位="+(j?j.title:"—"))}
  if(S.sF.deg)a.push("学历="+S.sF.deg);
  if(S.sF.cross)a.push(S.sF.cross==="cross"?"城市关系=跨城":"城市关系=同城");
  if(S.sF.scope)a.push("标记="+S.sF.scope);
  return a.length?a.join(" · "):"全部投递（未设筛选）";
}
function exportFileNames(list){
  var seen={},out=[];
  list.forEach(function(s){
    var base=s.name+"-"+(s.major||"未填专业")+"-"+((s.time||"").slice(0,10).replace(/-/g,"")||"无日期");
    seen[base]=(seen[base]||0)+1;
    out.push(base+(seen[base]>1?"("+seen[base]+")":"")+".pdf");
  });
  return out;
}

function statGo(lb,vl,ex,c,pg){
  return '<div class="stat '+(c||"")+'" style="cursor:pointer" onclick="go(\''+pg+'\')"><div class="lb">'+lb+'</div><div class="vl">'+vl+'</div><div class="ex">'+ex+'</div></div>';
}
function isTerminal(st){return st==="已发 offer"||st==="不合适"||st==="转入人才库"}
function mySubIds(){var m={};mySubs().forEach(function(s){m[s.id]=1});return m}
function subsOfCand(c){
  var m=mySubIds();
  return subsOfPhone(c.phone).filter(function(s){return m[s.id]}).sort(function(a,b){return a.time<b.time?1:-1});
}
function lastSub(c){return subsOfCand(c)[0]||null}
function candSearch(c,q){
  if(!q)return true;
  var ss=subsOfCand(c);
  var hay=(c.name+" "+c.phone+" "+(c.poolReason||"")+" "+(c.blockReason||"")+" "+(c.blockBy||"")+" "+(c.blockEvidence||"")+" "+
    ss.map(function(s){return s.school+" "+s.major+" "+s.deg+" "+s.skill+" "+s.city}).join(" ")).toLowerCase();
  return hay.indexOf(q)>=0;
}
function daysLeft(u){
  if(!u||u==="长期")return null;
  var a=new Date(u+"T00:00:00"),b=new Date(today()+"T00:00:00");
  return Math.round((a-b)/86400000);
}

/* ---------- 批量初筛（B-49）：勾选 / 分页 / 批量流转 ---------- */
var sSrchTimer=null;
function onSubSearch(v){
  S.sQ=v;                                   /* 先落值，输入不失焦（N-01 防抖仅推迟重绘） */
  if(sSrchTimer)clearTimeout(sSrchTimer);
  sSrchTimer=setTimeout(function(){S.sPage=1;renderSubs()},300);
}
function setSPage(p){S.sPage=p;renderSubs()}
/* 每页条数：仅接受白名单值，非法值回落默认（N-01） */
function pageSizeOf(v){
  var n=parseInt(v,10);
  return SUB_PAGE_OPTS.indexOf(n)>=0?n:SUB_PAGE;
}
/* 通用分页条：人才库 / 黑名单与候选人管理保持同一套交互 */
function pageBar(cur,ps,total,unit,sizeFn,pageFn){
  if(total<=0)return "";
  var pages=Math.max(1,Math.ceil(total/ps));
  return '<div style="padding:11px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:13px;flex-wrap:wrap">'+
    '第 '+((cur-1)*ps+1)+' – '+Math.min(cur*ps,total)+' '+unit+' / 共 '+total+' '+unit+
    '<select class="ip sm" style="width:auto;padding:4px 7px" onchange="'+sizeFn+'(this.value)">'+
      SUB_PAGE_OPTS.map(function(v){return '<option value="'+v+'"'+(ps===v?" selected":"")+'>每页 '+v+' 条</option>'}).join("")+
    '</select>'+
    '<button class="btn sm"'+(cur>1?'':' disabled')+' onclick="'+pageFn+'('+(cur-1)+')">上一页</button>'+
    '<span style="color:var(--ink3)">'+cur+' / '+pages+'</span>'+
    '<button class="btn sm"'+(cur<pages?'':' disabled')+' onclick="'+pageFn+'('+(cur+1)+')">下一页</button>'+
    '</div>';
}
function setPPoolSize(v){S.pPS=pageSizeOf(v);S.pPage=1;renderPool()}

function subPageSize(){

}

function toggleSubSel(id,on){
  var i=S.sSel.indexOf(id);
  if(on&&i<0)S.sSel.push(id);
  if(!on&&i>=0)S.sSel.splice(i,1);
  renderSubs();
}
function batchTabStatus(){   /* 支持批量操作的页签 → 对应的源状态；非批量页签返回空串 */
  return (S.sTab==="待筛选"||S.sTab==="初筛通过"||S.sTab==="笔试中"||S.sTab==="面试中"||S.sTab==="已发 offer")?S.sTab:"";
}
function batchBtns(n){       /* 批量栏按钮组：按当前页签给出该环节可用动作 */
  if(S.sTab==="已发 offer")return onbBatchBtns(n);   /* 已发 offer：批量跟进（B-51） */
  var d=n?"":" disabled";
  var b={
    "初筛通过":'<button class="btn sm pri"'+d+' onclick="batchAdvance(\'初筛通过\')">批量初筛通过</button>',
    "不合适":'<button class="btn sm dgg"'+d+' onclick="batchAdvance(\'不合适\')">批量不合适</button>',
    "面试中":'<button class="btn sm pri"'+d+' onclick="batchAdvance(\'面试中\')">批量安排面试</button>',
    "转入人才库":'<button class="btn sm pri"'+d+' onclick="batchAdvance(\'转入人才库\')">批量转入人才库</button>'
  };
  if(S.sTab==="待筛选")return b["初筛通过"]+b["不合适"];
  if(S.sTab==="初筛通过")
    return '<button class="btn sm pri"'+d+' onclick="batchExam()">批量安排笔试</button>'+
      b["面试中"]+b["不合适"]+b["转入人才库"];
  if(S.sTab==="笔试中")      /* 笔试后：录结果 / 重排 / 安排面试 / 不合适（不合适含拉黑分支） */
    return '<button class="btn sm pri"'+d+' onclick="batchGrade()">批量录入笔试记录</button>'+
      '<button class="btn sm pri"'+d+' onclick="batchReExam()">批量重新安排</button>'+
      b["面试中"]+b["不合适"];
  if(S.sTab==="面试中")      /* 面试后：发 offer 前的两个出口 —— 不合适（含拉黑分支）/ 转入人才库 */
    return b["不合适"]+b["转入人才库"];
  return "";
}
/* 已发 offer 的批量跟进：动作与单条页脚一一对应（接受 / 入职 / 未入职），不做批量发 offer 与批量更正 */
function onbBatchElig(){
  var r={reply:0,pend:0};
  S.sSel.forEach(function(id){
    var s=bySub(id);if(!s)return;
    var st=onbState(s);
    if(st==="待回复")r.reply++;
    else if(st==="待入职")r.pend++;
  });
  return r;
}
function onbBatchBtns(n){
  var d=n?"":" disabled",e=onbBatchElig(),open=e.reply+e.pend;
  var tag=function(k){return n&&k<n?"（"+k+"）":""};
  var out="";
  if(!n||e.reply)out+='<button class="btn sm pri"'+d+' onclick="openBatchAccept()">批量登记 offer 接受'+tag(e.reply)+'</button>';
  if(!n||e.pend)out+='<button class="btn sm pri"'+d+' onclick="openBatchOnboard()">批量登记入职'+tag(e.pend)+'</button>';
  out+='<button class="btn sm dgg"'+d+' onclick="openBatchNoShow()">批量登记未入职'+tag(open)+'</button>';
  return out;
}
function selAllFiltered(on){
  var bt=batchTabStatus();
  var list=bt?subsFiltered().filter(function(s){return batchableRow(s,bt)}):[];
  if(on===false){S.sSel=[];renderSubs();return}
  var m={};list.forEach(function(s){m[s.id]=1});
  S.sSel=Object.keys(m);                    /* 全选 = 当前筛选结果（跨页），不是仅当页 */

}
var BTIP={
  "初筛通过":'流转到「初筛通过」后进入笔试 / 面试环节。',
  "转入人才库":'流转到「转入人才库」后本次投递进入终态，候选人本人（按手机号识别）进入人才库供后续岗位复用。'
};
function batchAdvance(to){
  if(!hasPerm("subs.batch")){toast("当前角色无批量操作权限","err");return}
  if(!S.sSel.length){toast("请先勾选候选人","err");return}
  if(S.sSel.length>SUB_BATCH_MAX){toast("单次最多处理 "+SUB_BATCH_MAX+" 份，请分批操作","err");return}
  /* 「不合适」有两条分支（转不合适 / 转黑名单）且备注必填，走独立弹窗 */
  if(to==="不合适"){openReject("",1);return}
  confirmBox(to==="面试中"?"批量安排面试":"批量"+to,"确定将选中的 <b>"+S.sSel.length+"</b> 份简历流转到「"+to+"」吗？"+(BTIP[to]?'<br>'+BTIP[to]:""),
    "确认流转","doBatchAdvance('"+to+"')",0);
}
/* 不合适处理：两个分支（转到不合适 / 转到黑名单）+ 备注必填；备注写入流转记录（与批量共用一套） */
function rejectToggle(){

    '<button class="btn dgg" onclick="doReject(\''+id+'\','+(batch?1:0)+')">确认处理'+(batch?"（"+n+" 份）":"")+'</button>');
}
function doReject(id,batch){
  var m=val("rj_m"),note=(val("rj_n")||"").trim();
  if(!note){toast("备注必填，请说明不合适的具体依据","err");return}
  var reason="",ev="";
  if(m==="黑名单"){
    if(!hasPerm("block.add")){toast("当前角色无拉黑权限，请联系管理员","err");return}
    reason=val("rj_r")||BLOCK_REASONS[0];
    ev=(val("rj_e")||"").trim();
    if(!ev){toast("拉黑必须留存证据附件","err");return}
  }
  closeAll();
  function markTrue(s,c,from){          /* 写入状态 + 备注流转记录 + 拉黑（黑名单分支） */
    s.status="不合适";
    s.history.push({t:now(),act:batch?"批量流转":"状态流转",by:S.user.name,from:from,to:"不合适",
      note:note+(m==="黑名单"?"（同时加入黑名单："+reason+"）":"")});
    if(m==="黑名单"){
      c.blocked=1;c.blockReason=reason;c.blockEvidence=ev;c.blockBy=S.user.name;c.blockAt=now();
      c.blockUntil=dayAdd(730);c.pooled=0;
    }
    var jt=((byId(s.jobId)||{}).title)||"";
    addLog(m==="黑名单"?"不合适并拉黑":"不合适",s.name+" · "+jt,from,"不合适"+(m==="黑名单"?" · 黑名单":""));
    return true;
  }
  if(batch){
    var r=batchRun(function(s,c){
      if(SUB_FLOW[s.status].indexOf("不合适")<0)return "当前状态不可处理（"+s.status+"）";
      return markTrue(s,c,s.status);
    });
    if(!r)return;
    batchResult('已处理为「<b>不合适</b>」：<b>'+r.okN+'</b> 份'+
      (m==="黑名单"?'，并已加入黑名单':'')+'。备注：'+esc(note),
      '备注已逐条写入流转记录（动作：批量流转）。',r);
    return;
  }
  var s=bySub(id);if(!s)return;
  if(SUB_FLOW[s.status].indexOf("不合适")<0){toast("当前状态不可处理","err");return}
  var c=ensureCand(s);
  if(m==="黑名单"&&c.blocked){toast("该候选人已在黑名单中","err");return}
  markTrue(s,c,s.status);
  save();render();
  toast("已处理为「不合适」"+(m==="黑名单"?"，并加入黑名单":""),"ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}
/* 批量执行骨架：统一前置校验 + 遍历选择集；act(s,c) 返回 true=成功，返回字符串=跳过原因 */
function batchRun(act){
  if(!canWrite()){toast("只读角色不可操作","err");return null}
  if(!S.sSel.length){toast("请先勾选候选人","err");return null}
  if(S.sSel.length>SUB_BATCH_MAX){toast("单次最多处理 "+SUB_BATCH_MAX+" 份，请分批操作","err");return null}
  var bt=batchTabStatus(),okN=0,skip={},skipped=[];
  function add(r,who){skip[r]=(skip[r]||0)+1;if(who)skipped.push(who+"："+r)}
  S.sSel.slice().forEach(function(id){
    var s=bySub(id);
    if(!s){add("记录不存在");return}
    if(bt&&s.status!==bt){add("状态已变更（当前 "+s.status+"）",s.name);return}
    var c=ensureCand(s);
    if(c.blocked){add("黑名单候选人",s.name);return}
    var r=act(s,c);
    if(r===true){okN++;return}
    add(r||"不允许的流转",s.name);
  });
  save();S.sSel=[];S.sPage=1;render();
  return {okN:okN,skip:skip,skipped:skipped};
}
function batchResult(head,logNote,r){
  if(!r)return;
  var ks=Object.keys(r.skip);
  openModal("批量处理完成",
    '<div class="notice" style="margin-bottom:12px">'+head+
      (ks.length?'，跳过 <b>'+ks.reduce(function(a,k){return a+r.skip[k]},0)+'</b> 份':'')+'。'+
      (logNote?'<br>'+logNote:'')+'</div>'+
    (ks.length?'<div class="sec-t">跳过明细（'+ks.length+' 类）</div>'+
      ks.map(function(k){return '<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)"><b>'+esc(k)+'</b> · '+r.skip[k]+' 份</div>'}).join("")+
      '<div style="font-size:12.5px;color:var(--ink3);margin-top:10px">'+r.skipped.slice(0,10).map(function(x){return esc(x)}).join("；")+
        (r.skipped.length>10?" 等 "+r.skipped.length+" 条":"")+'</div>':''),
    '<button class="btn pri" onclick="closeAll()">知道了</button>');
}

/* 渲染：把 {{变量}} 替换成实际值；未填写的留「（待填写：X）」占位，便于 HR 在预览中发现缺漏 */
function renderTpl(tpl,vars,src){
  var t=(src===undefined||src===null)?(tpl.body||""):src;
  var ks=tplVars(tpl).concat(OFFER_VARS);        /* 先按模板实际变量，再兜底全局清单 */
  ks.forEach(function(k){
    if(t.indexOf("{{"+k+"}}")<0)return;
    t=t.split("{{"+k+"}}").join((vars&&vars[k])?vars[k]:"（待填写："+k+"）");
  });
  return t;
}
function renderTplHtml(tpl,vars){       /* 富文本正文的变量替换：保留排版，变量值做 HTML 转义 */
  var h=tplBodyHtml(tpl);
  tplVars(tpl).concat(OFFER_VARS).forEach(function(k){
    if(h.indexOf("{{"+k+"}}")<0)return;
    h=h.split("{{"+k+"}}").join((vars&&vars[k])?esc(vars[k]):"（待填写："+k+"）");
  });
  return h;
}

/* ---------- 终态逆向：恢复投递（B-53） ---------- */
function revertTo(s){          /* 回到这条投递最后一次进入终态之前的环节；找不到则不提供恢复 */
  if(s.status!=="不合适"&&s.status!=="转入人才库")return "";
  var h=(s.history||[]).slice().reverse();
  for(var i=0;i<h.length;i++){
    var x=h[i];
    if(x.act==="状态流转"&&x.from&&(x.to==="不合适"||x.to==="转入人才库"))return x.from;
  }
  return "";
}
function revertCount(s){return (s.history||[]).filter(function(x){return x.act==="恢复投递"}).length}
function openRevert(id){
  var s=bySub(id);if(!s)return;
  if(!isAdmin()){toast("仅管理员可恢复投递","err");return}
  var to=revertTo(s);
  if(!to){toast("找不到可恢复的上一环节","err");return}
  var c=candOf(s.phone);
  if(c&&c.blocked){toast("该候选人仍在黑名单中，请先解除黑名单","err");return}
  var j=byId(s.jobId),st=j?jobEffStatus(j):"";
  var dead=!j||st!=="online";
  var n=revertCount(s);
  var body=
   '<div class="notice" style="margin-bottom:12px">将把该投递从「'+esc(s.status)+'」恢复到 <b>'+esc(to)+'</b>：恢复后重新出现在「'+esc(to)+'」页签，可继续正常流转，原有的笔试记录、面试评价与 Offer 文件都保留。</div>'+
   '<div class="fld"><label>恢复原因 <i>*</i></label><textarea class="ip" id="rv_n" rows="3" placeholder="如：面试评价录入有误，经复核后重新进入面试"></textarea>'+
     '<div class="hint">原「'+esc(s.status)+'」记录不会删除，本次恢复会追加到流转记录与操作日志，供复核。</div></div>'+
   (dead?'<div class="notice" style="margin-bottom:10px;border-color:var(--warn);background:var(--warnl)">所属岗位当前为「'+esc((JOB_STATUS[st]||{}).t||"—")+'」，恢复后仅作档案保留，无法继续推进到后续环节。</div>':'')+
   (n?'<div class="notice" style="margin-bottom:10px">该投递已恢复过 <b>'+n+'</b> 次，请确认是否重复往返。</div>':'')+
   '<div class="hint">候选人不会收到通知（系统不自动发拒信）；如已线下告知，请自行沟通。</div>';
  openModal("恢复投递 · "+esc(s.name),body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn pri" onclick="doRevert(\''+id+'\')">确认恢复到「'+esc(to)+'」</button>');
}
function applyRevert(s,note){            /* 恢复内核：单条恢复与「移出人才库」共用，口径一致 */
  var to=revertTo(s);
  if(!to)return "";
  var from=s.status;
  s.status=to;
  if(to==="已发 offer"&&s.onboard&&onbState(s)==="未入职")s.onboard=null;   /* 未入职 → 回到待回复，原记录留在流转历史 */
  s.history.push({t:now(),act:"恢复投递",by:S.user.name,from:from,to:to,note:note});
  addLog("恢复投递",s.name+" · "+(((byId(s.jobId)||{}).title)||""),from,to+"（"+note+"）");
  return to;
}
function doRevert(id){
  var s=bySub(id);if(!s)return;

  var note=(val("rv_n")||"").trim();

  save();closeAll();render();S.curSub=id;openSub(id);
  toast("已从「"+from+"」恢复到「"+to+"」","ok");
}

function applyLeave(s,d,edit){

    o.left.to="人才库";extra="，已转入人才库";

    c.blocked=1;c.blockReason="离职 · "+d.type+" · "+d.reason;c.blockEvidence=d.note||"（未附证据文件）";
    c.blockBy=S.user.name;c.blockAt=now();c.blockUntil=dayAdd(730);c.pooled=0;
    o.left.to="黑名单";extra="，已加入黑名单";

    note:d.date+" 离职（"+d.type+" · "+d.reason+"）· "+d.rehire+(d.note?"；"+d.note:"")+(extra?"（"+extra.replace("，","")+"）":"")});
  addLog(edit?"修改离职信息":"登记离职",s.name+" · "+(((byId(s.jobId)||{}).title)||""),"已入职","已离职 · "+d.date+extra);

function offerFilePick(){

  el.click();
}
function pickOfferFile(input){
  acceptOfferFile(input&&input.files&&input.files[0]);
  if(input){try{input.value=""}catch(e){}}
}
function dropOfferFile(e){
  if(e&&e.preventDefault)e.preventDefault();
  acceptOfferFile(e&&e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]);
}
function acceptOfferFile(f){
  var d=S.offerDraft;if(!d||!f)return;
  if(!/\.pdf$/i.test(f.name||"")){toast("仅支持 PDF 文件","err");return}
  if(f.size>20*1024*1024){toast("文件超过 20 MB，请压缩后再上传","err");return}
  d.file={name:f.name,size:fmtSize(f.size)};
  var sb=bySub(d.subId);if(sb)drawOfferForm(sb,byId(sb.jobId));
  toast("已选择："+f.name,"ok");
}
function clearOfferFile(){

  d.file=null;
  var sb=bySub(d.subId);if(sb)drawOfferForm(sb,byId(sb.jobId));
}
function fmtSize(n){
  n=Number(n)||0;
  if(n>=1024*1024)return (n/1048576).toFixed(1)+" MB";
  return Math.max(1,Math.round(n/1024))+" KB";
}
function setOfferSrc(subId,src){
  var s=bySub(subId),d=S.offerDraft;if(!s||!d)return;
  if(offerSrc(d)===src)return;
  if(offerSrc(d)==="系统生成")readOfferVars();        /* 切走前留存已填关键字 */
  d.src=src;

function uploadOffer(id){
  var s=bySub(id),d=S.offerDraft;if(!s||!d)return;
  if(!canWrite()){toast("只读角色不可上传 Offer","err");return}
  if(!d.file){toast("请先选择要上传的 Offer 文件","err");return}
  if(offersOf(id).length){toast("已存在 Offer 文件，如需重新上传请先删除原文件","err");return}
  var j=byId(s.jobId);
  var o={id:"of"+Date.now(),subId:id,candName:s.name,jobId:s.jobId,jobTitle:j?j.title:"—",
    src:"手动上传",tplId:"",tplName:"",tplVer:"",tplTrack:"",
    fileName:d.file.name,size:d.file.size,rendered:"",
    createdBy:S.user.name,createdAt:now()};
  S.offers.unshift(o);                          /* 只落一个 Offer 文件，不改候选人状态 */
  addLog("上传 Offer 文件",s.name+" · "+o.jobTitle,"手动上传",o.fileName);
  if(S.secClosed)S.secClosed.offer=false;   /* 生成 / 上传后确保 Offer 文件区展开可见 */

function readOfferVars(){

function genOffer(id){
  var s=bySub(id);if(!s)return;

  if(offerSrc(d)!=="系统生成"){toast("当前为手动上传，请使用上传流程","err");return}

  var miss=ks.filter(function(k){return !v[k]&&(REQ_VARS.indexOf(k)>=0||custom.indexOf(k)>=0)});
  if(miss.length){toast("请先填写必填项："+miss.join("、"),"err");return}
  var j=byId(s.jobId);

    vars:JSON.parse(JSON.stringify(v)),

    rendered:isH?renderTplHtml(tpl,v):renderTpl(tpl,v),
    createdBy:S.user.name,createdAt:now()};

    '<div class="rte-bd" id="tp_body_ed" contenteditable="true" spellcheck="false" '+
      'data-ph="在此撰写 Offer 正文，可从下方变量点击插入到光标处…" onpaste="rtePaste(event)">'+html+'</div></div>'+
    rteVarBar();

function rteKeep(){                      /* 保证编辑器内有光标：在内部就保留，不在就落到末尾 */
  var ed=$("tp_body_ed");if(!ed)return null;
  var sel=window.getSelection();
  if(!sel||!sel.rangeCount||!ed.contains(sel.anchorNode)){
    var r=document.createRange();r.selectNodeContents(ed);r.collapse(false);
    if(sel){sel.removeAllRanges();sel.addRange(r)}
    return sel;
  }
  return sel;
}
function rteCmd(cmd){
  var ed=$("tp_body_ed");if(!ed)return;
  ed.focus();rteKeep();
  try{document.execCommand(cmd,false,null)}catch(e){}
}
function rteInsertVar(k){
  var ed=$("tp_body_ed");if(!ed)return;
  var txt="{{"+k+"}}";
  ed.focus();
  var sel=rteKeep(),ok=false;
  try{ok=document.execCommand("insertText",false,txt)}catch(e){ok=false}
  if(!ok&&sel&&sel.rangeCount){            /* 兜底：直接改 DOM，光标停在插入内容之后 */
    var r=sel.getRangeAt(0);r.deleteContents();
    var tn=document.createTextNode(txt);r.insertNode(tn);
    r.setStartAfter(tn);r.collapse(true);sel.removeAllRanges();sel.addRange(r);
  }
}
function rtePaste(e){                     /* 只收纯文本，避免从 Word 带入整段样式污染 PDF 排版 */
  if(!e.clipboardData)return;
  e.preventDefault();
  var t=e.clipboardData.getData("text/plain")||"";
  try{document.execCommand("insertText",false,t)}catch(err){}
}

function noteAt(id,i){
  var s=bySub(id);if(!s||!s.notes)return null;
  return (i!==undefined&&i!==null&&i>=0&&i<s.notes.length)?s.notes[i]:null;
}
function saveNote(id,i){
  var s=bySub(id);if(!s)return;
  var old=noteAt(id,i);
  var f=(val("nt_fact")||"").trim();
  var sc0=parseInt(val("nt_score"),10);
  var d={stage:val("nt_stage"),score:(isNaN(sc0)||sc0===0)?0:sc0,
    verdict:val("nt_verdict"),fact:f};
  s.notes=s.notes||[];
  if(old){  /* 就地覆盖：不记操作日志、不改记录人与原时间（B-38 评价可编辑·不留痕） */
    for(var k in d)old[k]=d[k];
    if(!old.by)old.by=S.user.name;
    save();closeAll();render();S.curSub=id;openSub(id);toast("评价笔记已更新","ok");
    return;
  }
  var n={by:S.user.name,t:now(),stage:d.stage,score:d.score,verdict:d.verdict,fact:d.fact};
  s.notes.push(n);
  addLog("新增评价笔记",s.name+" · "+n.stage,n.stage+" 评分 "+n.score,n.verdict+(f?" · "+f.slice(0,30):""));
  save();closeAll();render();S.curSub=id;openSub(id);toast("评价笔记已保存","ok");
}

function advance(id,to){
  if(!hasPerm(FLOW_PERM[to]||"subs.screen")){toast("当前角色无权执行该流转","err");return}
  var s=bySub(id),j=byId(s.jobId),from=s.status;
  if(SUB_FLOW[from].indexOf(to)<0){toast("不允许的流转："+from+" → "+to,"err");return}
  if(to==="不合适"){openReject(id,0);return}   /* 备注必填 + 两个分支，统一走不合适处理弹窗 */
  if(to==="面试中"){                          /* 安排面试：二次确认后执行 */
    confirmBox("安排面试 · "+esc(s.name),
      '确定为 <b>'+esc(s.name)+'</b> 安排面试吗？<br>当前状态「'+esc(from)+'」→「面试中」。',
      "确认安排","doAdvance('"+id+"','面试中')",0);
    return;
  }
  doAdvance(id,to);
}
function doAdvance(id,to){
  if(!canWrite()){toast("只读角色不可流转","err");return}
  var s=bySub(id),j=byId(s.jobId),from=s.status;
  if(SUB_FLOW[from].indexOf(to)<0){toast("不允许的流转："+from+" → "+to,"err");return}
  if(to==="不合适"){openReject(id,0);return}
  var c=ensureCand(s);
  if(to==="转入人才库"){
    if(c.blocked){toast("黑名单候选人不可转入人才库（两者互斥）","err");return}
    c.pooled=1;c.poolBy=S.user.name;c.poolAt=now();c.poolReason=c.poolReason||"流转节点转存（"+from+"）";
  }
  s.status=to;
  s.history.push({t:now(),act:"状态流转",by:S.user.name,from:from,to:to});
  var nf=NOTIFY[to];
  if(nf)s.notify.push({t:now(),ch:nf.ch,to:s.email,
    cc:nf.ccOwner?ownerEmail(j?j.owner:null):"",content:nf.txt(s,j)});
  addLog("候选人状态流转",s.name+" · "+(j?j.title:""),from,to);
  save();closeAll();render();
  toast("已转为「"+to+"」"+(nf?"，邮件已通知候选人并抄送招聘负责人":""),"ok");
  setTimeout(function(){S.curSub=id;openSub(id)},10);
}

  '</div><div class="notice">账号 ID 由系统生成，不可修改。停用后该账号无法登录后台，其负责岗位仍保留。</div>';
  openModal(id?"编辑账号 · "+esc(a.name):"新建账号",body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn pri" onclick="saveAcct(\''+esc(a.id)+'\')">保存</button>');

function saveAcct(id){
  var get=function(k){var e=$(k);return e?e.value.trim():""};
  var name=get("a_name"),title=get("a_title"),email=get("a_email");
  if(!name||!title||!email){toast("姓名、职务、邮箱为必填项","err");return}
  var o={name:name,title:title,email:email,phone:get("a_phone"),role:get("a_role"),status:get("a_status")};
  if(id){
    var cur=S.accounts.filter(function(x){return x.id===id})[0];
    var before=cur.name+" / "+roleName(cur.role)+" / "+(cur.status==="active"?"启用":"停用");
    Object.keys(o).forEach(function(k){cur[k]=o[k]});
    addLog("编辑账号",name,before,name+" / "+roleName(cur.role)+" / "+(cur.status==="active"?"启用":"停用"));
    if(cur.id===S.user.id){S.user=JSON.parse(JSON.stringify(cur))}
  }else{
    var nid="u"+Math.random().toString(36).slice(2,7);
    S.accounts.push(Object.assign({id:nid},o));
    addLog("新建账号",name,"",roleName(o.role)+" / "+(o.status==="active"?"启用":"停用"));
  }
  save();closeAll();render();toast("账号已保存","ok");
}
function toggleAcct(id){
  if(!hasPerm("accounts.toggle")){toast("当前角色无账号启停权限","err");return}
  var a=S.accounts.filter(function(x){return x.id===id})[0];
  if(a.id===S.user.id){toast("不能停用自己的账号","err");return}
  var to=a.status==="active"?"disabled":"active";
  addLog(to==="active"?"启用账号":"停用账号",a.name,a.status==="active"?"启用":"停用",to==="active"?"启用":"停用");
  a.status=to;save();render();toast(to==="active"?"已启用":"已停用","ok");
}

function openRole(id){

    '<div class="fld"><label>角色标识<i>*</i></label><input class="ip" id="r_code" value="'+esc(r?r.id:"")+'"'+(isNew?' placeholder="小写字母，如 lead"':' readonly style="background:#fafbfc;color:var(--ink3)"')+'>'+
      '<div class="hint">'+(isNew?"创建后不可修改，用于账号与权限绑定":"角色标识创建后不可修改")+'</div></div>'+
  '</div>'+
  '<div class="fld"><label>数据范围</label><select class="ip" id="r_scope"'+((r&&r.builtin)?" disabled style=\"background:#fafbfc;color:var(--ink3)\"":"")+'>'+
    '<option value="all"'+(r&&r.scope==="all"?" selected":"")+'>全部数据（所有岗位与候选人）</option>'+
    '<option value="own"'+(!r||r.scope==="own"?" selected":"")+'>仅本人负责（owner_id 为自己的岗位与候选人）</option>'+
    '<option value="read"'+(r&&r.scope==="read"?" selected":"")+'>只读全部候选人（不可流转）</option>'+
  '</select>'+((r&&r.builtin)?'<div class="hint">内置角色的数据范围固定，需要其他范围请新建自定义角色</div>':'')+'</div>'+
  '<div class="fld"><label>角色说明</label><textarea class="ip" id="r_desc" rows="2" style="min-height:52px" placeholder="简要说明该角色的职责范围，便于后续维护">'+esc(r?r.desc:"")+'</textarea></div>'+
  (isNew?'<div class="fld"><label>权限来源</label><select class="ip" id="r_copy">'+
      '<option value="">空白（保存后在权限配置中勾选）</option>'+
      S.roles.map(function(x){return '<option value="'+x.id+'">复制「'+esc(x.name)+'」的权限</option>'}).join("")+
    '</select><div class="hint">保存后会自动打开权限配置，可继续调整</div></div>':
    '<div class="notice">角色的菜单与操作权限在「配置权限」中调整；仅修改名称与说明不会影响已有权限。</div>');
  openModal(isNew?"新建角色":"编辑角色 · "+esc(r.name),body,
    '<button class="btn" onclick="closeAll()">取消</button><button class="btn pri" onclick="saveRole(\''+(r?r.id:"")+'\')">保存</button>');

function saveRole(id){
  if(!hasPerm(id?"roles.edit":"roles.create")){toast("当前角色无角色维护权限","err");return}
  var name=(($("r_name")||{}).value||"").trim();
  var code=(($("r_code")||{}).value||"").trim().toLowerCase();
  var desc=(($("r_desc")||{}).value||"").trim();
  var scopeEl=$("r_scope"),scope=scopeEl?scopeEl.value:"own";
  if(!name){toast("请填写角色名称","err");return}
  if(id){
    var r=roleById(id);if(!r)return;
    var before=r.name+" / "+SCOPE_NAME[r.scope];
    r.name=name;r.desc=desc;
    if(!r.builtin)r.scope=scope;
    addLog("编辑角色",name,before,name+" / "+SCOPE_NAME[r.scope]);
    save();closeAll();render();toast("角色已保存","ok");
    return;
  }
  if(!/^[a-z][a-z0-9_]{2,15}$/.test(code)){toast("角色标识需以字母开头，3-16 位小写字母 / 数字 / 下划线","err");return}
  if(roleById(code)||ROLES[code]){toast("角色标识已存在，请更换","err");return}
  var src=(($("r_copy")||{}).value)||"";
  var base=src?roleById(src):null;
  S.roles.push({id:code,name:name,desc:desc,scope:scope,builtin:0,perms:base?base.perms.slice():[]});
  addLog("新建角色",name,"",SCOPE_NAME[scope]+" / 权限 "+(base?base.perms.length:0)+" 项");
  save();closeAll();render();toast("角色已创建，请继续配置权限","ok");
  setTimeout(function(){openPerm(code)},10);
}
function openPerm(id){
  if(!hasPerm("roles.perm")){toast("当前角色无权限配置权限","err");return}
  var r=roleById(id);if(!r)return;
  var locked=r.id==="admin";
  var body='<div class="notice" style="margin-bottom:14px">'+
    '角色 <b>'+esc(r.name)+'</b> · 数据范围 <b>'+SCOPE_NAME[r.scope]+'</b>'+
    (locked?' · 内置管理员固定拥有全部权限，不可调整':'')+
    (r.id===S.user.role?'<br><span style="color:var(--warn)">这是你当前登录使用的角色，保存后立即对本人生效。</span>':'')+
  '</div>';
  if(!locked)body+='<div class="fld"><label>数据范围</label><select class="ip" id="pm_scope"'+(r.builtin?' disabled style="background:#fafbfc;color:var(--ink3)"':'')+'>'+
    ["all","own","read"].map(function(s){return '<option value="'+s+'"'+(r.scope===s?" selected":"")+'>'+SCOPE_NAME[s]+'</option>'}).join("")+
    '</select>'+(r.builtin?'<div class="hint">内置角色的数据范围固定，如需其他范围请新建自定义角色</div>':'')+'</div>';
  PERM_GROUPS.forEach(function(g,gi){
    var c=g.items.filter(function(it){return locked||r.perms.indexOf(it[0])>=0}).length;
    body+='<div class="pmx"><div class="pmh"><b>'+g.g+'</b><span id="pmc'+gi+'">'+c+' / '+g.items.length+'</span><div class="sp"></div>'+
      (locked?'':'<span class="lnk" onclick="pmAll('+gi+',1)">全选</span><span class="dv">|</span><span class="lnk" onclick="pmAll('+gi+',0)">清空</span>')+
      '</div><div class="pmb" id="pmg'+gi+'"><div class="pm-i">'+
      g.items.map(function(it){
        var on=locked||r.perms.indexOf(it[0])>=0;
        return '<label class="pm-c'+(on?" on":"")+(locked?" dis":"")+'" title="'+esc(it[2])+'">'+
          '<input type="checkbox" class="pmk" data-k="'+it[0]+'"'+(on?" checked":"")+(locked?" disabled":"")+' onchange="pmTick(this,'+gi+')">'+
          '<span>'+esc(it[1])+'<div class="k">'+it[0]+'</div></span></label>';
      }).join("")+'</div></div></div>';
  });
  openModal("配置权限 · "+esc(r.name),body,
    '<button class="btn" onclick="closeAll()">'+(locked?"关闭":"取消")+'</button>'+
    (locked?'':'<button class="btn pri" onclick="savePerm(\''+r.id+'\')">保存权限</button>'),1);
}
function pmTick(el,gi){
  var lb=el.parentNode;
  while(lb&&lb.tagName!=="LABEL")lb=lb.parentNode;
  if(lb)lb.className="pm-c"+(el.checked?" on":"");
  if(gi!=null)pmCount(gi);
}
function pmAll(gi,on){
  var box=$("pmg"+gi);if(!box)return;
  var ks=box.querySelectorAll("input.pmk");
  for(var i=0;i<ks.length;i++){ks[i].checked=!!on;pmTick(ks[i],null)}
  pmCount(gi);
}
function pmCount(gi){
  var box=$("pmg"+gi),el=$("pmc"+gi);if(!box||!el)return;
  var ks=box.querySelectorAll("input.pmk"),n=0;
  for(var i=0;i<ks.length;i++)if(ks[i].checked)n++;
  el.textContent=n+" / "+ks.length;
}
function savePerm(id){
  if(!hasPerm("roles.perm")){toast("当前角色无权限配置权限","err");return}
  var r=roleById(id);if(!r)return;
  if(r.id==="admin"){toast("内置管理员固定拥有全部权限","err");return}
  var ks=[],boxes=document.querySelectorAll("#md input.pmk");
  for(var i=0;i<boxes.length;i++)if(boxes[i].checked)ks.push(boxes[i].getAttribute("data-k"));
  var scEl=$("pm_scope"),sc=scEl?scEl.value:r.scope;
  var before=r.perms.length+" 项 / "+SCOPE_NAME[r.scope];
  r.perms=ks;
  if(!r.builtin)r.scope=sc;
  addLog("调整角色权限",r.name,before,ks.length+" 项 / "+SCOPE_NAME[r.scope]);
  save();closeAll();render();
  toast(r.id===S.user.role?"权限已保存，已对当前账号生效":"权限已保存，绑定该角色的账号刷新后生效","ok");
}
function delRole(id){
  if(!hasPerm("roles.delete")){toast("当前角色无删除角色权限","err");return}
  var r=roleById(id);if(!r)return;
  if(r.builtin){toast("内置角色不可删除","err");return}
  var n=S.accounts.filter(function(a){return a.role===id}).length;
  if(n){toast("该角色下还有 "+n+" 个账号，请先在「账号管理」改派","err");return}
  if(r.id===S.user.role){toast("不能删除自己正在使用的角色","err");return}
  confirmBox("删除角色","确定删除角色 <b>"+esc(r.name)+"</b>？<br><span style=\"color:var(--ink3);font-size:13px\">删除后其权限配置一并移除，不可恢复。</span>","确认删除","doDelRole('"+id+"')",1);
}
function doDelRole(id){
  var r=roleById(id);if(!r)return;
  S.roles=S.roles.filter(function(x){return x.id!==id});
  addLog("删除角色",r.name,r.perms.length+" 项权限 / "+SCOPE_NAME[r.scope],"角色已删除");
  save();render();toast("角色已删除","ok");
}

  var g=function(k){var e=$(k);return e?e.value:""};
  S.settings={inbox:g("st_inbox"),cc:g("st_cc"),retain:g("st_retain"),maxSize:g("st_size"),
    autoExpire:g("st_exp"),blockIntercept:g("st_block")};
  addLog("修改系统设置","邮件汇总与合规配置","",S.settings.inbox+" / 抄送 "+S.settings.cc+" / 留存 "+S.settings.retain+" 个月");
  save();render();toast("设置已保存","ok");
}
function exportJson(){
  var data=JSON.stringify({jobs:S.jobs,subs:S.subs,accounts:S.accounts,settings:S.settings},null,2);
  var blob=new Blob([data],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="redstar-hr-data.json";a.click();
  toast("已导出 redstar-hr-data.json","ok");
}
function doReset(){
  seedAll();S.user=null;save();renderLogin();toast("已重置为初始数据","ok");
}

/* ==========================================================
   自动过期（B-15）
   ========================================================== */
function runExpire(manual){
  if(S.settings.autoExpire==="0"&&!manual)return 0;
  var n=0;
  S.jobs.forEach(function(j){
    if(j.status==="online"&&j.deadline<today()){
      j.status="expired";j.updated_at=now();j.updated_by="定时任务";n++;
      addLog("岗位自动过期",j.title,"在招","已过期（截止 "+j.deadline+"）· 已通知负责人 "+ownerName(j.owner));
    }
  });
  if(n){recalc();save()}
  if(manual){render();toast(n?"检测到 "+n+" 个过期岗位，已置为「已过期」":"未检测到过期岗位","ok")}
  return n;
}

/* ==========================================================
   启动
   ========================================================== */
if(!load()){seedAll()}
runExpire(0);
render();
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeAll()});
</script>
</body>
